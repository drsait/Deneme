<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASM Harcama Takip (GitHub Tabanlı)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-6 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- GitHub Bağlantı Ayarları -->
    <details class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
      <summary class="text-sm font-semibold cursor-pointer text-slate-700">⚙️ GitHub Repo & Token Ayarları</summary>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">GitHub Kullanıcı Adı</label>
          <input type="text" id="ghUser" placeholder="kullanici-adi" class="w-full border rounded-lg p-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Repo Adı</label>
          <input type="text" id="ghRepo" placeholder="asm-takip" class="w-full border rounded-lg p-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Personal Access Token (PAT)</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxx..." class="w-full border rounded-lg p-2 text-sm" />
        </div>
        <div class="sm:col-span-3 flex justify-end">
          <button onclick="saveConfig()" class="bg-slate-800 text-white text-xs px-4 py-2 rounded-lg hover:bg-slate-900">
            Ayarları Kaydet ve Verileri Çek
          </button>
        </div>
      </div>
    </details>

    <!-- Başlık & Ay Seçimi -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Aile Sağlığı Merkezi Harcama Takibi</h1>
        <p class="text-sm text-slate-500" id="syncStatus">Durum: Bağlantı bekleniyor...</p>
      </div>
      <div class="flex items-center gap-2">
        <label class="text-sm font-medium text-slate-600">Dönem:</label>
        <input type="month" id="filterMonth" class="border rounded-lg px-3 py-1.5 text-sm bg-white" />
      </div>
    </div>

    <!-- Yeni Gider Ekleme Formu -->
    <form id="expenseForm" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Tarih</label>
        <input type="date" id="date" required class="w-full border rounded-lg px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
        <select id="category" class="w-full border rounded-lg px-3 py-2 text-sm bg-white">
          <option>Tıbbi Sarf</option>
          <option>Temizlik & Hijyen</option>
          <option>Kırtasiye & Büro</option>
          <option>Fatura & Aidat</option>
          <option>Bakım & Onarım</option>
          <option>Diğer</option>
        </select>
      </div>
      <div class="lg:col-span-1">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Açıklama</label>
        <input type="text" id="desc" placeholder="Örn: Enjektör alımı" required class="w-full border rounded-lg px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Tutar (₺)</label>
        <input type="number" step="0.01" id="amount" placeholder="0.00" required class="w-full border rounded-lg px-3 py-2 text-sm" />
      </div>
      <button type="submit" id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition">
        + Gider Ekle
      </button>
    </form>

    <!-- Özet Kartları -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-blue-50 border border-blue-100 p-5 rounded-2xl">
        <span class="text-xs font-semibold text-blue-600 uppercase">Seçili Ay Toplamı</span>
        <div id="monthlyTotal" class="text-2xl font-bold text-blue-900 mt-1">₺0,00</div>
      </div>
      <div class="bg-emerald-50 border border-emerald-100 p-5 rounded-2xl">
        <span class="text-xs font-semibold text-emerald-600 uppercase">Toplam Kayıt Sayısı</span>
        <div id="recordCount" class="text-2xl font-bold text-emerald-900 mt-1">0 Adet</div>
      </div>
    </div>

    <!-- Harcama Listesi -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-600 text-xs border-b">
            <tr>
              <th class="p-3">Tarih</th>
              <th class="p-3">Kategori</th>
              <th class="p-3">Açıklama</th>
              <th class="p-3 text-right">Tutar</th>
              <th class="p-3 text-center">İşlem</th>
            </tr>
          </thead>
          <tbody id="expenseList" class="divide-y divide-slate-100 text-slate-700"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const FILE_PATH = 'giderler.json';
    let expenses = [];
    let fileSha = null;

    const dateInput = document.getElementById('date');
    const filterMonth = document.getElementById('filterMonth');
    const form = document.getElementById('expenseForm');
    const list = document.getElementById('expenseList');
    const monthlyTotalEl = document.getElementById('monthlyTotal');
    const recordCountEl = document.getElementById('recordCount');
    const statusEl = document.getElementById('syncStatus');
    const saveBtn = document.getElementById('saveBtn');

    // Varsayılan tarih
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
    filterMonth.value = today.slice(0, 7);

    // Ayarları yükle
    document.getElementById('ghUser').value = localStorage.getItem('gh_user') || '';
    document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
    document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

    function saveConfig() {
      localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      fetchDataFromGitHub();
    }

    async function fetchDataFromGitHub() {
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const token = localStorage.getItem('gh_token');

      if (!user || !repo || !token) {
        statusEl.textContent = 'Durum: GitHub ayarlarınızı girin.';
        statusEl.className = 'text-sm text-amber-600';
        return;
      }

      statusEl.textContent = 'Durum: Veriler GitHub\'dan çekiliyor...';
      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `token ${token}` }
        });

        if (res.status === 404) {
          expenses = [];
          fileSha = null;
          statusEl.textContent = 'Durum: giderler.json bulunamadı (ilk kayıtta oluşturulacak).';
        } else if (res.ok) {
          const data = await res.json();
          fileSha = data.sha;
          // UTF-8 decode
          const content = decodeURIComponent(escape(atob(data.content)));
          expenses = JSON.parse(content);
          statusEl.textContent = 'Durum: GitHub ile eşitlendi ✓';
          statusEl.className = 'text-sm text-emerald-600';
        } else {
          throw new Error('Yetki veya bağlantı hatası');
        }
      } catch (err) {
        statusEl.textContent = 'Durum: Bağlantı hatası (Token veya repo bilgilerini kontrol edin)';
        statusEl.className = 'text-sm text-rose-600';
      }
      render();
    }

    async function pushDataToGitHub() {
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const token = localStorage.getItem('gh_token');

      if (!token) return alert('GitHub token bilgisi eksik!');

      saveBtn.disabled = true;
      saveBtn.textContent = 'Kaydediliyor...';
      statusEl.textContent = 'Durum: GitHub\'a yazılıyor...';

      // UTF-8 encode
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(expenses, null, 2))));
      
      const payload = {
        message: 'Gider kaydı güncellendi [skip ci]',
        content: content,
        sha: fileSha || undefined
      };

      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const resData = await res.json();
          fileSha = resData.content.sha;
          statusEl.textContent = 'Durum: GitHub\'a kaydedildi ✓';
          statusEl.className = 'text-sm text-emerald-600';
        } else {
          throw new Error('Kayıt başarısız');
        }
      } catch (err) {
        alert('GitHub\'a kaydedilirken hata oluştu.');
        statusEl.textContent = 'Durum: Kayıt hatası!';
        statusEl.className = 'text-sm text-rose-600';
      }

      saveBtn.disabled = false;
      saveBtn.textContent = '+ Gider Ekle';
      render();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const expense = {
        id: Date.now(),
        date: dateInput.value,
        category: document.getElementById('category').value,
        desc: document.getElementById('desc').value,
        amount: parseFloat(document.getElementById('amount').value)
      };
      expenses.unshift(expense);
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
      await pushDataToGitHub();
    });

    async function deleteExpense(id) {
      if (!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return;
      expenses = expenses.filter(item => item.id !== id);
      await pushDataToGitHub();
    }

    function render() {
      const selectedMonth = filterMonth.value;
      const filtered = expenses.filter(item => item.date.startsWith(selectedMonth));
      
      list.innerHTML = '';
      let total = 0;

      if (filtered.length === 0) {
        list.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Bu ay için harcama kaydı bulunmuyor.</td></tr>`;
      } else {
        filtered.forEach(item => {
          total += item.amount;
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';
          tr.innerHTML = `
            <td class="p-3 font-mono text-xs">${item.date}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700">${item.category}</span></td>
            <td class="p-3">${item.desc}</td>
            <td class="p-3 text-right font-semibold">₺${item.amount.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}</td>
            <td class="p-3 text-center">
              <button onclick="deleteExpense(${item.id})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold px-2 py-1 rounded">Sil</button>
            </td>
          `;
          list.appendChild(tr);
        });
      }

      monthlyTotalEl.textContent = `₺${total.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}`;
      recordCountEl.textContent = `${filtered.length} Adet`;
    }

    filterMonth.addEventListener('change', render);

    // Sayfa açıldığında otomatik veriyi çek
    if (localStorage.getItem('gh_token')) {
      fetchDataFromGitHub();
    }
  </script>
</body>
</html>
