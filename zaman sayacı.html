<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelişmiş Zaman Sayacı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1b4b, #09090b);
      color: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .card {
      background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
      padding: 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      width: 90%; max-width: 500px;
    }
    .pulse {
      display: inline-block; width: 8px; height: 8px; background: #818cf8;
      border-radius: 50%; margin-right: 8px; animation: blink 1.5s infinite;
    }
    @keyframes blink { 50% { opacity: 0.3; } }
    h2 { margin-bottom: 5px; font-size: 1.5rem; }
    .day-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    p { color: #a1a1aa; font-size: 0.85rem; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .box {
      background: rgba(255,255,255,0.05); padding: 15px 10px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .val { font-size: 1.8rem; font-weight: bold; color: #fff; font-variant-numeric: tabular-nums; }
    .lbl { font-size: 0.7rem; color: #a1a1aa; text-transform: uppercase; margin-top: 5px; }
    .highlight { color: #818cf8; }
    .total-stats {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-around;
      letter-spacing: 0.02em;
    }
    .total-stats span strong {
      color: #e2e8f0;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div style="font-size: 0.75rem; color: #a5b4fc; margin-bottom: 10px;">
      <span class="pulse"></span> CANLI AKIŞ
    </div>
    <h2>Geçen Süre</h2>
    <div class="day-badge" id="current-day">Yükleniyor...</div>
    <p>24 Mayıs 2015 Pazar, 15:00'dan itibaren</p>
    
    <div class="grid">
      <div class="box"><div class="val" id="y">0</div><div class="lbl">Yıl</div></div>
      <div class="box"><div class="val" id="mo">0</div><div class="lbl">Ay</div></div>
      <div class="box"><div class="val" id="d">0</div><div class="lbl">Gün</div></div>
      <div class="box"><div class="val" id="h">00</div><div class="lbl">Saat</div></div>
      <div class="box"><div class="val" id="m">00</div><div class="lbl">Dakika</div></div>
      <div class="box"><div class="val highlight" id="s">00</div><div class="lbl">Saniye</div></div>
    </div>

    <div class="total-stats">
      <span>Toplam: <strong id="tot-m">0</strong> Ay</span>
      <span>•</span>
      <span><strong id="tot-w">0</strong> Hafta</span>
      <span>•</span>
      <span><strong id="tot-d">0</strong> Gün</span>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const start = new Date(2015, 4, 24, 15, 0, 0);
      const daysOfWeek = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

      function update() {
        const now = new Date();
        
        document.getElementById('current-day').innerText = "Bugün: " + daysOfWeek[now.getDay()];

        let y = now.getFullYear() - start.getFullYear();
        let mo = now.getMonth() - start.getMonth();
        let d = now.getDate() - start.getDate();
        let h = now.getHours() - start.getHours();
        let m = now.getMinutes() - start.getMinutes();
        let s = now.getSeconds() - start.getSeconds();
        
        if (s < 0) { s += 60; m--; }
        if (m < 0) { m += 60; h--; }
        if (h < 0) { h += 24; d--; }
        if (d < 0) { 
          const prev = new Date(now.getFullYear(), now.getMonth(), 0);
          d += prev.getDate(); mo--; 
        }
        if (mo < 0) { mo += 12; y--; }
        
        document.getElementById('y').innerText = y;
        document.getElementById('mo').innerText = mo;
        document.getElementById('d').innerText = d;
        document.getElementById('h').innerText = String(h).padStart(2, '0');
        document.getElementById('m').innerText = String(m).padStart(2, '0');
        document.getElementById('s').innerText = String(s).padStart(2, '0');

        // Toplam süre hesaplamaları
        const diffMs = now - start;
        const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const totalWeeks = Math.floor(totalDays / 7);
        const totalMonths = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());

        document.getElementById('tot-m').innerText = totalMonths.toLocaleString('tr-TR');
        document.getElementById('tot-w').innerText = totalWeeks.toLocaleString('tr-TR');
        document.getElementById('tot-d').innerText = totalDays.toLocaleString('tr-TR');
      }

      update();
      setInterval(update, 1000);
    });
  </script>
</body>
</html>
