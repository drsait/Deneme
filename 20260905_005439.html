<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>HTML Klonlayıcı & Düzenleyici</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 1000px; margin: auto; }
    input, textarea, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    textarea { height: 350px; font-family: monospace; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
    iframe { width: 100%; height: 350px; border: 1px solid #ccc; margin-top: 15px; }
  </style>
</head>
<body>

  <input type="text" id="targetUrl" placeholder="Kaynak kodu çekilecek URL (örn: https://example.com)">
  <button onclick="fetchSource()">Kodu Çek</button>

  <textarea id="codeEditor" placeholder="HTML kodları buraya gelecek..."></textarea>

  <div class="btn-group">
    <button onclick="downloadCode()">İndir</button>
    <button onclick="runCode()">Çalıştır</button>
    <button onclick="uploadToGithub()">GitHub'a Yükle</button>
  </div>

  <input type="text" id="fileName" value="index.html" placeholder="Dosya adı (örn: index.html)">
  <input type="password" id="ghToken" placeholder="GitHub Personal Access Token">

  <h3>Önizleme:</h3>
  <iframe id="preview"></iframe>

  <script>
    const REPO = 'drsait/Deneme';

    async function fetchSource() {
      const url = document.getElementById('targetUrl').value;
      if (!url) return alert('Lütfen URL girin.');
      try {
        const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
        const html = await res.text();
        document.getElementById('codeEditor').value = html;
      } catch (err) {
        alert('Kod çekilemedi: ' + err.message);
      }
    }

    function downloadCode() {
      const content = document.getElementById('codeEditor').value;
      const fileName = document.getElementById('fileName').value || 'index.html';
      const blob = new Blob([content], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
    }

    function runCode() {
      const content = document.getElementById('codeEditor').value;
      document.getElementById('preview').srcdoc = content;
    }

    async function uploadToGithub() {
      const token = document.getElementById('ghToken').value;
      const path = document.getElementById('fileName').value || 'index.html';
      const content = document.getElementById('codeEditor').value;

      if (!token) return alert('GitHub Token zorunludur.');

      const encodedContent = btoa(unescape(encodeURIComponent(content)));
      const apiUrl = `https://api.github.com/repos/${REPO}/contents/${path}`;

      try {
        let sha = null;
        const checkRes = await fetch(apiUrl, {
          headers: { 'Authorization': `token ${token}` }
        });
        if (checkRes.ok) {
          const checkData = await checkRes.json();
          sha = checkData.sha;
        }

        const res = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Web'den yüklendi: ${path}`,
            content: encodedContent,
            sha: sha || undefined
          })
        });

        if (res.ok) alert(`${REPO} reposuna yüklendi!`);
        else {
          const err = await res.json();
          alert('Hata: ' + err.message);
        }
      } catch (e) {
        alert('İşlem başarısız: ' + e.message);
      }
    }
  </script>
</body>
</html>
