<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Uzay Saati</title>
    <style>
        body {
            margin: 0;
            background: #0b0b1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            color: #00ffff;
        }
        .clock-box {
            background: rgba(15, 15, 35, 0.8);
            border: 2px solid #ff00ff;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff00ff;
            text-align: center;
            animation: pulse 2s infinite alternate;
        }
        #time {
            font-size: 3rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px #ff00ff; }
            100% { box-shadow: 0 0 30px #00ffff; }
        }
    </style>
</head>
<body>
    <div class="clock-box">
        <h3>UZAY ZAMANI</h3>
        <div id="time">00:00:00</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('tr-TR');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
