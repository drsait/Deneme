<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yörünge Hızı Hesaplayıcı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body {
      background: #05070f;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .glass-panel {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 440px;
      background: rgba(13, 20, 36, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
    }

    .title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 24px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    label {
      font-size: 0.85rem;
      color: #8da2c0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .num-input-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 4px 10px;
    }

    .num-input-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      width: 90px;
      text-align: right;
      outline: none;
    }

    .num-input-box span {
      font-size: 0.85rem;
      color: #8da2c0;
      margin-left: 6px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: #1a233a;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      margin-bottom: 12px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 12px #00f0ff;
      cursor: pointer;
    }

    .quick-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .chip-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #8da2c0;
      padding: 6px 0;
      font-size: 0.72rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .chip-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: #00f0ff;
      color: #fff;
    }

    .results {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 16px;
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .result-box { text-align: center; }

    .res-title {
      font-size: 0.75rem;
      color: #8da2c0;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .res-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38ef7d;
      text-shadow: 0 0 8px rgba(56, 239, 125, 0.4);
    }

    .unit {
      font-size: 0.75rem;
      color: #8da2c0;
      font-weight: normal;
    }
  </style>
</head>
<body>

  <canvas id="space-canvas"></canvas>

  <div class="glass-panel">
    <div class="title">Yörünge Hızı Simülatörü</div>

    <div>
      <div class="input-wrap">
        <label for="numInput">Yükseklik</label>
        <div class="num-input-box">
          <input type="number" id="numInput" min="0" max="40000" value="0">
          <span>km</span>
        </div>
      </div>

      <input type="range" id="rangeInput" min="0" max="40000" step="1" value="0">

      <div class="quick-buttons">
        <button class="chip-btn" onclick="applyVal(0)">0 km</button>
        <button class="chip-btn" onclick="applyVal(408)">ISS (408 km)</button>
        <button class="chip-btn" onclick="applyVal(20200)">GPS (20.200 km)</button>
        <button class="chip-btn" onclick="applyVal(35786)">GEO (35.786 km)</button>
      </div>
    </div>

    <div class="results">
      <div class="result-box">
        <div class="res-title">Saniyelik Hız</div>
        <div class="res-val" id="kmsVal">7.91 <span class="unit">km/s</span></div>
      </div>
      <div class="result-box">
        <div class="res-title">Saatlik Hız</div>
        <div class="res-val" id="kmhVal">28.468 <span class="unit">km/sa</span></div>
      </div>
    </div>
  </div>

  <script>
    // Arka plan animasyonu
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5,
        a: Math.random(),
        v: 0.05 + Math.random() * 0.15
      });
    }

    function draw() {
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.y -= s.v;
        if (s.y < 0) { s.y = canvas.height; s.x = Math.random() * canvas.width; }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.a})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();

    // Fizik ve Eşitleme
    const range = document.getElementById('rangeInput');
    const num = document.getElementById('numInput');
    const kmsVal = document.getElementById('kmsVal');
    const kmhVal = document.getElementById('kmhVal');

    const GM = 398600.4418;
    const R_EARTH = 6371;

    function calculate(val) {
      let h = parseFloat(val);
      if (isNaN(h) || h < 0) h = 0;

      const r = R_EARTH + h;
      const v_kms = Math.sqrt(GM / r);
      const v_kmh = v_kms * 3600;

      kmsVal.innerHTML = `${v_kms.toFixed(2)} <span class="unit">km/s</span>`;
      kmhVal.innerHTML = `${Math.round(v_kmh).toLocaleString('tr-TR')} <span class="unit">km/sa</span>`;
    }

    range.addEventListener('input', (e) => {
      num.value = e.target.value;
      calculate(e.target.value);
    });

    num.addEventListener('input', (e) => {
      let val = e.target.value;
      if (val === '') return;
      range.value = Math.min(val, 40000);
      calculate(val);
    });

    function applyVal(v) {
      range.value = v;
      num.value = v;
      calculate(v);
    }

    calculate(0);
  </script>
</body>
</html>
