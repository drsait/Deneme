<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yörünge Hızı Hesaplayıcı</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 12px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    .result { margin-top: 20px; font-size: 1.1em; }
  </style>
</head>
<body>
  <label for="altitude">Dünyadan Yükseklik (km):</label>
  <input type="number" id="altitude" placeholder="Örn: 230" value="230">
  <button onclick="calculate()">Hesapla</button>

  <div class="result" id="output"></div>

  <script>
    function calculate() {
      const h = parseFloat(document.getElementById('altitude').value);
      if (isNaN(h) || h < 0) {
        document.getElementById('output').innerHTML = "Lütfen geçerli bir yükseklik girin.";
        return;
      }
      
      const GM = 398600.4418; // Standart çekim parametresi (km^3/s^2)
      const R = 6371;         // Dünya ortalama yarıçapı (km)
      const r = R + h;        // Toplam yörünge yarıçapı (km)
      
      const v_kms = Math.sqrt(GM / r);
      const v_kmh = v_kms * 3600;

      document.getElementById('output').innerHTML = `
        <strong>Sonuç:</strong><br>
        • Hız: <strong>${v_kms.toFixed(2)} km/s</strong><br>
        • Hız: <strong>${Math.round(v_kmh).toLocaleString('tr-TR')} km/saat</strong>
      `;
    }
    calculate();
  </script>
</body>
</html>
