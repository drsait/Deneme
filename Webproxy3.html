<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tam Proxy Tarayıcı</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      background: var(--card);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    input {
      flex: 1;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .viewport { flex: 1; width: 100%; height: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .status-badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="targetUrl" placeholder="https://example.com" onkeydown="if(event.key==='Enter') navigate()">
    <button onclick="navigate()" id="btnGo">Git</button>
  </div>

  <div class="viewport">
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div id="statusBar" class="status-badge">Yükleniyor...</div>
  </div>

  <script>
    const PROXY_URL = 'https://polished-snow-38e2.yenibirhesap047.workers.dev';

    function toProxyUrl(relativeOrAbsoluteUrl, baseUrl) {
      try {
        if (!relativeOrAbsoluteUrl || relativeOrAbsoluteUrl.startsWith('data:') || relativeOrAbsoluteUrl.startsWith('javascript:')) {
          return relativeOrAbsoluteUrl;
        }
        const absolute = new URL(relativeOrAbsoluteUrl, baseUrl).href;
        return `${PROXY_URL}?url=${encodeURIComponent(absolute)}`;
      } catch {
        return relativeOrAbsoluteUrl;
      }
    }

    async function navigate(targetUrlOverride = null) {
      let url = targetUrlOverride || document.getElementById('targetUrl').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      document.getElementById('targetUrl').value = url;

      const btn = document.getElementById('btnGo');
      const status = document.getElementById('statusBar');
      const frame = document.getElementById('proxyFrame');

      btn.disabled = true;
      status.style.display = 'block';
      status.textContent = 'Sayfa yükleniyor...';

      try {
        const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const html = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const baseUrl = new URL(url);

        // Orijinal siteyi kök alan adı olarak ekle
        let baseEl = doc.querySelector('base');
        if (!baseEl) {
          baseEl = doc.createElement('base');
          doc.head.prepend(baseEl);
        }
        baseEl.href = baseUrl.origin + '/';

        // Resimleri ve medya öğelerini proxy'ye yönlendir
        doc.querySelectorAll('img, source, video, audio').forEach(el => {
          const src = el.getAttribute('src');
          if (src) el.setAttribute('src', toProxyUrl(src, baseUrl));
          el.removeAttribute('srcset');
        });

        // Harici CSS dosyalarını proxy'ye yönlendir
        doc.querySelectorAll('link[rel="stylesheet"]').forEach(el => {
          const href = el.getAttribute('href');
          if (href) el.setAttribute('href', toProxyUrl(href, baseUrl));
        });

        // Link tıklamalarını yakalayıp hedef sitenin tam kök adresiyle birleştiren dinleyici
        const interceptor = doc.createElement('script');
        interceptor.textContent = `
          document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (link) {
              const rawHref = link.getAttribute('href');
              if (rawHref && !rawHref.startsWith('javascript:') && !rawHref.startsWith('#')) {
                e.preventDefault();
                try {
                  const absoluteUrl = new URL(rawHref, "${baseUrl.origin}").href;
                  window.parent.postMessage({ type: 'PROXY_NAVIGATE', url: absoluteUrl }, '*');
                } catch(err) {}
              }
            }
          }, true);
        `;
        doc.head.appendChild(interceptor);

        frame.srcdoc = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        status.style.display = 'none';
      } catch (err) {
        status.textContent = 'Hata: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'PROXY_NAVIGATE') {
        let rawTarget = e.data.url;
        if (rawTarget.includes('?url=')) {
          const parsed = new URL(rawTarget);
          rawTarget = parsed.searchParams.get('url') || rawTarget;
        }
        navigate(rawTarget);
      }
    });
  </script>
</body>
</html>
