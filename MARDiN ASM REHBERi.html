<title>MARDİN ASM AHB REHBERİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--p:#6366f1;--pink:#ec4899}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',sans-serif}
::selection{background:#8b5cf6;color:#fff}
body{background:#080c14;color:#f8fafc;min-height:100vh;padding:24px 14px 80px;overflow-x:hidden}
.glow{position:fixed;border-radius:50%;filter:blur(110px);z-index:0;pointer-events:none;opacity:.38;animation:flt 16s infinite alternate ease-in-out}
.g1{width:480px;height:480px;background:radial-gradient(circle,#6366f1,#a855f7);top:-120px;left:-100px}
.g2{width:520px;height:520px;background:radial-gradient(circle,#ec4899,#f43f5e);bottom:30px;right:-130px;animation-duration:20s}
#spot{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.12) 0%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%);z-index:0}
@keyframes flt{0%{transform:translate(0,0) scale(1)}50%{transform:translate(75px,55px) scale(1.15)}100%{transform:translate(-45px,85px) scale(.92)}}
.cnt{max-width:940px;margin:0 auto;position:relative;z-index:1}
header{text-align:center;margin-bottom:24px}
h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8 0%,#c084fc 50%,#f43f5e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.025em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.sc{background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:14px;text-align:center;transition:.3s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
.sc:hover{transform:translateY(-5px) scale(1.02);border-color:rgba(165,180,252,.4);box-shadow:0 14px 30px -6px rgba(99,102,241,.35)}
.sc-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;font-weight:700}
.sc-v{font-size:1.7rem;font-weight:800;margin-top:2px;display:inline-block}
.bump{animation:bp .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bp{50%{transform:scale(1.25);color:#f472b6}}
.flt{background:rgba(255,255,255,.05);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;display:flex;gap:10px;margin-bottom:22px;box-shadow:0 10px 40px -10px rgba(0,0,0,.5)}
@media (max-width:640px){.flt{flex-direction:column}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:1.7rem}}
input,select{padding:11px 16px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(15,23,42,.75);color:#fff;font-size:.92rem;outline:none;transition:.2s}
input{flex:1}
input:focus,select:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.25)}
select option{background:#0f172a;color:#fff}
.card{background:rgba(255,255,255,.035);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:18px;margin-bottom:18px;overflow:hidden;opacity:0;transform:translateY(16px);animation:popIn .4s cubic-bezier(.34,1.4,.64,1) forwards;transition:.25s}
@keyframes popIn{to{opacity:1;transform:translateY(0)}}
.card:hover{border-color:rgba(255,255,255,.22);box-shadow:0 16px 40px -10px rgba(0,0,0,.55)}
.c-head{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.025);padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.asm-l{font-size:1.1rem;font-weight:700;color:#f1f5f9;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.asm-l:hover{color:#a5b4fc;transform:translateX(3px)}
.dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#3b82f6);box-shadow:0 0 8px #06b6d4}
.btn{background:rgba(99,102,241,.15);border:1px solid rgba(165,180,252,.3);color:#c7d2fe;font-size:.78rem;font-weight:700;padding:6px 14px;border-radius:999px;text-decoration:none;white-space:nowrap;transition:.2s}
.btn:hover{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;transform:scale(1.04)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{color:#64748b;font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left}
td{padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.035);color:#e2e8f0;transition:.2s}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.03)}

/* AHB Tıklanabilir Rozet */
.ahb-b{font-family:'Plus Jakarta Sans',monospace;font-weight:700;font-size:.85rem;background:rgba(255,255,255,.06);padding:5px 12px;border-radius:8px;color:#93c5fd;border:1px solid rgba(147,197,253,.18);display:inline-block;text-decoration:none;transition:.2s}
.ahb-b:hover{background:rgba(147,197,253,.2);color:#fff;transform:scale(1.05);box-shadow:0 0 10px rgba(147,197,253,.3)}

.m-badge{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:999px;margin-left:8px;box-shadow:0 0 14px rgba(236,72,153,.6);display:inline-block;animation:wgl 1.8s infinite}
@keyframes wgl{50%{transform:translateY(-2px) scale(1.06)}}
.uzm{color:#38bdf8;font-weight:600}
.vac{background:rgba(239,68,68,.18);color:#f87171;font-size:.74rem;font-weight:800;padding:2px 7px;border-radius:6px;border:1px solid rgba(248,113,113,.3)}
.emp{text-align:center;padding:50px 20px;background:rgba(255,255,255,.03);border-radius:18px;border:1px dashed rgba(255,255,255,.15);color:#94a3b8}

/* Doktor Gizleme Modu ve Grid Düzeni */
body.gizle-dr th.col-dr, body.gizle-dr td.col-dr { display: none; }
body.gizle-dr table { display: none; }
body.gizle-dr .card-body-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  padding: 16px 20px;
}
@media (min-width: 768px) {
  body.gizle-dr .card-body-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
body.gizle-dr .grid-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  padding: 10px 12px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

tr.hl{
  background:linear-gradient(90deg,rgba(236,72,153,.35) 0%,rgba(139,92,246,.3) 50%,rgba(6,182,212,.25) 100%)!important;
  box-shadow:0 0 25px rgba(236,72,153,.5),inset 0 0 15px rgba(236,72,153,.3)!important;
  animation:neonGlow 1.8s infinite alternate ease-in-out;
}
@keyframes neonGlow{
  0%{box-shadow:0 0 18px rgba(236,72,153,.45),inset 0 0 10px rgba(236,72,153,.25)}
  100%{box-shadow:0 0 32px rgba(168,85,247,.7),inset 0 0 20px rgba(6,182,212,.4)}

tr.hl td:first-child{border-left:5px solid #f43f5e;box-shadow:inset 3px 0 10px #f43f5e}
tr.hl .ahb-b{background:#f43f5e;border-color:#fda4af;color:#fff!important;box-shadow:0 0 16px rgba(244,63,94,.7)}
tr.hl td{color:#fff!important;font-weight:700}

const data = D.map(([i, a, b]) => ({
  ilce: i,
  asm: a,
  units: b.map(u => {
    const [n, h] = u.split(':');
    return { no: n, h };
  })
}));

const qI = document.getElementById('q'),
      dI = document.getElementById('d'),
      lE = document.getElementById('list'),
      spot = document.getElementById('spot');

window.onmousemove = e => {
  spot.style.left = e.clientX + 'px';
  spot.style.top = e.clientY + 'px';
};

[...new Set(data.map(x => x.ilce))].sort().forEach(c => {
  dI.innerHTML += `<option value="${c}">${c}</option>`;
});

const S_URL = "https://www.google.com/search?udm=50&q=";
const S_ASMPAT = " resmi web sayfası ve iletişim bilgileri, çalışan aile hekimi ve aile sağlığı çalışanın adı soyadı çalıştığı birimin numarasıyla birlikte bul ve tablo yap detaylı ve ayrıntılı olsun.her satıra birimleri ayrı ayrı yaz";
const S_AHBPAT = " nolu aile hekimliği birimi resmi web sayfası ve iletişim bilgileri, çalışan aile hekimi ve aile sağlığı çalışanın adı soyadı bul detaylı ve ayrıntılı olsun.";

function aV(id, v) {
  const el = document.getElementById(id);
  if (el.innerText != v) {
    el.innerText = v;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
}

function render(items, q = '') {
  let tA = 0, tU = 0, tM = 0;
  items.forEach(x => {
    tA += x.units.length;
    x.units.forEach(u => {
      if (u.h.includes('(uzman)')) tU++;
      if (q && (u.no.includes(q) || u.h.toLowerCase().includes(q) || x.asm.toLowerCase().includes(q))) tM++;
    });
  });

  aV('s_asm', items.length);
  aV('s_ahb', tA);
  aV('s_mat', q ? tM : tA);
  aV('s_uzm', tU);

  if (!items.length) {
    lE.innerHTML = '<div class="emp">✨🔍✨<br><br>Eşleşen kayıt bulunamadı.</div>';
    return;
  }

  lE.innerHTML = items.map((x, idx) => {
    const asmLink = S_URL + encodeURIComponent('Mardin ' + x.asm + S_ASMPAT);
    
    if (!DOKTORLARI_GOSTER) {
      const gridItems = x.units.map(u => {
        const m = q && (u.no.includes(q) || u.h.toLowerCase().includes(q));
        const ahbLink = S_URL + encodeURIComponent("Mardin " + x.ilce + " " + x.asm + " " + u.no + S_AHBPAT);
        return `<div class="grid-item ${m ? 'hl' : ''}"><a href="${ahbLink}" target="_blank" rel="noopener noreferrer" class="ahb-b" title="Bu birim için detaylı arama yap">${u.no} Nolu AHB</a>${m ? '<span class="m-badge">⚡</span>' : ''}</div>`;
      }).join('');

      return `<div class="card" style="animation-delay:${Math.min(idx * 0.03, 0.35)}s"><div class="c-head"><a href="${asmLink}" target="_blank" rel="noopener noreferrer" class="asm-l"><span class="dot"></span><span>${x.asm}</span></a><a href="${asmLink}" target="_blank" rel="noopener noreferrer" class="btn">İletişim Bilgileri ↗</a></div><div class="card-body-grid">${gridItems}</div></div>`;
    } else {
      const rows = x.units.map(u => {
        const m = q && (u.no.includes(q) || u.h.toLowerCase().includes(q));
        const vac = u.h.toUpperCase().includes('BOŞ');
        const uz = u.h.includes('(uzman)');
        let h = vac ? '<span class="vac">BOŞ BİRİM</span>' : (uz ? u.h.replace('(uzman)', '<span class="uzm">(uzman)</span>') : u.h);
        const ahbLink = S_URL + encodeURIComponent("Mardin " + x.ilce + " " + x.asm + " " + u.no + S_AHBPAT);

        return `<tr class="${m ? 'hl' : ''}"><td style="width:210px"><a href="${ahbLink}" target="_blank" rel="noopener noreferrer" class="ahb-b" title="Bu birim için detaylı arama yap">${u.no} Nolu AHB</a></td><td class="col-dr">${h}${m ? '<span class="m-badge">⚡ Aranan</span>' : ''}</td></tr>`;
      }).join('');

      return `<div class="card" style="animation-delay:${Math.min(idx * 0.03, 0.35)}s"><div class="c-head"><a href="${asmLink}" target="_blank" rel="noopener noreferrer" class="asm-l"><span class="dot"></span><span>${x.asm}</span></a><a href="${asmLink}" target="_blank" rel="noopener noreferrer" class="btn">İletişim Bilgileri ↗</a></div><table><thead><tr><th style="width:210px">Birim No</th><th class="col-dr">Aile Hekimi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
  }).join('');
}

function flt() {
  const q = qI.value.trim().toLowerCase(), d = dI.value;
  render(data.filter(x => (!d || x.ilce === d) && (x.asm.toLowerCase().includes(q) || x.units.some(u => u.no.includes(q) || u.h.toLowerCase().includes(q)))), q);
}

qI.oninput = flt;
dI.onchange = flt;
render(data);
