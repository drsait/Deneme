<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosyalar</title>
    <style>
        :root { --bg: linear-gradient(135deg, #6366f1, #a855f7); --card: rgba(255,255,255,0.95); --p: #6366f1; --d: #f43f5e; --w: #f59e0b; --s: #10b981; --t: #0f172a; --b: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--t); min-height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 100%; max-width: 900px; }
        h1 { text-align: center; color: #fff; margin-bottom: 24px; font-size: 1.75rem; }
        .layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        @media(max-width:768px){ .layout { grid-template-columns: 1fr; } }
        .card { background: var(--card); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.4); }
        input, button, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--b); border-radius: 10px; font-size: 0.9rem; outline: none; }
        button { background: var(--p); color: #fff; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .row { display: flex; gap: 8px; }
        .toast { font-size: 0.8rem; padding: 6px; border-radius: 6px; margin-top: 8px; display: none; text-align: center; font-weight: 500; }
        .list { list-style: none; max-height: 450px; overflow-y: auto; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8fafc; border: 1px solid var(--b); border-radius: 8px; margin-bottom: 8px; gap: 8px; }
        .item a { color: var(--t); text-decoration: none; font-weight: 500; word-break: break-all; margin-right: 8px; min-width: 0; }
        .file-date { font-size: 0.78rem; color: #64748b; white-space: nowrap; font-weight: 500; }
        .actions { display: none; gap: 4px; flex-shrink: 0; }
        .btn-sm { padding: 6px 10px; font-size: 0.85rem; width: auto; border-radius: 6px; background: transparent; border: 1px solid; cursor: pointer; font-weight: bold; }
        .btn-code { color: var(--p); border-color: rgba(99,102,241,0.4); background: rgba(99,102,241,0.05); }
        .btn-rename { color: var(--w); border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.05); }
        .btn-archive { color: #8b5cf6; border-color: rgba(139,92,246,0.4); background: rgba(139,92,246,0.05); }
        .btn-delete { color: var(--d); border-color: rgba(244,63,94,0.4); background: rgba(244,63,94,0.05); }
        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: flex-start; justify-content: center; padding-top: 20px; z-index: 100; display: none; overflow-y: auto; }
        .modal-box { background: #fff; padding: 20px; border-radius: 16px; width: 90%; max-width: 360px; margin-bottom: 20px; }
        .code-editor-wrap { position: relative; width: 100%; margin-bottom: 10px; }
        #code-input { resize: vertical; max-height: 42vh; font-family: monospace; font-size: 0.85rem; padding-top: 36px; display: block; }
        .editor-tool-btn { position: absolute; top: 6px; width: auto; padding: 4px 8px; font-size: 0.72rem; font-weight: 600; color: #475569; background: rgba(255,255,255,0.9); border: 1px solid #cbd5e1; border-radius: 6px; backdrop-filter: blur(8px); z-index: 30; cursor: pointer; user-select: none; }
        .editor-tool-btn:hover { background: #f1f5f9; }
        .fullscreen-editor { position: fixed !important; inset: 0; z-index: 10001; background: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; }
        .fullscreen-editor #code-input { width: 100%; height: 100%; max-height: none; resize: none; padding: 50px 16px 16px; border: none; border-radius: 0; }
        .fullscreen-editor .editor-tool-btn { position: fixed; top: 10px; }
        .menu-btn { background: #f1f5f9; border: 1.5px solid var(--b); color: var(--t); border-radius: 10px; padding: 12px; text-align: center; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .menu-btn.active { background: var(--p); color: #fff; border-color: var(--p); }
        #preview { position: fixed; inset: 0; background: #fff; z-index: 10002; display: none; }
        #preview iframe { width: 100%; height: 100%; border: none; }
        #close-btn { position: fixed; top: 20px; right: 20px; background: var(--d); color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; font-weight: bold; cursor: grab; z-index: 10003; box-shadow: 0 4px 12px rgba(244,63,94,0.4); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="wrapper">
    <h1>Dosyalar</h1>
    <div class="layout">
        <div>
            <div class="card">
                <div id="auth-box" class="row">
                    <input type="password" id="token" placeholder="Şifreyi girin">
                    <button style="width:auto" onclick="auth(true)">Giriş</button>
                </div>
                <div id="logout-box" class="row hidden">
                    <button style="background:var(--d)" onclick="logout()">Çıkış</button>
                    <button id="edit-toggle" class="btn-sm" style="color:var(--p); border-color:var(--p)" onclick="toggleEdit()">⚙️</button>
                    <button class="btn-sm" style="color:var(--p); border-color:var(--p)" onclick="location.reload()">🔄</button>
                </div>
                <div id="auth-toast" class="toast"></div>
            </div>
            <div id="sidebar" class="card hidden">
                <button class="menu-btn active" id="tab-f" onclick="switchTab('files')">📄 Dosyalarım</button>
                <button class="menu-btn" id="tab-a" onclick="switchTab('archive')">📦 Arşiv</button>
                <hr style="margin:12px 0; border:none; border-top:1px dashed var(--b)">
                <input type="file" id="file" class="hidden" onchange="upload()">
                <button class="menu-btn" onclick="$('file').click()">📁 Dosya Yükle</button>
                <button class="menu-btn" onclick="openCodeModal()">&lt;/&gt; Dosya Ekle</button>
                <div id="upload-toast" class="toast"></div>
            </div>
        </div>
        <div id="content" class="card hidden">
            <div id="view-title" style="font-weight:700; font-size:1.1rem; margin-bottom:12px; color:var(--p)">📄 Dosyalarım</div>
            <ul id="file-list" class="list"><li style="text-align:center; color:#64748b; padding:20px;">Yükleniyor...</li></ul>
            <div id="list-toast" class="toast"></div>
        </div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-box">
        <h4 style="margin-bottom:10px; font-size:0.95rem;">Yeniden Adlandır</h4>
        <input type="text" id="new-name" style="margin-bottom:10px;" placeholder="Yeni Dosya Adı">
        <div class="row">
            <button style="background:#cbd5e1; color:#334155" onclick="$('modal').style.display='none'">İptal</button>
            <button onclick="saveRename()">Kaydet</button>
        </div>
    </div>
</div>

<div id="code-modal" class="modal">
    <div class="modal-box" style="max-width: 440px;">
        <h4 id="code-modal-title" style="margin-bottom:10px; font-size:0.95rem;">İçerik İşlemleri</h4>
        <input type="text" id="file-name" placeholder="Dosya adı" style="margin-bottom:10px;">
        <div class="code-editor-wrap" id="editor-wrap">
            <button class="editor-tool-btn" style="left:8px" onclick="$('code-input').value='';$('code-input').focus()">temizle</button>
            <button class="editor-tool-btn" style="left:70px" onclick="pasteClip()">yapıştır</button>
            <button class="editor-tool-btn" style="left:130px" onclick="runCode()">çalıştır</button>
            <button class="editor-tool-btn" id="full-btn" style="right:8px" onclick="toggleFull()">tam ekran</button>
            <textarea id="code-input" rows="7" placeholder="Kodu buraya yazın veya düzenleyin..."></textarea>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px">
            <button style="background:#cbd5e1; color:#334155" onclick="closeCodeModal()">İptal</button>
            <button style="background:var(--w)" onclick="downloadFile()">İndir</button>
            <button id="save-btn" onclick="saveCode()">Yayınla</button>
        </div>
    </div>
</div>

<div id="preview"><button id="close-btn">✕</button><iframe id="p-frame"></iframe></div>

<script>
    const u = 'drsait', r = 'Deneme', api = `https://api.github.com/repos/${u}/${r}/contents`;
    let editMode = false, activeFile = {}, editingName = null, currentTab = 'files';
    const $ = id => document.getElementById(id);
    const toB64 = s => btoa(unescape(encodeURIComponent(s))), fromB64 = s => decodeURIComponent(escape(atob(s)));

    const req = (path = '', method = 'GET', body = null) => fetch(`${api}/${path ? encodeURIComponent(path) : ''}`, {
        method, headers: { 'Authorization': `token ${localStorage.getItem('gt')}`, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : null
    });

    const toast = (id, msg, err) => {
        const el = $(id); el.textContent = msg; el.style.display = 'block';
        el.style.background = err ? '#fef2f2' : '#ecfdf5'; el.style.color = err ? '#991b1b' : '#065f46';
        el.style.border = `1px solid ${err ? 'var(--d)' : 'var(--s)'}`;
        setTimeout(() => el.style.display = 'none', 4000);
    };

    const auth = (showAlert) => {
        const t = $('token').value.trim();
        if(!t) return showAlert && toast('auth-toast', 'Şifre girin', true);
        fetch(api, { headers: { 'Authorization': `token ${t}` } }).then(res => {
            if(res.ok) {
                localStorage.setItem('gt', t);
                $('auth-box').classList.add('hidden');
                ['logout-box', 'sidebar', 'content'].forEach(id => $(id).classList.remove('hidden'));
                load();
            } else {
                localStorage.removeItem('gt');
                if(showAlert) toast('auth-toast', 'Geçersiz şifre', true);
            }
        }).catch(() => showAlert && toast('auth-toast', 'Bağlantı hatası', true));
    };

    const logout = () => { localStorage.removeItem('gt'); location.reload(); };

    const getArchive = async () => {
        try {
            const res = await req('archive.json');
            if (res.ok) { const d = await res.json(); return { list: JSON.parse(fromB64(d.content)), sha: d.sha }; }
        } catch {}
        return { list: [], sha: null };
    };

    const saveArchive = async (list, sha) => req('archive.json', 'PUT', { message: 'Arşiv güncellendi', content: toB64(JSON.stringify(list, null, 2)), sha });

    const toggleArchive = async (name) => {
        toast('list-toast', 'Arşiv güncelleniyor...');
        const { list, sha } = await getArchive();
        const updated = list.includes(name) ? list.filter(n => n !== name) : [...list, name];
        await saveArchive(updated, sha);
        load();
    };

    const toggleEdit = () => {
        editMode = !editMode;
        $('edit-toggle').style.background = editMode ? 'var(--p)' : 'transparent';
        $('edit-toggle').style.color = editMode ? '#fff' : 'var(--p)';
        document.querySelectorAll('.actions').forEach(a => a.style.display = editMode ? 'flex' : 'none');
        document.querySelectorAll('.file-date').forEach(d => d.style.display = editMode ? 'none' : 'inline');
    };

    const switchTab = (tab) => {
        currentTab = tab;
        $('tab-f').classList.toggle('active', tab === 'files');
        $('tab-a').classList.toggle('active', tab === 'archive');
        $('view-title').textContent = tab === 'files' ? '📄 Dosyalarım' : '📦 Arşivdeki Dosyalar';
        load();
    };

    const load = async () => {
        const list = $('file-list');
        list.innerHTML = '<li style="text-align:center; padding:20px; color:#64748b">Yükleniyor...</li>';
        try {
            const res = await req();
            if (!res.ok) throw new Error();
            const data = await res.json();
            const { list: archived } = await getArchive();
            const files = data.filter(f => !['index.html', 'archive.json'].includes(f.name.toLowerCase()) && (currentTab === 'files' ? !archived.includes(f.name) : archived.includes(f.name)));
            if (!files.length) return list.innerHTML = `<li style="text-align:center; padding:20px; color:#64748b">${currentTab === 'files' ? 'Depo boş' : 'Arşiv boş'}</li>`;

            list.innerHTML = '';
            files.forEach(f => {
                const li = document.createElement('li');
                li.className = 'item';
                li.innerHTML = `
                    <a href="https://${u}.github.io/${r}/${encodeURIComponent(f.name)}" target="_blank">📄 ${f.name}</a>
                    <span class="file-date" style="display:${editMode ? 'none' : 'inline'}"></span>
                    <div class="actions" style="display:${editMode ? 'flex' : 'none'}">
                        <button class="btn-sm btn-code" title="Düzenle">&lt;/&gt;</button>
                        <button class="btn-sm btn-archive" title="Arşiv">📦</button>
                        <button class="btn-sm btn-rename" title="Yeniden Adlandır">🏷️</button>
                        <button class="btn-sm btn-delete" title="Sil">🗑️</button>
                    </div>`;
                const btns = li.querySelectorAll('button');
                btns[0].onclick = () => editContent(f.name);
                btns[1].onclick = () => toggleArchive(f.name);
                btns[2].onclick = () => { $('new-name').value = f.name; activeFile = f; $('modal').style.display = 'flex'; $('new-name').select(); };
                btns[3].onclick = () => del(f.name, true);
                list.appendChild(li);
            });
        } catch { list.innerHTML = '<li style="text-align:center; color:var(--d); padding:20px">Yüklenemedi</li>'; }
    };

    const del = async (name, confirmReq = false) => {
        if (confirmReq && !confirm(`${name} silinsin mi?`)) return false;
        try {
            const res = await req(name);
            const data = await res.json();
            const dRes = await req(name, 'DELETE', { message: `Silindi: ${name}`, sha: data.sha });
            if (confirmReq) { toast('list-toast', dRes.ok ? `${name} silindi` : 'Silinemedi', !dRes.ok); load(); }
            return dRes.ok;
        } catch { return false; }
    };

    const saveRename = async () => {
        const newName = $('new-name').value.trim();
        if (!newName || newName === activeFile.name) return;
        $('modal').style.display = 'none';
        toast('list-toast', 'Ad değiştiriliyor...');
        try {
            const res = await req(activeFile.name);
            const data = await res.json();
            await req(newName, 'PUT', { message: `Ad Değişimi: ${activeFile.name} -> ${newName}`, content: data.content });
            await del(activeFile.name);
            toast('list-toast', 'Başarıyla değiştirildi');
            load();
        } catch { toast('list-toast', 'İşlem başarısız', true); }
    };

    const openCodeModal = (name = '') => {
        editingName = name;
        $('code-modal-title').textContent = name ? `Düzenle: ${name}` : 'Dosya Ekle';
        $('file-name').value = name || `${new Date().toISOString().slice(0,10).replace(/-/g,'')}_${Date.now().toString().slice(-4)}.html`;
        $('save-btn').textContent = name ? 'Güncelle' : 'Yayınla';
        $('code-modal').style.display = 'flex';
        $('code-input').value = '';
        $('code-input').focus();
    };

    const editContent = async (name) => {
        openCodeModal(name);
        $('code-input').value = 'Yükleniyor...';
        try {
            const res = await req(name);
            const data = await res.json();
            activeFile.sha = data.sha;
            $('code-input').value = fromB64(data.content);
        } catch { $('code-input').value = 'İçerik okunamadı.'; }
    };

    const saveCode = async () => {
        const code = $('code-input').value, name = $('file-name').value.trim();
        if (!code.trim() || !name) return toast('list-toast', 'Dosya adı ve içerik zorunlu', true);
        closeCodeModal();
        toast('list-toast', `${name} kaydediliyor...`);
        try {
            const isRenaming = editingName && editingName !== name;
            let sha = !isRenaming && editingName ? activeFile.sha : null;
            if (!sha && !isRenaming && editingName) {
                const fData = await (await req(editingName)).json();
                sha = fData.sha;
            }
            await req(name, 'PUT', { message: `Kaydedildi: ${name}`, content: toB64(code), sha });
            if (isRenaming) await del(editingName);
            toast('list-toast', `${name} kaydedildi`);
            load();
        } catch { toast('list-toast', 'Kaydetme başarısız', true); }
    };

    const toggleFull = () => {
        const isFull = $('editor-wrap').classList.toggle('fullscreen-editor');
        $('full-btn').textContent = isFull ? 'küçült' : 'tam ekran';
        $('code-input').focus();
    };
    const closeCodeModal = () => {
        $('editor-wrap').classList.remove('fullscreen-editor');
        $('full-btn').textContent = 'tam ekran';
        $('code-modal').style.display = 'none';
    };
    const runCode = () => {
        const c = $('code-input').value.trim();
        if (!c) return;
        $('p-frame').srcdoc = c;
        $('preview').style.display = 'block';
    };
    const downloadFile = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([$('code-input').value], { type: 'text/plain' }));
        a.download = $('file-name').value.trim() || 'dosya.txt';
        a.click();
    };
    const pasteClip = async () => {
        try { $('code-input').value = await navigator.clipboard.readText(); } catch {}
        $('code-input').focus();
    };
    const upload = () => {
        const f = $('file').files[0];
        if(!f) return;
        const r = new FileReader();
        r.readAsDataURL(f);
        r.onload = () => req(f.name, 'PUT', { message: `Yüklendi: ${f.name}`, content: r.result.split(',')[1] })
            .then(() => { toast('upload-toast', 'Yüklendi'); load(); })
            .catch(() => toast('upload-toast', 'Hata', true));
    };

    $('close-btn').onclick = () => { $('preview').style.display = 'none'; $('p-frame').srcdoc = ''; $('code-input').focus(); };
    window.onload = () => {
        const t = localStorage.getItem('gt');
        if (t) { $('token').value = t; auth(false); }
        $('token').onpaste = () => setTimeout(() => auth(false), 50);
        $('token').onkeydown = (e) => e.key === 'Enter' && auth(true);
    };
</script>
</body>
</html>
