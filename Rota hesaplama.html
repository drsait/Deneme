<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mardin Kızıltepe Trafik Takip</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --primary: #2563eb; --border: #e2e8f0;
      --danger-bg: #fee2e2; --danger-text: #b91c1c; --success-bg: #dcfce7; --success-text: #15803d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 12px; 
      gap: 10px; 
    }
    h1 { 
      font-size: 1.15rem; 
      font-weight: 700; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    .header-actions { 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      flex-shrink: 0; 
    }
    .btn-icon-head {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--primary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }
    .btn-icon-head:hover { background: #eff6ff; border-color: var(--primary); }
    .btn-icon-head:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-icon-head svg { width: 16px; height: 16px; }

    .live-dot {
      background: var(--success-bg);
      color: var(--success-text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #bbf7d0;
    }
    .live-dot svg { width: 16px; height: 16px; }

    /* Kompakt Son Ölçüm Kartları */
    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .mini-card {
      background: var(--card);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mini-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }
    .mini-card-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-card-time {
      font-size: 0.65rem;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .mini-card-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .mini-card-sub {
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* Arama Filtresi */
    .filter-box { margin-bottom: 12px; }
    .filter-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-size: 0.85rem;
      background: #fff;
    }

    /* Tablo Alanı & Tam Ekran Kapsayıcısı */
    .table-box {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .table-scroll { overflow-x: auto; width: 100%; }

    .table-box:fullscreen {
      border-radius: 0;
      border: none;
      padding: 16px;
      height: 100vh;
      width: 100vw;
      background: #ffffff;
      overflow-y: auto;
    }
    .table-box:-webkit-full-screen {
      border-radius: 0;
      border: none;
      padding: 16px;
      height: 100vh;
      width: 100vw;
      background: #ffffff;
      overflow-y: auto;
    }

    /* Tablo İçi Üst Bar: Sekmeler ve Tam Ekran Butonu */
    .table-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    /* Tablo İçi Sekmeler */
    .tabs {
      display: flex;
      gap: 6px;
      flex: 1;
    }
    .tab-btn {
      flex: 1;
      background: #ffffff;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn:hover { background: #e2e8f0; color: var(--text); }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Minik Tam Ekran Butonu */
    .btn-icon-table {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }
    .btn-icon-table:hover {
      color: var(--primary);
      border-color: #cbd5e1;
    }
    .btn-icon-table svg { width: 14px; height: 14px; }

    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th { background: #f1f5f9; padding: 9px 10px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { background: #e2e8f0; }
    th .sort-icon { margin-left: 3px; color: #94a3b8; font-size: 0.7rem; }
    td { padding: 9px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
    tr:hover { background: #f8fafc; }
    .badge { background: #eff6ff; color: #1d4ed8; padding: 2px 6px; border-radius: 5px; font-weight: 600; font-size: 0.8rem; }
    .badge-delay { padding: 2px 6px; border-radius: 5px; font-weight: 600; font-size: 0.74rem; }
    .delay-red { background: var(--danger-bg); color: var(--danger-text); }
    .delay-none { background: var(--success-bg); color: var(--success-text); }
    .empty { text-align: center; padding: 24px; color: var(--muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mardin Kızıltepe Trafik Takip</h1>
      <div class="header-actions">
        <button class="btn-icon-head" id="btnMeasure" onclick="anlikOlcumTetikle()" title="Şimdi Ölç ve Kaydet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </button>
        <div class="live-dot" title="Canlı Takip Devrede">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path>
            <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
          </svg>
        </div>
      </div>
    </header>

    <!-- Küçük Son Ölçüm Kartları -->
    <div class="mini-grid">
      <div class="mini-card">
        <div class="mini-card-head">
          <span class="mini-card-title">Mardin ➔ Kızıltepe</span>
          <span class="mini-card-time" id="gidisSaat">--:--</span>
        </div>
        <div class="mini-card-val">
          <span id="gidisSure">-- dk</span>
          <span id="gidisBadge"></span>
        </div>
        <div class="mini-card-sub" id="gidisMesafe">Mesafe: -- km</div>
      </div>

      <div class="mini-card">
        <div class="mini-card-head">
          <span class="mini-card-title">Kızıltepe ➔ Mardin</span>
          <span class="mini-card-time" id="donusSaat">--:--</span>
        </div>
        <div class="mini-card-val">
          <span id="donusSure">-- dk</span>
          <span id="donusBadge"></span>
        </div>
        <div class="mini-card-sub" id="donusMesafe">Mesafe: -- km</div>
      </div>
    </div>

    <!-- Verileri Filtrele Arama Kutusu -->
    <div class="filter-box">
      <input type="text" id="filterSearch" placeholder="Verileri filtrele..." oninput="filtreleVeCiz()">
    </div>

    <!-- Tablo Kutusu (Sekmeler ve Tam Ekran Butonu Birlikte) -->
    <div class="table-box" id="tableContainer">
      <div class="table-header-bar">
        <div class="tabs">
          <button class="tab-btn" id="tabGidis" onclick="sekmeDegistir('gidis')">Mardin Kızıltepe</button>
          <button class="tab-btn" id="tabDonus" onclick="sekmeDegistir('donus')">Kızıltepe Mardin</button>
        </div>
        <button class="btn-icon-table" id="btnFullscreen" onclick="tamEkranDegistir()" title="Tam Ekran">
          <svg id="iconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
          </svg>
          <svg id="iconCompress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/>
          </svg>
        </button>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th onclick="sirala(0)">Tarih & Saat <span class="sort-icon" id="sort-0">↕</span></th>
              <th>Hedef</th>
              <th onclick="sirala(1)">Süre <span class="sort-icon" id="sort-1">↕</span></th>
              <th onclick="sirala(2)">Gecikme <span class="sort-icon" id="sort-2">↕</span></th>
            </tr>
          </thead>
          <tbody id="dataRows">
            <tr><td colspan="4" class="empty">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRela2KE3aNgsrjQbo_wqnDfz9LBJOC_MM4n4mzuo2kq_9mB5QkqzkANeLH0V-ScYFvjFYLRfOuDYtc/pub?output=csv';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwjqfUlGYClVY8esmlvxWf_tBKSUGPldx7WevQdY4fl-p0yxtLJFDW3ExLc8-6oZUvjSQ/exec';

    let tumKayitlar = [];
    let aktifSekme = (new Date().getHours() < 12) ? 'gidis' : 'donus';
    let aktifSiralama = { sutun: -1, artan: true };

    function sekmeleriArayuzeUygula() {
      document.getElementById('tabGidis').classList.toggle('active', aktifSekme === 'gidis');
      document.getElementById('tabDonus').classList.toggle('active', aktifSekme === 'donus');
    }

    function sekmeDegistir(sekme) {
      aktifSekme = sekme;
      sekmeleriArayuzeUygula();
      filtreleVeCiz();
    }

    function tamEkranDegistir() {
      const elem = document.getElementById('tableContainer');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function tamEkranDurumuGuncelle() {
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const iconExpand = document.getElementById('iconExpand');
      const iconCompress = document.getElementById('iconCompress');
      const btn = document.getElementById('btnFullscreen');

      if (isFull) {
        iconExpand.style.display = 'none';
        iconCompress.style.display = 'block';
        btn.setAttribute('title', 'Küçült');
      } else {
        iconExpand.style.display = 'block';
        iconCompress.style.display = 'none';
        btn.setAttribute('title', 'Tam Ekran');
      }
    }

    document.addEventListener('fullscreenchange', tamEkranDurumuGuncelle);
    document.addEventListener('webkitfullscreenchange', tamEkranDurumuGuncelle);

    function delayBadgeHTML(delayVal) {
      const d = parseInt(delayVal) || 0;
      if (d > 0) return `<span class="badge-delay delay-red">+${d} dk</span>`;
      return `<span class="badge-delay delay-none">Akıcı</span>`;
    }

    function csvSatirlariBol(text) {
      const satirlar = text.trim().split('\n');
      return satirlar.slice(1).map(satir => {
        const sutunlar = satir.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
        return sutunlar.map(s => s.replace(/^"|"$/g, '').trim());
      }).filter(s => s.length >= 7);
    }

    async function verileriCek() {
      try {
        const res = await fetch(`${CSV_URL}&t=${Date.now()}`);
        const text = await res.text();
        const parseEdilmis = csvSatirlariBol(text);

        if (parseEdilmis.length > 0) {
          tumKayitlar = parseEdilmis.reverse();
          ozetGuncelle(tumKayitlar[0]);
          filtreleVeCiz();
        } else {
          document.getElementById('dataRows').innerHTML = '<tr><td colspan="4" class="empty">Henüz veri yok.</td></tr>';
        }
      } catch (e) {
        document.getElementById('dataRows').innerHTML = '<tr><td colspan="4" class="empty">Veri çekilemedi.</td></tr>';
      }
    }

    async function anlikOlcumTetikle() {
      const btn = document.getElementById('btnMeasure');
      btn.disabled = true;

      try {
        const res = await fetch(WEB_APP_URL);
        const result = await res.json();

        if (result.status === "ok" && result.data) {
          tumKayitlar.unshift(result.data.map(String));
          ozetGuncelle(result.data);
          filtreleVeCiz();
        } else {
          await verileriCek();
        }
      } catch (err) {
        await new Promise(r => setTimeout(r, 2500));
        await verileriCek();
      } finally {
        btn.disabled = false;
      }
    }

    function saatAyikla(tarihStr) {
      if (!tarihStr) return '--:--';
      const parts = tarihStr.trim().split(' ');
      if (parts.length >= 2) {
        return parts[1].substring(0, 5);
      }
      return tarihStr;
    }

    function ozetGuncelle(son) {
      const hasDelay = son.length >= 9;

      const gSure = son[2];
      const gGecikme = hasDelay ? son[3] : 0;
      const gMesafe = hasDelay ? son[4] : son[3];

      const dSure = hasDelay ? son[6] : son[5];
      const dGecikme = hasDelay ? son[7] : 0;
      const dMesafe = hasDelay ? son[8] : son[6];

      const saatMetni = saatAyikla(son[0]);

      document.getElementById('gidisSaat').innerText = saatMetni;
      document.getElementById('gidisSure').innerText = `${gSure} dk`;
      document.getElementById('gidisBadge').innerHTML = delayBadgeHTML(gGecikme);
      document.getElementById('gidisMesafe').innerText = `Mesafe: ${gMesafe} km`;

      document.getElementById('donusSaat').innerText = saatMetni;
      document.getElementById('donusSure').innerText = `${dSure} dk`;
      document.getElementById('donusBadge').innerHTML = delayBadgeHTML(dGecikme);
      document.getElementById('donusMesafe').innerText = `Mesafe: ${dMesafe} km`;
    }

    function parseTarih(str) {
      const p = str.split(/[. :]/);
      return p.length >= 6 ? new Date(p[2], p[1] - 1, p[0], p[3], p[4], p[5]).getTime() : 0;
    }

    function sirala(sutunIndex) {
      if (aktifSiralama.sutun === sutunIndex) {
        aktifSiralama.artan = !aktifSiralama.artan;
      } else {
        aktifSiralama.sutun = sutunIndex;
        aktifSiralama.artan = true;
      }

      for (let i = 0; i <= 2; i++) {
        const el = document.getElementById(`sort-${i}`);
        if (el) el.innerText = (i === sutunIndex) ? (aktifSiralama.artan ? '▲' : '▼') : '↕';
      }

      filtreleVeCiz();
    }

    function tabloBas(liste) {
      const tbody = document.getElementById('dataRows');
      if (liste.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">Filtreye uygun sonuç bulunamadı.</td></tr>';
        return;
      }

      tbody.innerHTML = liste.map(r => {
        return `
          <tr>
            <td><strong>${r.tarih}</strong></td>
            <td>${r.hedef}</td>
            <td><span class="badge">${r.sure} dk</span></td>
            <td>${delayBadgeHTML(r.gecikme)}</td>
          </tr>
        `;
      }).join('');
    }

    function filtreleVeCiz() {
      const arama = document.getElementById('filterSearch').value.toLowerCase();

      let seciliVeriler = tumKayitlar.map(r => {
        const hasDelay = r.length >= 9;
        if (aktifSekme === 'gidis') {
          return {
            tarih: r[0],
            hedef: r[1],
            sure: r[2],
            gecikme: hasDelay ? r[3] : 0
          };
        } else {
          return {
            tarih: r[0],
            hedef: hasDelay ? r[5] : r[4],
            sure: hasDelay ? r[6] : r[5],
            gecikme: hasDelay ? r[7] : 0
          };
        }
      });

      let filtrelenen = seciliVeriler.filter(item => {
        return `${item.tarih} ${item.hedef} ${item.sure}`.toLowerCase().includes(arama);
      });

      if (aktifSiralama.sutun !== -1) {
        const idx = aktifSiralama.sutun;
        const artan = aktifSiralama.artan;
        const alanlar = ['tarih', 'sure', 'gecikme'];
        const alan = alanlar[idx];

        filtrelenen.sort((a, b) => {
          let valA = a[alan] || '';
          let valB = b[alan] || '';

          if (idx === 0) {
            const tA = parseTarih(valA);
            const tB = parseTarih(valB);
            return artan ? tA - tB : tB - tA;
          }

          const numA = parseFloat(String(valA).replace(/[^\d.-]/g, ''));
          const numB = parseFloat(String(valB).replace(/[^\d.-]/g, ''));
          if (!isNaN(numA) && !isNaN(numB)) {
            return artan ? numA - numB : numB - numA;
          }

          return artan ? String(valA).localeCompare(String(valB), 'tr') : String(valB).localeCompare(String(valA), 'tr');
        });
      }

      tabloBas(filtrelenen);
    }

    sekmeleriArayuzeUygula();
    verileriCek();
    setInterval(verileriCek, 2 * 60 * 1000);
  </script>
</body>
</html>
