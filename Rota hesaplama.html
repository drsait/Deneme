<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mardin ⇄ Kızıltepe Canlı Trafik & Gecikme Takibi</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --danger-bg: #fee2e2;
      --danger-text: #b91c1c;
      --success-bg: #dcfce7;
      --success-text: #15803d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .status { background: var(--success-bg); color: var(--success-text); padding: 5px 12px; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .card { background: var(--card); padding: 18px 20px; border-radius: 12px; border: 1px solid var(--border); }
    .card-title { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    .card-val { font-size: 2rem; font-weight: 700; color: var(--primary); display: flex; align-items: baseline; gap: 10px; }
    .card-sub { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filters input { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 0.9rem; background: #fff; }
    .filters input[type="text"] { flex: 1; min-width: 200px; }
    .table-box { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th { background: #f1f5f9; padding: 12px 14px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { background: #e2e8f0; }
    th .sort-icon { margin-left: 4px; color: #94a3b8; font-size: 0.75rem; }
    td { padding: 12px 14px; border-top: 1px solid var(--border); white-space: nowrap; }
    tr:hover { background: #f8fafc; }
    .badge { background: #eff6ff; color: #1d4ed8; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .badge-delay { padding: 3px 8px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }
    .delay-red { background: var(--danger-bg); color: var(--danger-text); }
    .delay-none { background: var(--success-bg); color: var(--success-text); }
    .empty { text-align: center; padding: 30px; color: var(--muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Mardin ⇄ Kızıltepe Canlı Trafik & Gecikme Takibi</h1>
        <small id="lastUpdated" style="color: var(--muted);">Veriler yükleniyor...</small>
      </div>
      <div class="status">● Canlı Takip</div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-title">Son Ölçüm: Artuklu ➔ Kızıltepe</div>
        <div class="card-val">
          <span id="gidisSure">-- dk</span>
          <span id="gidisGecikmeBadge"></span>
        </div>
        <div class="card-sub" id="gidisMesafe">Mesafe: -- km</div>
      </div>
      <div class="card">
        <div class="card-title">Son Ölçüm: Kızıltepe ➔ Artuklu</div>
        <div class="card-val">
          <span id="donusSure">-- dk</span>
          <span id="donusGecikmeBadge"></span>
        </div>
        <div class="card-sub" id="donusMesafe">Mesafe: -- km</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="filterSearch" placeholder="Güzergâh veya tarih ara..." oninput="filtreleVeCiz()">
      <input type="date" id="filterDate" onchange="filtreleVeCiz()">
    </div>

    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th onclick="sirala(0)">Tarih & Saat <span class="sort-icon" id="sort-0">↕</span></th>
            <th onclick="sirala(1)">Gidiş <span class="sort-icon" id="sort-1">↕</span></th>
            <th onclick="sirala(2)">Süre <span class="sort-icon" id="sort-2">↕</span></th>
            <th onclick="sirala(3)">Gecikme <span class="sort-icon" id="sort-3">↕</span></th>
            <th onclick="sirala(4)">Mesafe <span class="sort-icon" id="sort-4">↕</span></th>
            <th onclick="sirala(5)">Dönüş <span class="sort-icon" id="sort-5">↕</span></th>
            <th onclick="sirala(6)">Süre <span class="sort-icon" id="sort-6">↕</span></th>
            <th onclick="sirala(7)">Gecikme <span class="sort-icon" id="sort-7">↕</span></th>
            <th onclick="sirala(8)">Mesafe <span class="sort-icon" id="sort-8">↕</span></th>
          </tr>
        </thead>
        <tbody id="dataRows">
          <tr><td colspan="9" class="empty">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Yeni tablonuzun web'de yayınlanan CSV bağlantısı
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQh4tTh1sTzzFX_jOxasZRa3fJgAWzA3QVxGdx15X7LZv6zKiAlNluMU7C7jyQr-kxc4SZYOf9wqaKO/pub?output=csv';
    let tumKayitlar = [];
    let aktifSiralama = { sutun: -1, artan: true };

    function delayBadgeHTML(delayVal) {
      const d = parseInt(delayVal) || 0;
      if (d > 0) return `<span class="badge-delay delay-red">+${d} dk yoğunluk</span>`;
      return `<span class="badge-delay delay-none">Akıcı</span>`;
    }

    function csvSatirlariBol(text) {
      const satirlar = text.trim().split('\n');
      return satirlar.slice(1).map(satir => {
        const sutunlar = satir.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
        return sutunlar.map(s => s.replace(/^"|"$/g, '').trim());
      }).filter(s => s.length >= 7);
    }

    async function verileriCek() {
      try {
        const res = await fetch(`${CSV_URL}&t=${Date.now()}`);
        const text = await res.text();
        const parseEdilmis = csvSatirlariBol(text);

        if (parseEdilmis.length > 0) {
          tumKayitlar = parseEdilmis.reverse();
          ozetGuncelle(tumKayitlar[0]);
          filtreleVeCiz();
          document.getElementById('lastUpdated').innerText = `Son Güncelleme: ${tumKayitlar[0][0]}`;
        } else {
          document.getElementById('dataRows').innerHTML = '<tr><td colspan="9" class="empty">Henüz kaydedilmiş ölçüm bulunmuyor.</td></tr>';
        }
      } catch (e) {
        document.getElementById('dataRows').innerHTML = '<tr><td colspan="9" class="empty">Veri çekilemedi. Bağlantıyı kontrol edin.</td></tr>';
      }
    }

    function ozetGuncelle(son) {
      const gidisSure = son[2];
      const gidisGecikme = son.length >= 9 ? son[3] : 0;
      const gidisMesafe = son.length >= 9 ? son[4] : son[3];
      const donusSure = son.length >= 9 ? son[6] : son[5];
      const donusGecikme = son.length >= 9 ? son[7] : 0;
      const donusMesafe = son.length >= 9 ? son[8] : son[6];

      document.getElementById('gidisSure').innerText = `${gidisSure} dk`;
      document.getElementById('gidisGecikmeBadge').innerHTML = delayBadgeHTML(gidisGecikme);
      document.getElementById('gidisMesafe').innerText = `Mesafe: ${gidisMesafe} km`;

      document.getElementById('donusSure').innerText = `${donusSure} dk`;
      document.getElementById('donusGecikmeBadge').innerHTML = delayBadgeHTML(donusGecikme);
      document.getElementById('donusMesafe').innerText = `Mesafe: ${donusMesafe} km`;
    }

    function parseTarih(str) {
      const p = str.split(/[. :]/);
      return p.length >= 6 ? new Date(p[2], p[1] - 1, p[0], p[3], p[4], p[5]).getTime() : 0;
    }

    function sirala(sutunIndex) {
      if (aktifSiralama.sutun === sutunIndex) {
        aktifSiralama.artan = !aktifSiralama.artan;
      } else {
        aktifSiralama.sutun = sutunIndex;
        aktifSiralama.artan = true;
      }

      for (let i = 0; i <= 8; i++) {
        const el = document.getElementById(`sort-${i}`);
        if (el) el.innerText = (i === sutunIndex) ? (aktifSiralama.artan ? '▲' : '▼') : '↕';
      }

      filtreleVeCiz();
    }

    function tabloBas(liste) {
      const tbody = document.getElementById('dataRows');
      if (liste.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">Filtreye uygun sonuç bulunamadı.</td></tr>';
        return;
      }
      tbody.innerHTML = liste.map(r => {
        const hasDelay = r.length >= 9;
        const gSure = r[2];
        const gGecikme = hasDelay ? r[3] : 0;
        const gMesafe = hasDelay ? r[4] : r[3];
        const dAd = hasDelay ? r[5] : r[4];
        const dSure = hasDelay ? r[6] : r[5];
        const dGecikme = hasDelay ? r[7] : 0;
        const dMesafe = hasDelay ? r[8] : r[6];

        return `
          <tr>
            <td><strong>${r[0]}</strong></td>
            <td>${r[1]}</td>
            <td><span class="badge">${gSure} dk</span></td>
            <td>${delayBadgeHTML(gGecikme)}</td>
            <td>${gMesafe} km</td>
            <td>${dAd}</td>
            <td><span class="badge">${dSure} dk</span></td>
            <td>${delayBadgeHTML(dGecikme)}</td>
            <td>${dMesafe} km</td>
          </tr>
        `;
      }).join('');
    }

    function filtreleVeCiz() {
      const arama = document.getElementById('filterSearch').value.toLowerCase();
      const tarihSecimi = document.getElementById('filterDate').value;

      let filtrelenen = tumKayitlar.filter(satir => {
        const metinUygun = satir.join(' ').toLowerCase().includes(arama);
        let tarihUygun = true;
        if (tarihSecimi) {
          const [yil, ay, gun] = tarihSecimi.split('-');
          tarihUygun = satir[0].startsWith(`${gun}.${ay}.${yil}`);
        }
        return metinUygun && tarihUygun;
      });

      if (aktifSiralama.sutun !== -1) {
        const idx = aktifSiralama.sutun;
        const artan = aktifSiralama.artan;

        filtrelenen.sort((a, b) => {
          let valA = a[idx] || '';
          let valB = b[idx] || '';

          if (idx === 0) {
            const tA = parseTarih(valA);
            const tB = parseTarih(valB);
            return artan ? tA - tB : tB - tA;
          }

          const numA = parseFloat(valA.replace(/[^\d.-]/g, ''));
          const numB = parseFloat(valB.replace(/[^\d.-]/g, ''));
          if (!isNaN(numA) && !isNaN(numB)) {
            return artan ? numA - numB : numB - numA;
          }

          return artan ? valA.localeCompare(valB, 'tr') : valB.localeCompare(valA, 'tr');
        });
      }

      tabloBas(filtrelenen);
    }

    verileriCek();
    setInterval(verileriCek, 2 * 60 * 1000);
  </script>
</body>
</html>
