<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hibrit Tarayıcı & Web Arşivleyici</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--card);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      z-index: 1000;
      transition: transform 0.3s ease;
    }
    .top-bar.hidden { transform: translateY(-100%); }
    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }
    input[type="text"] {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 36px 9px 12px;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .btn-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      display: none;
      line-height: 1;
    }
    .btn-clear:hover { color: #fff; }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input { cursor: pointer; accent-color: var(--accent); }
    button {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      color: #fff;
    }
    button:active { transform: scale(0.98); }
    .btn-accent { background: var(--accent); }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); }
    .btn-outline { background: var(--border); }
    .btn-outline:hover { background: #475569; }
    .viewport { flex: 1; width: 100%; height: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .hover-trigger { position: fixed; top: 0; left: 0; width: 100%; height: 15px; z-index: 999; }
    .status-badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      z-index: 10;
    }

    /* Arşivleme ve Kod Düzenleyici Modalı */
    #archiveModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 2000;
      padding: 16px;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 850px;
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-card.fullscreen {
      position: fixed;
      inset: 0;
      max-width: 100%;
      max-height: 100%;
      border-radius: 0;
      z-index: 2005;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 16px; font-weight: 600; }
    .editor-wrapper { position: relative; flex: 1; display: flex; }
    textarea {
      width: 100%;
      height: 280px;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }
    .modal-card.fullscreen textarea { height: 100% !important; resize: none; }
    .btn-fs-toggle {
      position: absolute;
      top: 8px;
      right: 10px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 5;
    }
    .modal-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-row input {
      flex: 1;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

    /* Önizleme Modalı ve Yüzer Kapat Butonu */
    #previewModal {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 99999;
    }
    #previewModal iframe { width: 100%; height: 100%; border: none; }
    #floatingCloseBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: grab;
      z-index: 100000;
      touch-action: none;
      user-select: none;
    }
    #floatingCloseBtn:active { cursor: grabbing; }

    @media (max-width: 600px) {
      .top-bar { flex-wrap: wrap; }
      .btn-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="hover-trigger" id="hoverArea"></div>

  <div class="top-bar" id="topBar">
    <div class="input-wrapper">
      <input 
        type="text" 
        id="targetUrl" 
        placeholder="https://example.com" 
        oninput="toggleClearBtn()"
        onkeydown="if(event.key==='Enter') navigate()"
      >
      <button class="btn-clear" id="btnClear" onclick="clearInput()">✕</button>
    </div>

    <label class="toggle-label" title="İşaretlenirse resim ve CSS'ler proxy sunucusundan geçer">
      <input type="checkbox" id="chkProxyMedia" checked>
      Sunucudan Çek
    </label>

    <button class="btn-accent" onclick="navigate()" id="btnGo">Git</button>
    <button class="btn-success" onclick="openArchiveTools()">📦 Arşivle</button>
  </div>

  <div class="viewport">
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div id="statusBar" class="status-badge">Yükleniyor...</div>
  </div>

  <!-- Arşivleme & Editör Modalı -->
  <div id="archiveModal">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <h3>Sayfa Arşivleyici & Düzenleyici</h3>
        <div style="display:flex; gap:6px;">
          <label class="toggle-label" style="margin-right:8px;" title="Tüm resim ve CSS dosyalarını Base64 ile tek dosyaya gömer">
            <input type="checkbox" id="chkEmbedOffline" checked>
            Dosyaları İçe Göm (Çevrimdışı)
          </label>
          <button class="btn-outline" onclick="buildArchive()">Kodu Yeniden Paketle</button>
          <button class="btn-outline" onclick="closeArchiveModal()">✕ Kapat</button>
        </div>
      </div>

      <div class="editor-wrapper">
        <button class="btn-fs-toggle" onclick="toggleModalFullscreen()" id="btnModalFs">⛶ Tam Ekran</button>
        <textarea id="codeEditor" placeholder="Sayfa kaynak kodları burada görüntülenecek..."></textarea>
      </div>

      <div class="btn-grid">
        <button class="btn-outline" onclick="copyCode()" id="btnCopy">Kopyala</button>
        <button class="btn-outline" onclick="downloadCode()">İndir</button>
        <button class="btn-outline" onclick="runCode()">Çalıştır</button>
        <button class="btn-success" onclick="uploadToGithub()">GitHub'a Yükle</button>
      </div>

      <div class="modal-row">
        <input type="text" id="fileName" placeholder="Dosya adı">
        <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (repo izni)">
      </div>
    </div>
  </div>

  <!-- Tam Ekran Önizleme -->
  <div id="previewModal">
    <button id="floatingCloseBtn" title="Kapat (Sürüklenebilir)">✕</button>
    <iframe id="preview"></iframe>
  </div>

  <script>
    const REPO = 'drsait/Deneme';
    const PROXY_URL = 'https://polished-snow-38e2.yenibirhesap047.workers.dev';
    
    const topBar = document.getElementById('topBar');
    const inputUrl = document.getElementById('targetUrl');
    const btnClear = document.getElementById('btnClear');
    let currentRawHtml = ''; // Orijinal HTML tamponu

    function toggleClearBtn() {
      btnClear.style.display = inputUrl.value.trim() ? 'block' : 'none';
    }

    function clearInput() {
      inputUrl.value = '';
      toggleClearBtn();
      inputUrl.focus();
    }

    document.getElementById('hoverArea').addEventListener('mouseenter', () => {
      topBar.classList.remove('hidden');
    });

    function setDefaultFileName() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      document.getElementById('fileName').value = `web_arsiv_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.html`;
    }
    setDefaultFileName();

    function toProxyUrl(relativeOrAbsoluteUrl, baseUrl) {
      try {
        if (!relativeOrAbsoluteUrl || relativeOrAbsoluteUrl.startsWith('data:') || relativeOrAbsoluteUrl.startsWith('javascript:')) {
          return relativeOrAbsoluteUrl;
        }
        const absolute = new URL(relativeOrAbsoluteUrl, baseUrl).href;
        return `${PROXY_URL}?url=${encodeURIComponent(absolute)}`;
      } catch {
        return relativeOrAbsoluteUrl;
      }
    }

    async function fetchResource(url, asBase64 = false) {
      try {
        const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
        if (!res.ok) return null;
        if (!asBase64) return await res.text();
        const blob = await res.blob();
        return new Promise(resolve => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        });
      } catch {
        return null;
      }
    }

    // Canlı Gezinme
    async function navigate(targetUrlOverride = null) {
      let url = targetUrlOverride || inputUrl.value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      inputUrl.value = url;
      toggleClearBtn();

      const btn = document.getElementById('btnGo');
      const status = document.getElementById('statusBar');
      const frame = document.getElementById('proxyFrame');
      const useProxyMedia = document.getElementById('chkProxyMedia').checked;

      btn.disabled = true;
      status.style.display = 'block';
      status.textContent = 'Sayfa yükleniyor...';

      try {
        const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentRawHtml = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(currentRawHtml, 'text/html');
        const baseUrl = new URL(url);

        let baseEl = doc.querySelector('base');
        if (!baseEl) {
          baseEl = doc.createElement('base');
          doc.head.prepend(baseEl);
        }
        baseEl.href = baseUrl.origin + '/';

        if (useProxyMedia) {
          doc.querySelectorAll('img, source, video, audio').forEach(el => {
            const src = el.getAttribute('src');
            if (src) el.setAttribute('src', toProxyUrl(src, baseUrl));
            el.removeAttribute('srcset');
          });

          doc.querySelectorAll('link[rel="stylesheet"]').forEach(el => {
            const href = el.getAttribute('href');
            if (href) el.setAttribute('href', toProxyUrl(href, baseUrl));
          });
        }

        const interceptor = doc.createElement('script');
        interceptor.textContent = `
          let lastY = window.scrollY;
          window.addEventListener('scroll', function() {
            const currentY = window.scrollY;
            if (currentY > lastY && currentY > 50) {
              window.parent.postMessage({ type: 'SCROLL_DOWN' }, '*');
            } else if (currentY < lastY) {
              window.parent.postMessage({ type: 'SCROLL_UP' }, '*');
            }
            lastY = currentY;
          }, { passive: true });

          document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (link) {
              const rawHref = link.getAttribute('href');
              if (rawHref && !rawHref.startsWith('javascript:') && !rawHref.startsWith('#')) {
                e.preventDefault();
                try {
                  const absoluteUrl = new URL(rawHref, "${baseUrl.origin}").href;
                  window.parent.postMessage({ type: 'PROXY_NAVIGATE', url: absoluteUrl }, '*');
                } catch(err) {}
              }
            }
          }, true);
        `;
        doc.head.appendChild(interceptor);

        frame.srcdoc = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        status.style.display = 'none';
      } catch (err) {
        status.textContent = 'Hata: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    // Arşiv Paketleme
    async function buildArchive() {
      const url = inputUrl.value.trim();
      if (!url || !currentRawHtml) return alert('Önce bir sayfa açmalısınız.');

      const isOfflineEmbed = document.getElementById('chkEmbedOffline').checked;
      const editor = document.getElementById('codeEditor');
      const parser = new DOMParser();
      const doc = parser.parseFromString(currentRawHtml, 'text/html');
      const baseUrl = new URL(url);

      if (isOfflineEmbed) {
        editor.value = 'Dosyalar gömülüyor, lütfen bekleyin...';
        
        // CSS Gömme
        const linkElements = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));
        for (const link of linkElements) {
          const href = link.getAttribute('href');
          if (href) {
            const abs = new URL(href, baseUrl).href;
            const css = await fetchResource(abs, false);
            if (css) {
              const style = doc.createElement('style');
              style.textContent = css;
              link.replaceWith(style);
            }
          }
        }

        // Resim Gömme (Base64)
        const imgElements = Array.from(doc.querySelectorAll('img'));
        for (const img of imgElements) {
          const src = img.getAttribute('src');
          if (src && !src.startsWith('data:')) {
            const abs = new URL(src, baseUrl).href;
            const b64 = await fetchResource(abs, true);
            if (b64) {
              img.setAttribute('src', b64);
              img.removeAttribute('srcset');
              img.removeAttribute('loading');
            }
          }
        }
        doc.querySelectorAll('base').forEach(b => b.remove());
      } else {
        // Dışarıdan Bağlantılı (Asıl Siteden)
        let baseEl = doc.querySelector('base');
        if (!baseEl) {
          baseEl = doc.createElement('base');
          doc.head.prepend(baseEl);
        }
        baseEl.href = baseUrl.origin + '/';
      }

      editor.value = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    }

    function openArchiveTools() {
      if (!currentRawHtml) return alert('Önce bir web sayfası yüklemelisiniz.');
      document.getElementById('archiveModal').style.display = 'flex';
      setDefaultFileName();
      buildArchive();
    }

    function closeArchiveModal() {
      document.getElementById('archiveModal').style.display = 'none';
    }

    function toggleModalFullscreen() {
      const card = document.getElementById('modalCard');
      const btn = document.getElementById('btnModalFs');
      card.classList.toggle('fullscreen');
      btn.textContent = card.classList.contains('fullscreen') ? '✕ Küçült' : '⛶ Tam Ekran';
    }

    function copyCode() {
      const val = document.getElementById('codeEditor').value;
      if (!val) return alert('Kopyalanacak kod yok.');
      navigator.clipboard.writeText(val).then(() => {
        const b = document.getElementById('btnCopy');
        b.textContent = 'Kopyalandı!';
        setTimeout(() => b.textContent = 'Kopyala', 1500);
      });
    }

    function runCode() {
      document.getElementById('preview').srcdoc = document.getElementById('codeEditor').value;
      document.getElementById('previewModal').style.display = 'block';
    }

    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
    }

    function downloadCode() {
      const val = document.getElementById('codeEditor').value;
      const fn = document.getElementById('fileName').value.trim() || 'web_arsiv.html';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([val], { type: 'text/html' }));
      a.download = fn;
      a.click();
    }

    async function uploadToGithub() {
      const token = document.getElementById('ghToken').value.trim();
      const path = document.getElementById('fileName').value.trim() || 'web_arsiv.html';
      const content = document.getElementById('codeEditor').value;

      if (!token) return alert('GitHub Token gereklidir.');

      const enc = btoa(unescape(encodeURIComponent(content)));
      const apiUrl = `https://api.github.com/repos/${REPO}/contents/${path}`;

      try {
        let sha = null;
        const cr = await fetch(apiUrl, { headers: { Authorization: `token ${token}` } });
        if (cr.ok) sha = (await cr.json()).sha;

        const res = await fetch(apiUrl, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Arşiv: ${path}`, content: enc, sha: sha || undefined })
        });

        if (res.ok) alert(`${REPO} reposuna başarıyla yüklendi!`);
        else alert('Hata: ' + (await res.json()).message);
      } catch (e) {
        alert('İşlem başarısız: ' + e.message);
      }
    }

    // Yüzen Kapatma Butonu Sürükleme Mantığı
    const dragBtn = document.getElementById('floatingCloseBtn');
    let isDragging = false, startX, startY, initX, initY, moved = false;

    dragBtn.addEventListener('pointerdown', (e) => {
      isDragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      initX = dragBtn.offsetLeft; initY = dragBtn.offsetTop;
      dragBtn.setPointerCapture(e.pointerId);
    });

    dragBtn.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      dragBtn.style.left = `${initX + dx}px`;
      dragBtn.style.top = `${initY + dy}px`;
      dragBtn.style.right = 'auto';
    });

    dragBtn.addEventListener('pointerup', () => {
      isDragging = false;
      if (!moved) closePreview();
    });

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'SCROLL_DOWN') topBar.classList.add('hidden');
      else if (e.data.type === 'SCROLL_UP') topBar.classList.remove('hidden');
      else if (e.data.type === 'PROXY_NAVIGATE') {
        let rawTarget = e.data.url;
        if (rawTarget.includes('?url=')) {
          const parsed = new URL(rawTarget);
          rawTarget = parsed.searchParams.get('url') || rawTarget;
        }
        navigate(rawTarget);
      }
    });
  </script>
</body>
</html>
