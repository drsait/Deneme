<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BİRİM TELEFONU</title>
    <!-- Telefon İkonlu Favicon (Data URI Formatında SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23000000'%3E%3Cpath d='M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z'/%3E%3C/svg%3E">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        /* 80mm Barkod / Termal Etiket Alanı */
        .thermal-label {
            width: 80mm;
            background: #ffffff;
            border: 1px dashed #666;
            padding: 3mm 2mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .instruction {
            font-size: 11pt;
            font-weight: 800;
            color: #000;
            line-height: 1.15;
            letter-spacing: 0.1px;
            margin-bottom: 2px;
        }

        /* Telefon Numarası: 20pt, ultra kalın ve sıkışık yapıda */
        .phone-number {
            font-size: 20pt;
            font-weight: 900;
            color: #000;
            line-height: 1.0;
            letter-spacing: 0.5px;
            padding: 4px 2px;
            border-radius: 4px;
            display: block;
            border: 3px solid #000;
            width: 100%;
            background-color: #fff;
            word-break: break-all;
        }

        .print-btn {
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .print-btn:hover {
            background-color: #333;
        }

        /* YAZDIRMA AYARLARI (80mm Termal Kağıt) */
        @media print {
            body {
                background: white;
                display: block;
                padding: 0;
                margin: 0;
            }

            .print-btn {
                display: none !important;
            }

            .thermal-label {
                width: 80mm;
                border: none;
                box-shadow: none;
                padding: 1mm 1mm;
                margin: 0 auto;
                page-break-inside: avoid;
            }

            @page {
                size: 80mm auto;
                margin: 0;
            }
        }
    </style>
</head>
<body onclick="window.print()">

    <div class="thermal-label">
        <div class="content">
            <div class="instruction">
                İSİM, SOYİSİM BOY VE KİLO WHATSAPP
            </div>
            <div class="phone-number">
                0 539 214 79 24
            </div>
        </div>
    </div>

    <button class="print-btn" onclick="event.stopPropagation(); window.print();">YAZDIR</button>

</body>
</html>
