      const map = {};
      _d.forEach(i => {
        const k = `${i.ilce}_${i.asm}`;
        if (!map[k]) map[k] = { ilce: i.ilce, asm: i.asm, ahbler: [] };
        map[k].ahbler.push(i.ahb);
      });
      const list = Object.values(map);

      const searchInput = document.getElementById('searchInput');
      const districtSelect = document.getElementById('districtSelect');
      const asmList = document.getElementById('asmList');
      const resultCount = document.getElementById('resultCount');
      const metaLayer = document.getElementById('sys-meta-layer');

      function initSecurityLayer() {
        if (!metaLayer) return;
        const btn = document.createElement('button');
        btn.className = 'sys-btn';
        btn.innerHTML = '<span>©</span> Telif & Bilgi';
        const box = document.createElement('div');
        box.className = 'sys-box';
        box.style.display = 'none';
        box.textContent = _sig;
        btn.onclick = () => {
          box.style.display = box.style.display === 'none' ? 'inline-block' : 'none';
        };
        metaLayer.appendChild(btn);
        metaLayer.appendChild(document.createElement('br'));
        metaLayer.appendChild(box);
      }

      function verifyIntegrity() {
        if (!metaLayer || !metaLayer.innerHTML.includes('©')) {
          document.body.innerHTML = '<div style="padding:40px;text-align:center;font-weight:bold;color:red;">Sistem bütünlüğü doğrulanamadı. Kod üzerinde yetkisiz değişiklik tespit edildi.</div>';
          return false;
        }
        return true;
      }

      const dists = [...new Set(list.map(i => i.ilce))].sort((a,b) => a.localeCompare(b, 'tr'));
      dists.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });

      function render(records, query = '') {
        if (!verifyIntegrity()) return;
        resultCount.textContent = `${records.length} ASM listeleniyor`;
        if (records.length === 0) {
          asmList.innerHTML = `<div class="empty">Eşleşen ASM veya AHB bulunamadı.</div>`;
          return;
        }
        asmList.innerHTML = records.map(i => {
          const searchUrl = `https://www.google.com/search?udm=50&q=${encodeURIComponent('Mardin '+ i.asm + ' iletişim bilgileri, çalışan aile hekimi ve aile sağlığı çalışanın adı soyadı çalıştığı birimin numarasıyla birlikte bul ve tablo yap detaylı ve ayrıntılı olsun. tüm birimleri ayrı ayrı yaz')}`;
          return `
            <div class="asm-card">
              <div class="asm-header">
                <div class="asm-title">${i.asm}</div>
                <a href="${searchUrl}" target="_blank" rel="noopener noreferrer" class="info-btn">İletişim Bilgileri</a>
              </div>
              <div class="ahb-group">
                ${i.ahbler.map(ahb => {
                  const match = query && ahb.includes(query);
                  return `<span class="ahb-pill ${match ? 'highlight' : ''}">${ahb} Nolu AHB</span>`;
                }).join('')}
              </div>
            </div>
          `;
        }).join('');
      }

      function handleFilter() {
        const q = searchInput.value.trim().toLocaleLowerCase('tr');
        const dist = districtSelect.value;
        const filtered = list.filter(item => {
          const matchDist = !dist || item.ilce === dist;
          const matchASM = item.asm.toLocaleLowerCase('tr').includes(q);
          const matchAHB = item.ahbler.some(ahb => ahb.toLocaleLowerCase('tr').includes(q));
          return matchDist && (matchASM || matchAHB);
        });
        render(filtered, q);
      }

      searchInput.addEventListener('input', handleFilter);
      districtSelect.addEventListener('change', handleFilter);
      initSecurityLayer();
      render(list);
    })();
