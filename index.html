<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosya Deposu</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            --warning: #f59e0b;
            --success: #10b981;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            max-width: 1000px;
            position: relative;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            background: #fff;
            color: var(--text);
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary);
            background: #f5f3ff;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .file-upload-text span {
            color: var(--primary);
            font-weight: 600;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-danger {
            background-color: var(--danger);
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        /* Satır içi geçici mesaj göstergesi */
        .inline-toast {
            font-size: 0.82rem;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-list {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .file-list::-webkit-scrollbar {
            width: 6px;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .file-item:hover {
            background: #f1f5f9;
        }

        .file-link {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.92rem;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            margin-right: 12px;
        }

        .file-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .rename-btn {
            color: var(--warning);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .rename-btn:hover {
            background: var(--warning);
            color: white;
            border-color: var(--warning);
        }

        .delete-btn {
            color: var(--danger);
            border-color: rgba(244, 63, 94, 0.3);
            display: none;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .info-text {
            text-align: center;
            color: var(--text-muted);
            padding: 24px;
            font-size: 0.9rem;
        }

        .protected-content {
            display: none;
        }

        /* Çıkış, Sil ve Yenile butonları için düzen */
        .auth-actions {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 6px;
            align-items: center;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            box-shadow: none;
            padding: 10px 12px;
        }

        .btn-secondary:hover {
            background-color: var(--danger);
            color: white;
        }
        
        .btn-secondary.active {
             background-color: #991b1b;
             color: white;
             border-color: #991b1b;
        }

        .btn-icon {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            box-shadow: none;
            padding: 10px 12px;
        }

        .btn-icon:hover {
            background-color: var(--primary);
            color: white;
        }

        /* Özel Mini Yeniden Adlandırma Modalı */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .modal-card {
            background: white;
            padding: 20px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 360px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: scaleUp 0.2s ease-out;
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-card h4 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .modal-actions .btn {
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>Dosya Deposu</h1>
        </header>

        <div class="main-layout">
            <!-- Sol Menü -->
            <div class="sidebar">
                <div class="card" id="auth-card">
                    <div id="auth-form-container">
                        <div class="form-row">
                            <input type="password" id="github-token" placeholder="Şifreyi girin">
                            <button class="btn" onclick="saveToken()">Kaydet</button>
                        </div>
                    </div>
                    
                    <div id="logout-container" style="display: none;">
                        <div class="auth-actions">
                            <button class="btn btn-danger" onclick="forgetIdentity()" title="Çıkış Yap">Çıkış</button>
                            <button id="toggle-delete-menu-btn" class="btn btn-secondary" onclick="toggleDeleteMode()" title="Dosya Sil">Sil</button>
                            <button class="btn btn-icon" onclick="refreshFiles()" title="Sayfayı Yenile">🔄</button>
                        </div>
                    </div>
                    <div id="auth-toast" class="inline-toast"></div>
                </div>

                <!-- Korumalı Sol Menü Parçası -->
                <div id="secure-sidebar" class="protected-content">
                    <div class="card">
                        <div class="file-upload-wrapper">
                            <input type="file" id="file-input" onchange="handleFileSelect(this)">
                            <div class="file-upload-text" id="file-label">
                                Dosya seçmek için tıklayın veya <span>sürükleyip bırakın</span>
                            </div>
                        </div>
                        <div id="upload-toast" class="inline-toast"></div>
                    </div>
                </div>
            </div>

            <!-- Orta Alan: Dosya Listesi -->
            <div class="content-area">
                <div id="secure-content" class="protected-content">
                    <div class="card">
                        <ul id="file-list" class="file-list">
                            <li class="info-text">Yükleniyor...</li>
                        </ul>
                        <div id="list-toast" class="inline-toast" style="margin-top: 12px; text-align: center;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Şirin Mini Yeniden Adlandırma Penceresi -->
    <div id="rename-modal" class="modal-overlay">
        <div class="modal-card">
            <h4>Dosyayı Yeniden Adlandır</h4>
            <input type="text" id="new-filename-input" placeholder="Yeni dosya adı">
            <div class="modal-actions">
                <button class="btn" style="background: var(--text-muted);" onclick="closeRenameModal()">İptal</button>
                <button class="btn" onclick="confirmRename()">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const username = 'drsait';
        const repo = 'Deneme';
        let deleteModeActive = false;
        
        // Yeniden adlandırma için geçici değişkenler
        let currentRenameFile = { name: '', sha: '' };

        window.onload = function() {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('github-token').value = savedToken;
                verifyAndUnlock(savedToken, false);
            }
        };

        function showToast(elementId, message, type = 'success') {
            const toast = document.getElementById(elementId);
            toast.textContent = message;
            toast.style.display = 'block';
            
            if (type === 'success') {
                toast.style.backgroundColor = '#ecfdf5';
                toast.style.color = '#065f46';
                toast.style.border = '1px solid #10b981';
            } else {
                toast.style.backgroundColor = '#fef2f2';
                toast.style.color = '#991b1b';
                toast.style.border = '1px solid #f43f5e';
            }

            if (toast.timeoutId) {
                clearTimeout(toast.timeoutId);
            }

            toast.timeoutId = setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }

        function saveToken() {
            const token = document.getElementById('github-token').value.trim();
            if (token) {
                verifyAndUnlock(token, true);
            } else {
                showToast('auth-toast', 'Lütfen şifreyi girin.', 'error');
            }
        }

        function forgetIdentity() {
            localStorage.removeItem('github_token');
            document.getElementById('github-token').value = '';
            
            document.querySelectorAll('.protected-content').forEach(el => el.style.display = 'none');
            document.getElementById('logout-container').style.display = 'none';
            document.getElementById('auth-form-container').style.display = 'block';
            
            showToast('auth-toast', 'Çıkış yapıldı', 'success');
            
            deleteModeActive = false;
            document.getElementById('toggle-delete-menu-btn').classList.remove('active');
        }

        function verifyAndUnlock(token, showAlert = true) {
            const authFormContainer = document.getElementById('auth-form-container');
            const logoutContainer = document.getElementById('logout-container');

            fetch(`https://api.github.com/repos/${username}/${repo}/contents`, {
                headers: { 'Authorization': `token ${token}` }
            })
            .then(response => {
                if (response.ok) {
                    localStorage.setItem('github_token', token);
                    if (showAlert) {
                        showToast('auth-toast', 'Giriş yapıldı', 'success');
                    }
                    
                    authFormContainer.style.display = 'none';
                    logoutContainer.style.display = 'block';
                    
                    document.querySelectorAll('.protected-content').forEach(el => el.style.display = 'block');
                    loadFiles();
                } else {
                    localStorage.removeItem('github_token');
                    if (showAlert) {
                        showToast('auth-toast', 'Geçersiz şifre', 'error');
                    }
                    
                    authFormContainer.style.display = 'block';
                    logoutContainer.style.display = 'none';
                    document.querySelectorAll('.protected-content').forEach(el => el.style.display = 'none');
                }
            })
            .catch(() => {
                if (showAlert) {
                    showToast('auth-toast', 'Bağlantı hatası', 'error');
                }
                authFormContainer.style.display = 'block';
                logoutContainer.style.display = 'none';
                document.querySelectorAll('.protected-content').forEach(el => el.style.display = 'none');
            });
        }

        function refreshFiles() {
            loadFiles();
            showToast('auth-toast', 'Sayfa yenilendi', 'success');
        }

        function toggleDeleteMode() {
            deleteModeActive = !deleteModeActive;
            const toggleBtn = document.getElementById('toggle-delete-menu-btn');
            
            if (deleteModeActive) {
                toggleBtn.classList.add('active');
            } else {
                toggleBtn.classList.remove('active');
            }

            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(btn => {
                btn.style.display = deleteModeActive ? 'inline-block' : 'none';
            });
        }

        function handleFileSelect(input) {
            const label = document.getElementById('file-label');
            if (input.files.length > 0) {
                label.innerHTML = `Seçilen dosya: <strong>${input.files[0].name}</strong>`;
                uploadFile();
            } else {
                label.innerHTML = 'Dosya seçmek için tıklayın veya <span>sürükleyip bırakın</span>';
            }
        }

        function loadFiles() {
            const token = localStorage.getItem('github_token');
            if (!token) return;

            fetch(`https://api.github.com/repos/${username}/${repo}/contents`, {
                headers: { 'Authorization': `token ${token}` }
            })
                .then(response => response.json())
                .then(data => {
                    const listElement = document.getElementById('file-list');
                    listElement.innerHTML = '';
                    
                    if (!Array.isArray(data)) {
                        listElement.innerHTML = '<li class="info-text" style="color:var(--danger);">Yetki hatası veya depo bulunamadı.</li>';
                        return;
                    }
                    
                    const files = data.filter(file => file.name.toLowerCase() !== 'index.html');

                    if (files.length === 0) {
                        listElement.innerHTML = '<li class="info-text">Depoda hiç dosya yok.</li>';
                        return;
                    }

                    files.forEach(file => {
                        const listItem = document.createElement('li');
                        listItem.className = 'file-item';
                        
                        const link = document.createElement('a');
                        link.href = `https://${username}.github.io/${repo}/${file.name}`;
                        link.textContent = file.name;
                        link.className = 'file-link';
                        link.target = '_blank';
                        link.innerHTML = `📄 ${file.name}`;
                        
                        const actionsDiv = document.createElement('div');
                        actionsDiv.className = 'action-buttons';

                        const renameButton = document.createElement('button');
                        renameButton.textContent = 'Yeniden Adlandır';
                        renameButton.className = 'action-btn rename-btn';
                        renameButton.onclick = () => openRenameModal(file.name, file.sha);

                        const deleteButton = document.createElement('button');
                        deleteButton.textContent = 'Sil';
                        deleteButton.className = 'action-btn delete-btn';
                        deleteButton.style.display = deleteModeActive ? 'inline-block' : 'none';
                        deleteButton.onclick = () => deleteFile(file.name, file.sha);

                        actionsDiv.appendChild(renameButton);
                        actionsDiv.appendChild(deleteButton);

                        listItem.appendChild(link);
                        listItem.appendChild(actionsDiv);
                        listElement.appendChild(listItem);
                    });
                })
                .catch(error => {
                    document.getElementById('file-list').innerHTML = '<li class="info-text" style="color:var(--danger);">Bağlantı hatası oluştu.</li>';
                    console.error(error);
                });
        }

        function uploadFile() {
            const token = localStorage.getItem('github_token');
            const fileInput = document.getElementById('file-input');
            const label = document.getElementById('file-label');

            if (!token) {
                showToast('upload-toast', 'Lütfen önce şifrenizi girin.', 'error');
                return;
            }

            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            showToast('upload-toast', `${file.name} yükleniyor...`, 'success');

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function () {
                const base64Content = reader.result.split(',')[1];
                const apiURL = `https://api.github.com/repos/${username}/${repo}/contents/${file.name}`;

                fetch(apiURL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Web üzerinden yüklendi: ${file.name}`,
                        content: base64Content
                    })
                })
                .then(response => {
                    if (response.ok) {
                        showToast('upload-toast', `${file.name} yüklendi`, 'success');
                        fileInput.value = '';
                        label.innerHTML = 'Dosya seçmek için tıklayın veya <span>sürükleyip bırakın</span>';
                        loadFiles();
                    } else {
                        return response.json().then(err => { throw new Error(err.message); });
                    }
                })
                .catch(error => {
                    showToast('upload-toast', 'Hata: ' + error.message, 'error');
                    label.innerHTML = 'Dosya seçmek için tıklayın veya <span>sürükleyip bırakın</span>';
                    console.error(error);
                });
            };
        }

        function openRenameModal(oldName, oldSha) {
            currentRenameFile = { name: oldName, sha: oldSha };
            document.getElementById('new-filename-input').value = oldName;
            document.getElementById('rename-modal').style.display = 'flex';
            document.getElementById('new-filename-input').focus();
        }

        function closeRenameModal() {
            document.getElementById('rename-modal').style.display = 'none';
        }

        function confirmRename() {
            const token = localStorage.getItem('github_token');
            const newName = document.getElementById('new-filename-input').value.trim();
            const oldName = currentRenameFile.name;
            const oldSha = currentRenameFile.sha;

            if (!newName || newName === oldName) {
                closeRenameModal();
                return;
            }

            closeRenameModal();
            showToast('list-toast', `${oldName} yeniden adlandırılıyor...`, 'success');

            const getURL = `https://api.github.com/repos/${username}/${repo}/contents/${oldName}`;

            fetch(getURL, {
                headers: { 'Authorization': `token ${token}` }
            })
            .then(res => res.json())
            .then(fileData => {
                const content = fileData.content; 
                const newURL = `https://api.github.com/repos/${username}/${repo}/contents/${newName}`;

                return fetch(newURL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Yeniden adlandırıldı: ${oldName} -> ${newName}`,
                        content: content
                    })
                })
                .then(newRes => {
                    if (!newRes.ok) throw new Error('Yeni dosya oluşturulamadı.');
                    
                    return fetch(getURL, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Kaldırıldı (Yeniden adlandırma sebebiyle): ${oldName}`,
                            sha: oldSha
                        })
                    });
                });
            })
            .then(delRes => {
                if (delRes.ok) {
                    showToast('list-toast', `${oldName} yeniden adlandırıldı`, 'success');
                    loadFiles();
                } else {
                    throw new Error('Eski dosya silinemedi.');
                }
            })
            .catch(error => {
                showToast('list-toast', 'Yeniden adlandırma hatası', 'error');
                console.error(error);
            });
        }

        function deleteFile(fileName, fileSha) {
            const token = localStorage.getItem('github_token');

            if (!confirm(`"${fileName}" adlı dosyayı silmek istediğinize emin misiniz?`)) {
                return;
            }

            const apiURL = `https://api.github.com/repos/${username}/${repo}/contents/${fileName}`;

            fetch(apiURL, {
                method: 'DELETE',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: `Web üzerinden silindi: ${fileName}`,
                    sha: fileSha
                })
            })
            .then(response => {
                if (response.ok) {
                    showToast('list-toast', `${fileName} silindi`, 'success');
                    loadFiles();
                } else {
                    return response.json().then(err => { throw new Error(err.message); });
                }
            })
            .catch(error => {
                showToast('list-toast', 'Silme hatası', 'error');
                console.error(error);
            });
        }
    </script>
</body>
</html>
