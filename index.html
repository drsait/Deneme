<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Dosya Listesi</title>
</head>
<body>
    <h1>Depomdaki Dosyalar</h1>
    <ul id="file-list">Yükleniyor...</ul>

    <script>
        const username = 'drsait';
        const repo = 'Deneme';

        fetch(`https://api.github.com/repos/${username}/${repo}/contents`)
            .then(response => response.json())
            .then(data => {
                const listElement = document.getElementById('file-list');
                listElement.innerHTML = '';
                data.forEach(file => {
                    if (file.name.toLowerCase() === 'index.html') return;
                    
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = `https://${username}.github.io/${repo}/${file.name}`;
                    link.textContent = file.name;
                    link.target = '_blank';
                    listItem.appendChild(link);
                    listElement.appendChild(listItem);
                });
            })
            .catch(error => {
                document.getElementById('file-list').textContent = 'Dosyalar yüklenirken bir hata oluştu.';
                console.error(error);
            });
    </script>
</body>
</html>
