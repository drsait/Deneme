<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SİNA Hızlı Erişim Konsolu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h1 { margin-bottom: 0.5rem; font-size: 1.4rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
        .badge {
            background: rgba(255,255,255,0.2);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>SİNA Modül Konsolu</h1>
    <p>Açmak istediğiniz modüle tıklayın (Tam ekran pencere olarak açılır):</p>
    <div class="grid" id="btnContainer"></div>
</div>

<script>
    const PARAMS = {
        BIRIM_KODU: "461491",
        YIL: "2026",
        AY: "EYLUL",
        AY_KHT: "EYLÜL",
        AHB_ADI: "Mardin Kızıltepe 18 Nolu AHB - Mardin"
    };

    const LINK_SABLONLARI = {
        "SİNA ANA PANEL": "https://sina.saglik.gov.tr/showcases/SC-DBBEMXEEDFCCEAB/SCI-2N8Y5C2ADDC1FCD?filters=252840={AY}%26252860={BIRIM_KODU}%26252916={YIL}",
        "KHT TAKİP": "https://sina.saglik.gov.tr/showcases/SC-2DF3A82DF98O48J/SCI-VCQ97DDE181J1HA?filters=300699={YIL}%26300707={AY_KHT}%26300711={BIRIM_KODU}",
        "MEMNUNİYET": "https://sina.saglik.gov.tr/showcases/SC-AA6Q1F9AU1B4B2O/SCI-E52DD7UAC0Y24Z5?filters=27693={YIL}-01-01%252000%253A00%253A00%2627693={YIL}-12-31%252023%253A59%253A59",
        "MUAYENE SAYILARI": "https://sina.saglik.gov.tr/showcases/SC-AA6Q1F9AU1B4B2O/SCI-E52DD7UAC0Y24Z5?filters=27477={AHB_ADI}",
        "OTİZM TARAMA": "https://sina.saglik.gov.tr/showcases/SC-DBBEMXEEDFCCEAB/SCI-4N2O921XV9IX02M?filters=372133={BIRIM_KODU}"
    };

    function linkOlustur(sablon) {
        let url = sablon;
        for (const [key, val] of Object.entries(PARAMS)) {
            url = url.replaceAll(`{${key}}`, val);
        }
        return url;
    }

    // Tam ekran boyutunda bağımsız pencere açar
    function acPencere(url, title) {
        const w = screen.availWidth;
        const h = screen.availHeight;
        window.open(url, title, `width=${w},height=${h},top=0,left=0,menubar=no,status=no,toolbar=no`);
    }

    const container = document.getElementById('btnContainer');
    for (const [ad, sablon] of Object.entries(LINK_SABLONLARI)) {
        const url = linkOlustur(sablon);
        const b = document.createElement('button');
        b.className = 'btn';
        b.innerHTML = `<span>${ad}</span><span class="badge">AÇ ↗</span>`;
        b.onclick = () => acPencere(url, ad);
        container.appendChild(b);
    }
</script>
</body>
</html>
