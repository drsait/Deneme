<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duvar Kağıtları</title>
  <style id="kb-style"></style>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#121212;color:#fff;padding:10px}
    body.fs{overflow:hidden;padding:0}
    .header{text-align:center;margin-bottom:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%}
    .dd-cont{position:relative;display:inline-block;width:100%;max-width:260px}
    .dd-btn{background:#222;color:#fff;border:1px solid #444;padding:10px 16px;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;user-select:none}
    .dd-btn:hover{border-color:#0078d4}
    .dd-menu{display:none;position:absolute;top:calc(100% + 5px);left:0;background:#1e1e1e;border:1px solid #444;border-radius:8px;width:100%;max-height:300px;overflow-y:auto;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.6);padding:8px}
    .dd-menu.show{display:block}
    .dd-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px;color:#ddd;user-select:none}
    .dd-item:hover{background:#2a2a2a}
    .dd-item input{accent-color:#0078d4;width:16px;height:16px;cursor:pointer}
    select{padding:10px 14px;border-radius:6px;font-size:14px;font-weight:bold;background:#222;color:#fff;border:1px solid #444;outline:none;cursor:pointer}
    .btn{background:#0078d4;color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;font-weight:bold;border:none;cursor:pointer;transition:background .2s;white-space:nowrap}
    .btn:hover{background:#005a9e}
    .btn-dl{background:#28a745}.btn-dl:hover{background:#218838}
    .btn-sl{background:#8a2be2}.btn-sl:hover{background:#731ec2}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .card{background:#1e1e1e;border-radius:8px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.4);display:flex;flex-direction:column;position:relative}
    .card img{width:100%;height:140px;object-fit:cover;cursor:pointer;background:#2a2a2a}
    .card.img-error{display:none}
    .card-info{padding:8px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#bbb;gap:4px}.src{color:#7fc7ff;font-size:10px}
    .card-check{position:absolute;top:8px;left:8px;width:22px;height:22px;cursor:pointer;z-index:2;accent-color:#0078d4}
    #loader{text-align:center;padding:20px;color:#888;font-size:14px}
    #modal{display:none;position:fixed;inset:0;background:#000;z-index:100;justify-content:center;align-items:center;user-select:none;overflow:hidden}
    
    .modal-img{position:absolute;width:100vw;height:100vh;object-fit:cover;min-width:100vw;min-height:100vh;transform-origin:center;pointer-events:none;opacity:0;transition:opacity 2s ease-in-out, filter 2s ease-in-out;filter:blur(20px) contrast(200%);}
    .modal-img.active{opacity:1;filter:blur(0) contrast(100%);}
    .modal-img.paused{transform:scale(1)!important;object-fit:contain!important}

    .kb{animation-name:rm;animation-timing-function:cubic-bezier(0.25,0.1,0.25,1);animation-fill-mode:forwards}
    .nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);color:#fff;border:none;font-size:24px;width:40px;height:50px;border-radius:6px;cursor:pointer;z-index:102;backdrop-filter:blur(4px);transition:opacity .4s}
    .prev-btn{left:10px}.next-btn{right:10px}
    .top-bar{position:absolute;top:15px;right:15px;display:flex;gap:8px;align-items:center;z-index:102;transition:opacity .4s}
    .act-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:18px;width:40px;height:40px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .ui-hide{opacity:0!important;pointer-events:none!important;cursor:none!important}
    @media(min-width:768px){
      body{padding:20px}
      .gallery{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
      .card img{height:180px}
      .card-info{font-size:12px;padding:10px}
      .dd-cont{width:auto;max-width:none}
      .dd-btn{width:auto}
      .nav-btn{font-size:30px;width:50px;height:60px}
      .prev-btn{left:20px}
      .next-btn{right:20px}
      .top-bar{top:20px;right:25px}
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Duvar Kağıtları</h2><div style="font-size:12px;color:#888">Kaynaklar: Openverse • Wikimedia Commons • Flickr • Wallhaven</div>
    <div class="controls">
      <div class="dd-cont">
        <button class="dd-btn" id="cat-btn" onclick="document.getElementById('dd-menu').classList.toggle('show')">
          <span>Kategoriler (Tümü)</span> ▾
        </button>
        <div class="dd-menu" id="dd-menu">
          <label class="dd-item">
            <input type="checkbox" id="cat-all" value="all" checked onchange="handleCat(this)">
            <strong>Tüm Kategoriler</strong>
          </label>
          <hr style="border:0;border-top:1px solid #333;margin:4px 0">
          <div id="cat-items"></div>
        </div>
      </div>
      <div class="dd-cont">
        <button class="dd-btn" id="src-btn" onclick="document.getElementById('src-menu').classList.toggle('show')">
          <span>Kaynaklar (Tümü)</span> ▾
        </button>
        <div class="dd-menu" id="src-menu">
          <label class="dd-item">
            <input type="checkbox" id="src-all" value="all" checked onchange="handleSource(this)">
            <strong>Tüm Kaynaklar</strong>
          </label>
          <hr style="border:0;border-top:1px solid #333;margin:4px 0">
          <div id="src-items"></div>
        </div>
      </div>
      <select id="res-sel" onchange="refreshGrid()">
        <option value="1920x1080">FHD (1920x1080)</option>
        <option value="2560x1440">2K (2560x1440)</option>
        <option value="3840x2160">4K (3840x2160)</option>
      </select>
      <button class="btn btn-sl" onclick="startSlide()">▶ Slayt</button>
      <button class="btn" id="sel-all-btn" onclick="toggleAll()">Tümünü Seç</button>
      <button class="btn" onclick="shufflePhotos()">🔀 Fotoğrafları Karıştır</button>
      <button class="btn" onclick="refreshGrid()">Yenile</button>
      <button class="btn btn-dl" id="bulk-btn" onclick="bulkDl()">İndir (0)</button>
    </div>
  </div>

  <div class="gallery" id="gallery"></div>
  <div id="loader">Yükleniyor...</div>
  <div id="scroll-sentinel" style="height:1px"></div>

  <div id="modal">
    <div class="top-bar ui-hide" id="top-bar">
      <button class="act-btn" id="play-btn" onclick="toggleSlide(event)" title="Slaytı Oynat / Durdur">⏸</button>
      <button class="act-btn" onclick="toggleFs()" title="Tam Ekran Aç/Kapat">⛶</button>
      <button class="act-btn" onclick="closeModal()" title="Slaytı Kapat">✕</button>
    </div>
    <button class="nav-btn prev-btn ui-hide" onclick="changeImg(-1,event,true)" title="Önceki Foto">‹</button>
    <img id="img1" class="modal-img active" alt="">
    <img id="img2" class="modal-img" alt="">
    <button class="nav-btn next-btn ui-hide" onclick="changeImg(1,event,true)" title="Sonraki Foto">›</button>
  </div>

  <script>
    const CATS = [
      {id:"space",l:"Uzay",q:"space galaxy stars"},{id:"nature",l:"Doğa",q:"nature landscape"},{id:"mountain",l:"Dağlar",q:"mountain landscape"},
      {id:"sea",l:"Deniz",q:"sea ocean coast"},{id:"forest",l:"Orman",q:"forest trees"},{id:"city",l:"Şehir",q:"city skyline"},
      {id:"architecture",l:"Mimari",q:"architecture building"},{id:"sunset",l:"Gün Batımı",q:"sunset landscape"},{id:"desert",l:"Çöl",q:"desert dunes"},
      {id:"aurora",l:"Aurora",q:"aurora borealis"},{id:"animals",l:"Hayvanlar",q:"wildlife animals"},{id:"underwater",l:"Sualtı",q:"underwater ocean"},
      {id:"night",l:"Gece",q:"night landscape"},{id:"minimal",l:"Minimal",q:"minimalist landscape"},{id:"abstract",l:"Soyut",q:"abstract background"},
      {id:"macro",l:"Makro",q:"macro photography"},{id:"winter",l:"Kış",q:"winter snow landscape"},{id:"autumn",l:"Sonbahar",q:"autumn fall landscape"},
      {id:"waterfall",l:"Şelale",q:"waterfall nature"},{id:"clouds",l:"Bulut",q:"clouds sky"},{id:"roads",l:"Yol",q:"road landscape"},
      {id:"aerial",l:"Drone",q:"aerial landscape drone"}
    ];

    const SOURCES = [
      {id:"openverse", l:"Openverse"},
      {id:"wikimedia", l:"Wikimedia"},
      {id:"flickr", l:"Flickr"},
      {id:"wallhaven", l:"Wallhaven"}
    ];

    let photos = [], selSet = new Set(), selCats = new Set(['all']), selSources = new Set(['all']), curr = 0, page = 1, loading = false, timer = null, slideActive = false, hideTO = null, tX = 0, tT = 0, activeImgBox = 1, fillBusy = false;
    let sourceTurn = 0;
    const seenPhotoKeys = new Set(JSON.parse(sessionStorage.getItem('wallpaperSeenKeys') || '[]'));
    const seenUrls = new Set(JSON.parse(sessionStorage.getItem('wallpaperSeenUrls') || '[]'));

    function rememberPhoto(key, url) {
      seenPhotoKeys.add(key);
      seenUrls.add(url);
      // Bellek şişmesin diye son 5000 benzersiz kayıt tutulur.
      const keys = Array.from(seenPhotoKeys).slice(-5000);
      const urls = Array.from(seenUrls).slice(-5000);
      sessionStorage.setItem('wallpaperSeenKeys', JSON.stringify(keys));
      sessionStorage.setItem('wallpaperSeenUrls', JSON.stringify(urls));
    }

    function getSelectedQueries() {
      const selected = selCats.has('all') ? CATS : CATS.filter(c => selCats.has(c.id));
      return selected.map(c => c.q);
    }

    function pickQuery() {
      const qs = getSelectedQueries();
      return qs[Math.floor(Math.random() * qs.length)] || 'nature landscape';
    }

    function cleanUrl(u) {
      try {
        const x = new URL(u);
        x.hash = '';
        return x.toString();
      } catch { return u; }
    }

    function hashCode(str) {
      let h = 0;
      for(let i=0; i<str.length; i++) h = (((h << 5) - h) + str.charCodeAt(i)) | 0;
      return h;
    }
    const $ = id => document.getElementById(id);

    CATS.forEach(c => $('cat-items').innerHTML += `<label class="dd-item"><input type="checkbox" value="${c.id}" onchange="handleCat(this)"> ${c.l}</label>`);
    SOURCES.forEach(s => $('src-items').innerHTML += `<label class="dd-item"><input type="checkbox" value="${s.id}" onchange="handleSource(this)"> ${s.l}</label>`);
    window.onclick = e => {
      if(!$('cat-btn').contains(e.target) && !$('dd-menu').contains(e.target)) $('dd-menu').classList.remove('show');
      if(!$('src-btn').contains(e.target) && !$('src-menu').contains(e.target)) $('src-menu').classList.remove('show');
    };

    function handleCat(el) {
      const all = $('cat-all'), inputs = document.querySelectorAll('#cat-items input');
      if(el.value === 'all') {
        if(el.checked) { inputs.forEach(i => i.checked = false); selCats.clear(); selCats.add('all'); }
        else el.checked = true;
      } else {
        all.checked = false; selCats.delete('all');
        if(el.checked) selCats.add(el.value); else selCats.delete(el.value);
        if(!selCats.size) { all.checked = true; selCats.add('all'); }
      }
      $('cat-btn').firstElementChild.textContent = selCats.has('all') ? 'Kategoriler (Tümü)' : `Kategoriler (${selCats.size})`;
      refreshGrid();
    }

    function handleSource(el) {
      const all = $('src-all'), inputs = document.querySelectorAll('#src-items input');
      if(el.value === 'all') {
        if(el.checked) { inputs.forEach(i => i.checked = false); selSources.clear(); selSources.add('all'); }
        else el.checked = true;
      } else {
        all.checked = false; selSources.delete('all');
        if(el.checked) selSources.add(el.value); else selSources.delete(el.value);
        if(!selSources.size) { all.checked = true; selSources.add('all'); }
      }
      $('src-btn').firstElementChild.textContent = selSources.has('all') ? 'Kaynaklar (Tümü)' : `Kaynaklar (${selSources.size})`;
      refreshGrid();
    }

    function getSelectedSourceIds() {
      return selSources.has('all') ? SOURCES.map(s => s.id) : Array.from(selSources);
    }


    async function refreshGrid() {
      page = 1;
      photos = [];
      selSet.clear();
      updateUI();
      $('gallery').innerHTML = '';
      await loadPhotos();
      ensureViewportFilled();
    }


    function imageLoads(url, timeout = 8000) {
      return new Promise(resolve => {
        const img = new Image();
        let done = false;
        const finish = ok => {
          if(done) return;
          done = true;
          clearTimeout(to);
          resolve(ok);
        };
        const to = setTimeout(() => finish(false), timeout);
        img.onload = () => finish(true);
        img.onerror = () => finish(false);
        img.referrerPolicy = 'no-referrer';
        img.src = url;
      });
    }

    function flickrFeed(tags) {
      return new Promise((resolve, reject) => {
        const cb = '__flickr_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
        const s = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('Flickr zaman aşımı'));
        }, 12000);

        function cleanup() {
          clearTimeout(timer);
          try { delete window[cb]; } catch {}
          s.remove();
        }

        window[cb] = data => {
          cleanup();
          resolve(data);
        };

        s.onerror = () => {
          cleanup();
          reject(new Error('Flickr feed yüklenemedi'));
        };

        s.src = 'https://www.flickr.com/services/feeds/photos_public.gne'
          + '?format=json'
          + '&jsoncallback=' + encodeURIComponent(cb)
          + '&tagmode=all'
          + '&tags=' + encodeURIComponent(tags);
        document.head.appendChild(s);
      });
    }

    function renderCard(f, i) {
      const div = document.createElement('div');
      div.className = 'card';
      div.dataset.photoIndex = String(i);
      div.innerHTML = `<input type="checkbox" class="card-check" id="chk-${i}" onchange="toggleCard(${i},this.checked)">
        <img src="${f.url}" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.closest('.card').classList.add('img-error')"
             onclick="openModal(${i})">
        <div class="card-info">
          <div><strong>${f.w}x${f.h}</strong><br><span class="src">${f.source}</span><br><span id="sz-${i}" style="color:#888">...</span></div>
          <button class="btn btn-dl" style="padding:4px 8px;font-size:11px" onclick="dlSingle('${f.url.replace(/'/g,"%27")}','${f.id}')">İndir</button>
        </div>`;
      $('gallery').appendChild(div);

      fetch(f.url, {cache:'no-store', mode:'cors'}).then(async r => {
        if(!r.ok) throw new Error('HTTP '+r.status);
        const b = await r.blob();
        const el = $(`sz-${i}`);
        if(el) {
          const bytes = b.size;
          el.textContent = bytes >= 1048576
            ? (bytes/1048576).toFixed(2) + ' MB'
            : (bytes/1024).toFixed(0) + ' KB';
        }
      }).catch(() => {
        const el = $(`sz-${i}`);
        if(el) el.textContent = '';
      });
    }

    function renderAllPhotos() {
      $('gallery').innerHTML = '';
      photos.forEach((f, i) => renderCard(f, i));
      updateUI();
    }

    function shufflePhotos() {
      if(photos.length < 2) return;
      for(let i = photos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [photos[i], photos[j]] = [photos[j], photos[i]];
      }
      selSet.clear();
      curr = 0;
      renderAllPhotos();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    async function loadPhotos(autoSlide = false) {
      if(loading) return false;
      loading = true;
      $('loader').style.display = 'block';

      const [w, h] = $('res-sel').value.split('x');
      const wanted = 20;
      const fresh = [];

      async function fromOpenverse(count) {
        const q = pickQuery();
        const p = Math.max(1, page + Math.floor(Math.random() * 5));
        const url = `https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=${Math.min(50, count * 3)}&page=${p}`;
        const r = await fetch(url, {cache:'no-store'});
        if(!r.ok) throw new Error('Openverse HTTP '+r.status);
        const j = await r.json();
        for(const x of (j.results || [])) {
          if(fresh.length >= wanted) break;
          const img = x.url || x.thumbnail;
          if(!img) continue;
          const key = `openverse:${x.id || img}`;
          const finalUrl = cleanUrl(img);
          if(seenPhotoKeys.has(key) || seenUrls.has(finalUrl)) continue;
          rememberPhoto(key, finalUrl);
          fresh.push({
            url: finalUrl,
            id: `openverse_${String(x.id || Date.now()).replace(/[^a-zA-Z0-9_-]/g,'_')}.jpg`,
            w, h,
            source: 'Openverse',
            key
          });
        }
      }

      async function fromCommons(count) {
        const q = pickQuery();
        const offset = (page - 1) * Math.max(10, count);
        const params = new URLSearchParams({
          action:'query', format:'json', origin:'*',
          generator:'search', gsrsearch:`${q} filetype:bitmap`,
          gsrnamespace:'6', gsrlimit:String(Math.min(50, count * 3)),
          gsroffset:String(offset),
          prop:'imageinfo', iiprop:'url|size|mime',
          iiurlwidth:String(Math.min(Number(w), 1920))
        });
        const r = await fetch(`https://commons.wikimedia.org/w/api.php?${params}`, {cache:'no-store'});
        if(!r.ok) throw new Error('Commons HTTP '+r.status);
        const j = await r.json();
        const pages = Object.values(j.query?.pages || {});
        for(const x of pages) {
          if(fresh.length >= wanted) break;
          const ii = x.imageinfo?.[0];
          if(!ii) continue;
          if(ii.mime && !String(ii.mime).startsWith('image/')) continue;
          const img = ii.thumburl || ii.url;
          if(!img) continue;
          const key = `commons:${x.pageid || x.title}`;
          const finalUrl = cleanUrl(img);
          if(seenPhotoKeys.has(key) || seenUrls.has(finalUrl)) continue;
          rememberPhoto(key, finalUrl);
          fresh.push({
            url: finalUrl,
            id: `commons_${String(x.pageid || Date.now())}.jpg`,
            w, h,
            source: 'Wikimedia',
            key
          });
        }
      }

      async function fromFlickr(count) {
        const q = pickQuery();
        const tags = q.split(/\s+/).slice(0,3).join(',');
        const data = await flickrFeed(tags);
        const items = Array.isArray(data?.items) ? data.items : [];

        for(const x of items) {
          if(fresh.length >= wanted) break;
          const m = x?.media?.m;
          if(!m) continue;

          const candidates = [
            m.replace(/_m(\.[a-zA-Z0-9]+)(\?.*)?$/, '_b$1$2'),
            m.replace(/_m(\.[a-zA-Z0-9]+)(\?.*)?$/, '_z$1$2'),
            m
          ];

          let finalUrl = null;
          for(const u of candidates) {
            if(await imageLoads(u, 6000)) {
              finalUrl = cleanUrl(u);
              break;
            }
          }
          if(!finalUrl) continue;

          const key = `flickr:${x.link || m}`;
          if(seenPhotoKeys.has(key) || seenUrls.has(finalUrl)) continue;

          rememberPhoto(key, finalUrl);
          fresh.push({
            url: finalUrl,
            id: `flickr_${Math.abs(hashCode(x.link || finalUrl))}.jpg`,
            w, h,
            source: 'Flickr',
            key
          });
        }
      }

      async function fromWallhaven(count) {
        const q = pickQuery();
        const p = Math.max(1, page + Math.floor(Math.random() * 3));
        const params = new URLSearchParams({
          q,
          page: String(p),
          sorting: 'random',
          purity: '100',
          categories: '111',
          atleast: `${w}x${h}`
        });
        const r = await fetch(`https://wallhaven.cc/api/v1/search?${params}`, {cache:'no-store'});
        if(!r.ok) throw new Error('Wallhaven HTTP ' + r.status);
        const j = await r.json();

        for(const x of (j.data || [])) {
          if(fresh.length >= wanted) break;
          const candidates = [x.path, x.thumbs?.large, x.thumbs?.small].filter(Boolean);

          let finalUrl = null;
          for(const u of candidates) {
            if(await imageLoads(u, 5000)) {
              finalUrl = cleanUrl(u);
              break;
            }
          }
          if(!finalUrl) continue;

          const key = `wallhaven:${x.id || finalUrl}`;
          if(seenPhotoKeys.has(key) || seenUrls.has(finalUrl)) continue;

          rememberPhoto(key, finalUrl);
          fresh.push({
            url: finalUrl,
            id: `wallhaven_${String(x.id || Date.now())}.jpg`,
            w, h,
            source: 'Wallhaven',
            key
          });
        }
      }

      // Seçili kaynaklara göre dolaş.
      const sourceMap = {
        openverse: async () => fromOpenverse(wanted),
        wikimedia: async () => fromCommons(wanted),
        flickr: async () => fromFlickr(wanted),
        wallhaven: async () => fromWallhaven(wanted)
      };
      const selectedSourceIds = getSelectedSourceIds();
      const sources = selectedSourceIds.map(id => sourceMap[id]).filter(Boolean);

      let tries = 0;
      const maxTries = Math.max(1, sources.length * 2);
      while(fresh.length < wanted && tries < maxTries) {
        const idx = (sourceTurn + tries) % sources.length;
        try { await sources[idx](); } catch(e) { console.warn('Fotoğraf kaynağı hatası:', e); }
        tries++;
      }
      sourceTurn = sources.length ? (sourceTurn + 1) % sources.length : 0;

      // Eksik kalırsa seçili kaynakları bir tur daha dene.
      let extra = 0;
      while(fresh.length < wanted && extra < sources.length) {
        try { await sources[extra](); } catch(e) { console.warn('Ek kaynak denemesi:', e); }
        extra++;
      }

      const startIndex = photos.length;
      photos.push(...fresh.slice(0, wanted));

      fresh.slice(0, wanted).forEach((f, idx) => {
        const i = startIndex + idx;
        renderCard(f, i);
      });

      page++;
      loading = false;
      $('loader').style.display = 'none';
      updateUI();

      if(autoSlide) startSlide();
      return photos.length > startIndex;
    }

    function toggleCard(i, state) {
      if(state) selSet.add(i); else selSet.delete(i);
      updateUI();
    }

    function toggleAll() {
      const all = selSet.size === photos.length && photos.length > 0;
      selSet.clear();
      if(!all) photos.forEach((_, i) => selSet.add(i));
      photos.forEach((_, i) => { const c = $(`chk-${i}`); if(c) c.checked = !all; });
      updateUI();
    }

    function updateUI() {
      $('bulk-btn').textContent = `İndir (${selSet.size})`;
      $('sel-all-btn').textContent = (photos.length > 0 && selSet.size === photos.length) ? 'Seçimi Kaldır' : 'Tümünü Seç';
    }

    async function dlSingle(url, name) {
      try {
        const res = await fetch(url); const blob = await res.blob();
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
      } catch { window.open(url, '_blank'); }
    }

    async function bulkDl() {
      if(!selSet.size) return alert('Önce fotoğraf seçin.');
      $('bulk-btn').textContent = 'İndiriliyor...'; $('bulk-btn').disabled = true;
      for(const i of selSet) { await dlSingle(photos[i].url, photos[i].id); await new Promise(r => setTimeout(r, 300)); }
      $('bulk-btn').disabled = false; updateUI();
    }

    function updatePlayBtn() {
      const btn = $('play-btn');
      if(!btn) return;
      btn.textContent = slideActive ? '⏸' : '▶';
      btn.title = slideActive ? 'Slaytı Durdur' : 'Slaytı Oynat';
    }

    function getCurrentVisibleImg() {
      return $('img1').classList.contains('active') ? $('img1') : $('img2');
    }

    function normalizeManualImg(img) {
      img.className = 'modal-img paused';
      img.style.animation = 'none';
      img.style.transition = 'none';
      img.style.objectFit = 'contain';
      img.style.transform = 'scale(1)';
      img.style.filter = 'blur(0) contrast(100%)';
    }

    function showImageInstant(index) {
      const currentImg = getCurrentVisibleImg();
      const nextImg = currentImg === $('img1') ? $('img2') : $('img1');

      nextImg.src = photos[index].url;
      normalizeManualImg(currentImg);
      normalizeManualImg(nextImg);

      currentImg.classList.remove('active');
      nextImg.classList.add('active');

      activeImgBox = nextImg.id === 'img1' ? 1 : 2;

      requestAnimationFrame(() => {
        currentImg.style.transition = '';
        nextImg.style.transition = '';
      });
    }

    function pauseToFullView() {
      slideActive = false;
      stopTimer();
      const currentImg = getCurrentVisibleImg();
      normalizeManualImg(currentImg);
      currentImg.classList.add('active');
      showUI();
      updatePlayBtn();
      requestAnimationFrame(() => {
        currentImg.style.transition = '';
      });
    }

    function openModal(i) {
      if(!photos.length) return;
      curr = i;
      slideActive = true;
      stopTimer();
      $('modal').style.display = 'flex';
      updatePlayBtn();
      updateModal(false);
      resetTimer();
      hideUI();
    }

    function closeModal() {
      stopTimer();
      slideActive = false;
      updatePlayBtn();
      if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      document.body.classList.remove('fs');
      $('modal').style.display = 'none';
      showUI();
      setTimeout(ensureViewportFilled, 0);
    }

    function toggleFs() {
      if(!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    function updateModal(manual = false) {
      const activeImg = activeImgBox === 1 ? $('img1') : $('img2');
      const nextImg = activeImgBox === 1 ? $('img2') : $('img1');

      nextImg.className = 'modal-img';
      nextImg.style.animation = 'none';
      nextImg.style.objectFit = manual ? 'contain' : 'cover';
      nextImg.style.transform = 'scale(1)';
      nextImg.style.transition = manual ? 'none' : '';
      activeImg.style.transition = manual ? 'none' : '';
      nextImg.src = photos[curr].url;

      if(manual || !slideActive) {
        nextImg.classList.add('paused');
        nextImg.style.objectFit = 'contain';
        nextImg.style.transform = 'scale(1)';
        nextImg.style.filter = 'blur(0) contrast(100%)';
      } else {
        const effects = [
          () => `0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-1%,-1%)}`,
          () => `0%{transform:scale(1.08) translate(0,0)}100%{transform:scale(1) translate(1%,1%)}`,
          () => `0%{transform:scale(1.04) translate(-2%,0)}100%{transform:scale(1.04) translate(2%,0)}`,
          () => `0%{transform:scale(1.04) translate(0,-2%)}100%{transform:scale(1.04) translate(0,2%)}`
        ];
        $('kb-style').textContent = `@keyframes rm{${effects[Math.floor(Math.random()*effects.length)]()}}`;
        nextImg.style.animationDuration = '10s';
        nextImg.style.objectFit = 'cover';
        void nextImg.offsetWidth;
        nextImg.classList.add('kb');
      }

      activeImg.classList.remove('active');
      nextImg.classList.add('active');
      activeImgBox = activeImgBox === 1 ? 2 : 1;

      if(manual) {
        requestAnimationFrame(() => {
          nextImg.style.transition = '';
          activeImg.style.transition = '';
        });
      }

      if(curr >= photos.length - 3) loadPhotos();
    }

    function changeImg(dir, e, manual = false) {
      if(e) e.stopPropagation();
      if(!photos.length) return;

      curr = (curr + dir + photos.length) % photos.length;

      if(manual) {
        slideActive = false;
        stopTimer();
        showUI();
        updatePlayBtn();
        showImageInstant(curr);
      } else {
        updateModal(false);
        resetTimer();
      }
    }

    function toggleSlide(e = null) {
      if(e) e.stopPropagation();

      slideActive = !slideActive;
      updatePlayBtn();

      if(slideActive) {
        updateModal(false);
        resetTimer();
        hideUI();
      } else {
        pauseToFullView();
      }
    }

    function startSlide() {
      if(!photos.length) return;
      document.documentElement.requestFullscreen?.().catch(()=>{});
      document.body.classList.add('fs');
      openModal(0);
      updatePlayBtn();
    }

    function stopTimer() { if(timer) clearInterval(timer); }
    function resetTimer() { stopTimer(); if(slideActive) timer = setInterval(() => changeImg(1, null, false), 10000); }

    function showUI() { 
      $('top-bar').classList.remove('ui-hide'); 
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('ui-hide')); 
      $('modal').style.cursor = 'default'; 
    }
    
    function hideUI() { 
      if(slideActive) { 
        $('top-bar').classList.add('ui-hide'); 
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.add('ui-hide')); 
        $('modal').style.cursor = 'none'; 
      } 
    }
    
    function resetHideTO() { showUI(); clearTimeout(hideTO); if(slideActive) hideTO = setTimeout(hideUI, 3000); }

    $('modal').onmousemove = resetHideTO;
    $('modal').ontouchstart = e => { tX = e.changedTouches[0].screenX; tT = Date.now(); resetHideTO(); };
    $('modal').ontouchend = e => {
      const dX = e.changedTouches[0].screenX - tX;
      if(Math.abs(dX) > 50) changeImg(dX < 0 ? 1 : -1, null, true);
      else if(Math.abs(dX) < 10 && Date.now() - tT < 300) pauseToFullView();
      resetHideTO();
    };
    $('modal').onclick = e => { if(e.target === $('modal') || e.target.classList.contains('modal-img')) pauseToFullView(); resetHideTO(); };

    window.onkeydown = e => {
      if($('modal').style.display === 'flex') {
        resetHideTO();

        if(e.key === 'ArrowRight') {
          e.preventDefault();
          changeImg(1, null, true);
        }

        if(e.key === 'ArrowLeft') {
          e.preventDefault();
          changeImg(-1, null, true);
        }

        if(e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleSlide();
        }

        if(e.key === 'Escape') closeModal();
      }
    };

    async function ensureViewportFilled() {
      if(fillBusy || loading || $('modal').style.display === 'flex') return;
      fillBusy = true;
      try {
        let guard = 0;
        while(document.body.scrollHeight <= window.innerHeight + 300 && guard < 10) {
          const added = await loadPhotos();
          if(!added) break;
          guard++;
          await new Promise(r => requestAnimationFrame(r));
        }
      } finally {
        fillBusy = false;
      }
    }

    const photoObserver = new IntersectionObserver(entries => {
      if(entries.some(e => e.isIntersecting) && $('modal').style.display !== 'flex') {
        loadPhotos().then(ensureViewportFilled);
      }
    }, { root: null, rootMargin: '700px 0px 700px 0px', threshold: 0.01 });

    photoObserver.observe($('scroll-sentinel'));

    window.addEventListener('resize', ensureViewportFilled);

    loadPhotos(true).then(ensureViewportFilled);
  </script>
</body>
</html>
