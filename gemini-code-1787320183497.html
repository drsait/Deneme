<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaktik Uzay Saati</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020208;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .wrapper {
            display: flex;
            align-items: center;
            gap: 2.5vmin;
            z-index: 2;
        }

        /* %100 Transparan Saat Çerçevesi */
        .clock {
            width: 75vmin;
            height: 75vmin;
            border: 1vmin solid rgba(56, 189, 248, 0.5);
            border-radius: 50%;
            position: relative;
            background: transparent; /* Arkaplan tamamen şeffaf */
        }

        .number {
            position: absolute;
            width: 100%; height: 100%;
            text-align: center;
            font-size: 4vmin;
            font-weight: 700;
            color: #f8fafc;
            padding-top: 2.5vmin;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        .hand { 
            position: absolute; 
            bottom: 50%; 
            left: 50%; 
            transform-origin: bottom center; 
            border-radius: 6px; 
            z-index: 5; 
        }
        .hour { width: 1.8vmin; height: 24%; margin-left: -0.9vmin; background: #ffffff; box-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .minute { width: 1.2vmin; height: 34%; margin-left: -0.6vmin; background: #cbd5e1; }
        .second { width: 0.6vmin; height: 40%; margin-left: -0.3vmin; background: #38bdf8; z-index: 6; box-shadow: 0 0 12px rgba(56, 189, 248, 1); }
        
        .center { 
            width: 3.5vmin; 
            height: 3.5vmin; 
            background: #38bdf8; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            border-radius: 50%; 
            z-index: 10; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 1);
        }

        /* %100 Transparan Yan Bilgi Paneli */
        .side-info {
            display: flex;
            flex-direction: column;
            gap: 1.5vmin;
        }

        .info-box {
            background: transparent; /* Arkaplan tamamen şeffaf */
            border: 2px solid rgba(56, 189, 248, 0.4);
            padding: 2vmin 2.5vmin;
            border-radius: 12px;
            text-align: center;
            min-width: 16vmin;
        }

        .info-title {
            font-size: 1.4vmin;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5vmin;
            font-weight: 600;
        }

        .info-value {
            font-size: 2.3vmin;
            font-weight: 700;
            color: #f8fafc;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <div class="wrapper">
        <div class="clock" id="clock">
            <div class="hand hour" id="hour"></div>
            <div class="hand minute" id="minute"></div>
            <div class="hand second" id="second"></div>
            <div class="center"></div>
        </div>

        <div class="side-info">
            <div class="info-box">
                <div class="info-title">Gün</div>
                <div class="info-value" id="day-name">---</div>
            </div>
            <div class="info-box">
                <div class="info-title">Tarih</div>
                <div class="info-value" id="date-text">--/--/----</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Yıldızlar
        const starsCount = 400;
        const stars = [];
        for (let i = 0; i < starsCount; i++) {
            stars.push({
                x: (Math.random() - 0.5) * width * 2,
                y: (Math.random() - 0.5) * height * 2,
                z: Math.random() * width,
                size: Math.random() * 1.5 + 0.4,
                color: Math.random() > 0.3 ? '#ffffff' : (Math.random() > 0.5 ? '#38bdf8' : '#c084fc')
            });
        }

        // Klasik Spiral Galaksi Taslağı (Arka Planda Yavaşça Dönen)
        let galaxyAngle = 0;

        // Kayan Yıldızlar (~10 saniyede bir)
        const shootingStars = [];
        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * width,
                y: Math.random() * (height / 2),
                length: Math.random() * 100 + 50,
                speed: Math.random() * 12 + 8,
                angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1),
                opacity: 1
            });
        }
        function scheduleShootingStar() {
            const randomTime = Math.random() * 4000 + 8000; 
            setTimeout(() => {
                createShootingStar();
                scheduleShootingStar();
            }, randomTime);
        }
        scheduleShootingStar();

        // Gezegen Geçişleri (30 saniyede bir halkalı Satürn benzeri gezegen)
        let activePlanet = null;
        function triggerPlanet() {
            activePlanet = {
                x: -150,
                y: Math.random() * (height * 0.6) + (height * 0.2),
                radius: Math.random() * 30 + 35,
                speed: 1.2,
                color: Math.random() > 0.5 ? '#f43f5e' : '#fbbf24'
            };
            setTimeout(triggerPlanet, 30000); // 30 saniye
        }
        setTimeout(triggerPlanet, 5000); // İlk açılıştan 5 saniye sonra başlasın

        function animateSpace() {
            ctx.fillStyle = '#020208';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // 1. Klasik Spiral Galaksi Çizimi
            ctx.save();
            ctx.translate(centerX * 0.5, centerY * 0.5);
            ctx.rotate(galaxyAngle);
            galaxyAngle += 0.0005; // Yavaş dönme hızı
            
            let gGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 180);
            gGrad.addColorStop(0, 'rgba(192, 132, 252, 0.4)');
            gGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.15)');
            gGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 180, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2. Gezegen Geçişi (Satürn Tarzı Halkalı)
            if (activePlanet) {
                activePlanet.x += activePlanet.speed;

                ctx.save();
                ctx.translate(activePlanet.x, activePlanet.y);

                // Gezegen Gövdesi
                let pGrad = ctx.createRadialGradient(-10, -10, 5, 0, 0, activePlanet.radius);
                pGrad.addColorStop(0, '#ffffff');
                pGrad.addColorStop(0.3, activePlanet.color);
                pGrad.addColorStop(1, '#020208');
                ctx.fillStyle = pGrad;
                ctx.beginPath();
                ctx.arc(0, 0, activePlanet.radius, 0, Math.PI * 2);
                ctx.fill();

                // Gezegen Halkaları (Satürn Halkası)
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.6)';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.ellipse(0, 0, activePlanet.radius * 2.2, activePlanet.radius * 0.6, Math.PI / 6, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();

                if (activePlanet.x > width + 200) {
                    activePlanet = null;
                }
            }

            // 3. Normal Yıldızlar
            for (let s of stars) {
                s.z -= 1.2;
                if (s.z <= 0) {
                    s.z = width;
                    s.x = (Math.random() - 0.5) * width * 2;
                    s.y = (Math.random() - 0.5) * height * 2;
                }

                let k = 250 / s.z;
                let px = s.x * k + centerX;
                let py = s.y * k + centerY;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    let pSize = Math.max(0, (1 - s.z / width) * s.size * 2);
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.arc(px, py, pSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 4. Kayan Yıldızlar
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let ss = shootingStars[i];
                ctx.strokeStyle = `rgba(255, 255, 255, ${ss.opacity})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - Math.cos(ss.angle) * ss.length, ss.y - Math.sin(ss.angle) * ss.length);
                ctx.stroke();

                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.opacity -= 0.015;

                if (ss.opacity <= 0 || ss.x > width || ss.y > height) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        // Saat Kurulumu
        const clock = document.getElementById('clock');
        const romanNumbers = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
        
        romanNumbers.forEach((num, i) => {
            const div = document.createElement('div');
            div.className = 'number';
            div.style.transform = `rotate(${i * 30}deg)`;
            div.innerHTML = `<span style="display:inline-block; transform:rotate(-${i * 30}deg)">${num}</span>`;
            clock.appendChild(div);
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('hour').style.transform = `rotate(${(now.getHours() % 12 + now.getMinutes() / 60) * 30}deg)`;
            document.getElementById('minute').style.transform = `rotate(${(now.getMinutes() + now.getSeconds() / 60) * 6}deg)`;
            document.getElementById('second').style.transform = `rotate(${now.getSeconds() * 6}deg)`;
            
            document.getElementById('day-name').textContent = now.toLocaleDateString('tr-TR', {weekday: 'long'});
            document.getElementById('date-text').textContent = now.toLocaleDateString('tr-TR', {day:'2-digit', month:'2-digit', year:'numeric'});
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
