<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tek Tıkla Web İndirici</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; color: #f8fafc; padding: 18px; min-height: 100vh; display: flex; justify-content: center; }
    .kapsayici { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 14px; }
    .kart { background: #131c2e; border: 1px solid #24324d; border-radius: 14px; padding: 20px; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 0.82rem; color: #94a3b8; margin-bottom: 16px; }
    label { font-size: 0.75rem; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 6px; }
    input { width: 100%; background: #0b111e; border: 1px solid #24324d; border-radius: 8px; padding: 12px; color: #fff; font-size: 0.9rem; outline: none; margin-bottom: 16px; }
    input:focus { border-color: #2563eb; }
    .buton { width: 100%; background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    .buton:hover { background: #1d4ed8; }
    .buton:disabled { opacity: 0.5; cursor: not-allowed; }
    .log-penceresi { background: #060910; border: 1px solid #24324d; border-radius: 8px; padding: 12px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: #38bdf8; margin-top: 10px; }
    .log-satir { margin-bottom: 3px; word-break: break-all; }
    .tamam { color: #10b981; }
  </style>
</head>
<body>
<div class="kapsayici">
  <div class="kart">
    <h1>Tek Tıkla Web İndirici</h1>
    <p>Linki girip butona basın, tüm sayfayı ve görselleri telefonunuza ZIP olarak indirsin.</p>

    <label for="urlGiris">Web Sitesi Adresi (URL)</label>
    <input id="urlGiris" type="url" value="https://webmenu.pardonapp.co/niyokki-mardin-antikkent" placeholder="https://..." />

    <button id="indirBtn" class="buton" onclick="tekTiklaIndir()">📥 Telefona İndir</button>

    <div id="logKutusu" class="log-penceresi"></div>
  </div>
</div>

<script>
  function log(mesaj, tip = "") {
    const k = document.getElementById("logKutusu");
    const d = document.createElement("div");
    d.className = `log-satir ${tip}`;
    d.textContent = `[${new Date().toLocaleTimeString("tr-TR")}] ${mesaj}`;
    k.appendChild(d);
    k.scrollTop = k.scrollHeight;
  }

  // Gelişmiş Çoklu Tünel Motoru (JSON-P + Raw Proxies)
  async function gelismisVeriCek(hedefUrl, tip = "text") {
    // 1. JSON-P tüneli (Bot filtrelerini tamamen bypass eder)
    try {
      const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(hedefUrl)}`);
      if (res.ok) {
        const json = await res.json();
        if (json.contents) {
          if (tip === "text") return json.contents;
        }
      }
    } catch(e) {}

    // 2. Yedek Tüneller
    const tuneller = [
      (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
      (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
      (u) => `https://thingproxy.freeboard.io/fetch/${u}`,
      (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
    ];

    for (const t of tuneller) {
      try {
        const r = await fetch(t(hedefUrl));
        if (r.ok) return tip === "arraybuffer" ? await r.arrayBuffer() : await r.text();
      } catch (e) {}
    }
    throw new Error("Bağlantı sağlanamadı");
  }

  async function tekTiklaIndir() {
    const url = document.getElementById("urlGiris").value.trim();
    const btn = document.getElementById("indirBtn");

    if (!url) { alert("Lütfen bir adres girin."); return; }

    btn.disabled = true;
    document.getElementById("logKutusu").innerHTML = "";

    log(`Bağlanıyor: ${url}`);
    log("İçerik çekiliyor...");

    try {
      const hamHtml = await gelismisVeriCek(url, "text");
      log("Sayfa başarıyla alındı.", "tamam");

      const zip = new JSZip();
      const siteAdi = new URL(url).hostname.replace(/[^a-zA-Z0-9]/g, "_");
      const klasor = zip.folder(siteAdi);

      const doc = new DOMParser().parseFromString(hamHtml, "text/html");

      // Görselleri ve simgeleri indir
      const images = Array.from(doc.querySelectorAll("img[src], link[rel*='icon']"));
      log(`${images.length} adet görsel/ikon yerelleştiriliyor...`);

      for (let i = 0; i < images.length; i++) {
        const el = images[i];
        const attr = el.hasAttribute("src") ? "src" : "href";
        const src = el.getAttribute(attr);

        if (src && !src.startsWith("data:")) {
          try {
            const tamUrl = new URL(src, url).href;
            const dosyaAdi = `gorsel_${i + 1}.png`;
            try {
              const bin = await gelismisVeriCek(tamUrl, "arraybuffer");
              klasor.file(`assets/images/${dosyaAdi}`, bin);
              el.setAttribute(attr, `./assets/images/${dosyaAdi}`);
            } catch (err) {
              el.setAttribute(attr, tamUrl);
            }
          } catch (e) {}
        }
      }

      klasor.file("index.html", "<!DOCTYPE html>\n" + doc.documentElement.outerHTML);
      log("Klasör yapısı paketleniyor...");

      const blob = await zip.generateAsync({ type: "blob" });
      saveAs(blob, `${siteAdi}_yedek.zip`);

      log("İndirme tamamlandı! Dosya İndirilenler klasörünüzde.", "tamam");
    } catch (hata) {
      log(`Hata: ${hata.message}`, "");
    }

    btn.disabled = false;
  }
</script>
</body>
</html>
