<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy Tarayıcı</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      background: var(--card);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    input {
      flex: 1;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); }
    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    .status-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="targetUrl" placeholder="https://example.com" onkeydown="if(event.key==='Enter') navigate()">
    <button onclick="navigate()" id="btnGo">Git</button>
  </div>

  <div class="viewport">
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <div id="statusBar" class="status-badge">Yükleniyor...</div>
  </div>

  <script>
    const PROXY_URL = 'https://polished-snow-38e2.yenibirhesap047.workers.dev';

    async function navigate() {
      let url = document.getElementById('targetUrl').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
        document.getElementById('targetUrl').value = url;
      }

      const btn = document.getElementById('btnGo');
      const status = document.getElementById('statusBar');
      const frame = document.getElementById('proxyFrame');

      btn.disabled = true;
      status.style.display = 'block';
      status.textContent = 'Sayfa getiriliyor...';

      try {
        const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let html = await res.text();

        const parsedUrl = new URL(url);
        const baseTag = `<base href="${parsedUrl.origin}/">`;

        if (html.includes('<head>')) {
          html = html.replace('<head>', `<head>\n  ${baseTag}`);
        } else if (html.includes('<head ')) {
          html = html.replace(/<head[^>]*>/, `$& \n  ${baseTag}`);
        } else {
          html = baseTag + html;
        }

        frame.srcdoc = html;
        status.style.display = 'none';
      } catch (err) {
        status.textContent = 'Hata: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
