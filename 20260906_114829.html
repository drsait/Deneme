<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Piyasa</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2 {
      margin: 0 0 16px;
      font-size: 18px;
      text-align: center;
      color: #f1c40f;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
      font-size: 15px;
    }
    .row:last-child { border-bottom: none; }
    .val {
      font-weight: 700;
      color: #4ade80;
    }
    .status {
      margin-top: 14px;
      font-size: 11px;
      text-align: center;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Canlı Piyasa (TL)</h2>
  <div class="row"><span>Dolar (USD)</span><span class="val" id="usd">Yükleniyor...</span></div>
  <div class="row"><span>Euro (EUR)</span><span class="val" id="eur">Yükleniyor...</span></div>
  <div class="row"><span>24 Ayar Gram</span><span class="val" id="g24">Yükleniyor...</span></div>
  <div class="row"><span>22 Ayar Bilezik</span><span class="val" id="g22">Yükleniyor...</span></div>
  <div class="status" id="time">Güncelleniyor...</div>
</div>

<script>
  async function loadData() {
    try {
      // CORS koruması bulunmayan açık döviz API'si
      const curRes = await fetch("https://open.er-api.com/v6/latest/USD");
      const curData = await curRes.json();
      const usdTry = curData.rates.TRY;
      const eurTry = usdTry / curData.rates.EUR;

      // Stooq üzerinden anlık spot ons altın verisi
      const goldRes = await fetch("https://stooq.com/q/l/?s=xauusd&f=sd2t2c&e=json");
      const goldData = await goldRes.json();
      const onsUsd = goldData.symbols[0].close;

      const gram24 = (onsUsd * usdTry) / 31.1034768;
      const gram22 = gram24 * 0.916;

      const fmt = (n) => n.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";

      document.getElementById("usd").innerText = fmt(usdTry);
      document.getElementById("eur").innerText = fmt(eurTry);
      document.getElementById("g24").innerText = fmt(gram24);
      document.getElementById("g22").innerText = fmt(gram22);
      document.getElementById("time").innerText = "Son Güncelleme: " + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById("time").innerText = "Bağlantı hatası, tekrar deneniyor...";
    }
  }

  loadData();
  setInterval(loadData, 15000);
</script>

</body>
</html>
