<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Web Arşiv</title>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--brd:#334155;--acc:#6366f1;--txt:#f8fafc;--mut:#94a3b8;--ok:#10b981;--err:#ef4444}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .bar{position:fixed;top:0;left:0;width:100%;background:var(--card);padding:8px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--brd);z-index:1000;transition:transform .3s}
    .bar.hide{transform:translateY(-100%)}
    .row{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between}
    .in-wrap{position:relative;flex:1;display:flex;align-items:center}
    input,textarea{background:#0b1120;border:1px solid var(--brd);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;width:100%}
    input:focus,textarea:focus{border-color:var(--acc)}
    .in-wrap input{padding-right:32px}
    .btn-x{position:absolute;right:8px;background:none;border:none;color:var(--mut);font-size:14px;cursor:pointer;display:none}
    .lbl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);cursor:pointer;user-select:none;white-space:nowrap}
    .lbl input{width:15px;height:15px;accent-color:var(--acc);cursor:pointer}
    button{border:none;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:var(--brd);transition:.2s;white-space:nowrap}
    button:active{transform:scale(.97)}
    .btn-acc{background:var(--acc)}
    .btn-ok{background:var(--ok)}
    .v-port{flex:1;width:100%;height:100%;position:relative}
    iframe{width:100%;height:100%;border:none;background:#fff}
    .trig{position:fixed;top:0;left:0;width:100%;height:15px;z-index:999}
    .badge{position:absolute;bottom:16px;right:16px;background:rgba(15,23,42,.95);border:1px solid var(--brd);padding:6px 12px;border-radius:8px;font-size:12px;display:none;z-index:10}
    #arModal{display:none;position:fixed;inset:0;background:var(--bg);z-index:2000;flex-direction:column;height:100vh;width:100vw}
    .m-hdr{background:var(--card);border-bottom:1px solid var(--brd);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
    .m-body{flex:1;padding:10px;display:flex;min-height:0}
    textarea{height:100%;font-family:monospace;font-size:12px;resize:none}
    .m-ftr{background:var(--card);border-top:1px solid var(--brd);padding:10px;display:flex;flex-direction:column;gap:8px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    #pvModal{display:none;position:fixed;inset:0;z-index:99999;background:#fff}
    #pvClose{position:fixed;top:16px;right:16px;width:38px;height:38px;border-radius:50%;background:var(--err);color:#fff;font-weight:700;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer;z-index:100000}
    @media(max-width:500px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="trig" onmouseenter="$('bar').classList.remove('hide')"></div>

  <div class="bar" id="bar">
    <div class="row">
      <div class="in-wrap">
        <input type="text" id="url" placeholder="https://example.com" oninput="toggleX()" onkeydown="if(event.key==='Enter')nav()">
        <button class="btn-x" id="bx" onclick="clr()">✕</button>
      </div>
    </div>
    <div class="row">
      <label class="lbl"><input type="checkbox" id="tamProxy">Tam Proxy</label>
      <div style="display:flex;gap:6px">
        <button class="btn-acc" onclick="nav()" id="bGo">Git</button>
        <button class="btn-ok" onclick="openAr()">📦 Web Arşiv</button>
      </div>
    </div>
  </div>

  <div class="v-port">
    <iframe id="frm" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div id="st" class="badge"></div>
  </div>

  <div id="arModal">
    <div class="m-hdr">
      <div class="row">
        <button onclick="closeAr()">⬅ Geri</button>
        <b style="font-size:14px">Web Arşiv</b>
        <button onclick="closeAr()">✕</button>
      </div>
      <div class="row">
        <label class="lbl"><input type="checkbox" id="göm" checked>Dosya Göm (Base64)</label>
        <button class="btn-acc" onclick="buildAr()">Paketle</button>
      </div>
    </div>
    <div class="m-body">
      <textarea id="ed" placeholder="Kaynak kodlar..."></textarea>
    </div>
    <div class="m-ftr">
      <div class="grid-4">
        <button onclick="cp()" id="bCp">Kopyala</button>
        <button onclick="dl()">İndir</button>
        <button onclick="run()">Çalıştır</button>
        <button class="btn-ok" onclick="pushGH()">GitHub'a Yükle</button>
      </div>
      <div class="grid-2">
        <input type="text" id="fn" placeholder="Dosya adı">
        <input type="password" id="ghTok" placeholder="GitHub Token">
      </div>
    </div>
  </div>

  <div id="pvModal">
    <button id="pvClose" onclick="$('pvModal').style.display='none'">✕</button>
    <iframe id="pv"></iframe>
  </div>

  <script>
    const $ = id => document.getElementById(id),
          PROXY = 'https://polished-snow-38e2.yenibirhesap047.workers.dev',
          REPO = 'drsait/Deneme';
    let curHtml = '', curUrl = '';

    const toggleX = () => $('bx').style.display = $('url').value.trim() ? 'block' : 'none';
    const clr = () => { $('url').value = ''; toggleX(); $('url').focus(); };

    function setFn() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      $('fn').value = `web_arsiv_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.html`;
    }
    setFn();

    const toProxy = (u, b) => (!u || u.startsWith('data:') || u.startsWith('javascript:')) ? u : `${PROXY}?url=${encodeURIComponent(new URL(u, b).href)}`;

    async function req(u, b64 = false) {
      try {
        const r = await fetch(`${PROXY}?url=${encodeURIComponent(u)}`);
        if (!r.ok) return null;
        if (!b64) return await r.text();
        const bl = await r.blob();
        return new Promise(res => { const f = new FileReader(); f.onloadend = () => res(f.result); f.readAsDataURL(bl); });
      } catch { return null; }
    }

    async function nav(ovr = null) {
      let u = ovr || $('url').value.trim();
      if (!u) return;
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      $('url').value = u; curUrl = u; toggleX();

      $('bGo').disabled = true;
      $('st').style.display = 'block'; $('st').textContent = 'Yükleniyor...';

      try {
        const res = await fetch(`${PROXY}?url=${encodeURIComponent(u)}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        curHtml = await res.text();

        const doc = new DOMParser().parseFromString(curHtml, 'text/html'),
              base = new URL(u);

        let b = doc.querySelector('base') || doc.createElement('base');
        b.href = base.origin + '/';
        if (!doc.querySelector('base')) doc.head.prepend(b);

        if ($('tamProxy').checked) {
          $('st').textContent = 'Stiller aktarılıyor...';
          for (const l of Array.from(doc.querySelectorAll('link[rel="stylesheet"]'))) {
            const h = l.getAttribute('href');
            if (h) {
              const css = await req(new URL(h, base).href);
              if (css) { const s = doc.createElement('style'); s.textContent = css; l.replaceWith(s); }
            }
          }
          doc.querySelectorAll('img,source,video,audio').forEach(e => {
            const s = e.getAttribute('src');
            if (s) e.setAttribute('src', toProxy(s, base));
            e.removeAttribute('srcset');
          });
        }

        const sc = doc.createElement('script');
        sc.textContent = `let ly=window.scrollY;window.addEventListener('scroll',()=>{let y=window.scrollY;if(y>ly&&y>50)window.parent.postMessage({t:'SD'},'*');else if(y<ly)window.parent.postMessage({t:'SU'},'*');ly=y},{passive:true});document.addEventListener('click',e=>{let a=e.target.closest('a');if(a&&a.href&&!a.href.startsWith('javascript:')&&!a.getAttribute('href')?.startsWith('#')){e.preventDefault();try{window.parent.postMessage({t:'NV',u:new URL(a.getAttribute('href'),"${base.origin}").href},'*')}catch{}}},true);`;
        doc.head.appendChild(sc);

        $('frm').srcdoc = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        $('st').style.display = 'none';
      } catch (err) { $('st').textContent = 'Hata: ' + err.message; }
      finally { $('bGo').disabled = false; }
    }

    async function buildAr() {
      let u = $('url').value.trim();
      if (!u) return alert('Adres girin.');
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      $('url').value = u;

      $('ed').value = 'Hazırlanıyor...';
      let raw = (curHtml && curUrl === u) ? curHtml : await req(u);
      if (!raw) return $('ed').value = 'Hata: İçerik alınamadı.';

      const doc = new DOMParser().parseFromString(raw, 'text/html'),
            base = new URL(u);

      if ($('göm').checked) {
        $('ed').value = 'Dosyalar gömülüyor...';
        for (const l of Array.from(doc.querySelectorAll('link[rel="stylesheet"]'))) {
          const h = l.getAttribute('href');
          if (h) {
            const c = await req(new URL(h, base).href);
            if (c) { const s = doc.createElement('style'); s.textContent = c; l.replaceWith(s); }
          }
        }
        for (const m of Array.from(doc.querySelectorAll('img'))) {
          const s = m.getAttribute('src');
          if (s && !s.startsWith('data:')) {
            const b = await req(new URL(s, base).href, true);
            if (b) { m.setAttribute('src', b); m.removeAttribute('srcset'); m.removeAttribute('loading'); }
          }
        }
        doc.querySelectorAll('base').forEach(e => e.remove());
      } else {
        let b = doc.querySelector('base') || doc.createElement('base');
        b.href = base.origin + '/';
        if (!doc.querySelector('base')) doc.head.prepend(b);
      }
      $('ed').value = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    }

    const openAr = () => { if (!$('url').value.trim()) return alert('URL girin.'); $('arModal').style.display = 'flex'; setFn(); buildAr(); };
    const closeAr = () => $('arModal').style.display = 'none';
    const cp = () => { if (!$('ed').value) return; navigator.clipboard.writeText($('ed').value).then(() => { $('bCp').textContent = 'Kopyalandı!'; setTimeout(() => $('bCp').textContent = 'Kopyala', 1200); }); };
    const run = () => { $('pv').srcdoc = $('ed').value; $('pvModal').style.display = 'block'; };
    const dl = () => { if (!$('ed').value) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('ed').value], { type: 'text/html' })); a.download = $('fn').value.trim() || 'arsiv.html'; a.click(); };

    async function pushGH() {
      const t = $('ghTok').value.trim(), p = $('fn').value.trim() || 'arsiv.html', c = $('ed').value;
      if (!t || !c) return alert('Token veya kod eksik.');
      try {
        const u = `https://api.github.com/repos/${REPO}/contents/${p}`;
        let sha = (await fetch(u, { headers: { Authorization: `token ${t}` } }).then(r => r.ok ? r.json() : {}))?.sha;
        const res = await fetch(u, {
          method: 'PUT',
          headers: { Authorization: `token ${t}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Arşiv: ' + p, content: btoa(unescape(encodeURIComponent(c))), sha })
        });
        alert(res.ok ? 'GitHub\'a yüklendi!' : 'Hata oluştu.');
      } catch (e) { alert('İşlem hatası: ' + e.message); }
    }

    window.addEventListener('message', e => {
      if (!e.data) return;
      if (e.data.t === 'SD') $('bar').classList.add('hide');
      else if (e.data.t === 'SU') $('bar').classList.remove('hide');
      else if (e.data.t === 'NV') {
        let u = e.data.u;
        if (u.includes('?url=')) u = new URL(u).searchParams.get('url') || u;
        nav(u);
      }
    });
  </script>
</body>
</html>
