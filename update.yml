name: Canli Piyasa Guncelle

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Veri Cek ve HTML Uret
        run: |
          USD=$(curl -s "https://open.er-api.com/v6/latest/USD" | jq '.rates.TRY')
          EUR_ORAN=$(curl -s "https://open.er-api.com/v6/latest/USD" | jq '.rates.EUR')
          EUR=$(echo "$USD / $EUR_ORAN" | bc -l)
          ONS=$(curl -s "https://stooq.com/q/l/?s=xauusd&f=sd2t2c&e=json" | jq '.symbols[0].close')
          G24=$(echo "($ONS * $USD) / 31.1034768" | bc -l)
          G22=$(echo "$G24 * 0.916" | bc -l)
          TARIH=$(TZ="Europe/Istanbul" date '+%H:%M:%S')

          F_USD=$(printf "%.2f" $USD)
          F_EUR=$(printf "%.2f" $EUR)
          F_G24=$(printf "%.2f" $G24)
          F_G22=$(printf "%.2f" $G22)

          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="60">
            <title>Canlı Piyasa</title>
            <style>
              body { margin: 0; background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
              .card { background: #1e293b; width: 320px; padding: 20px; border-radius: 12px; }
              .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; }
              .val { font-weight: bold; color: #4ade80; }
              .status { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 12px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="row"><span>Dolar</span><span class="val">${F_USD} ₺</span></div>
              <div class="row"><span>Euro</span><span class="val">${F_EUR} ₺</span></div>
              <div class="row"><span>24A Gram</span><span class="val">${F_G24} ₺</span></div>
              <div class="row"><span>22A Bilezik</span><span class="val">${F_G22} ₺</span></div>
              <div class="status">Son Güncelleme: ${TARIH}</div>
            </div>
          </body>
          </html>
          EOF

      - name: Depoya Yukle
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "piyasa guncellendi" && git push)
