<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASM Harcama Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-6 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Başlık & Ay Seçimi -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Aile Sağlığı Merkezi Harcama Takibi</h1>
        <p class="text-xs font-medium text-emerald-600 mt-1" id="dbStatus">● Firebase Bulut Bağlantısı Aktif</p>
      </div>
      <div class="flex items-center gap-2">
        <label class="text-sm font-medium text-slate-600">Dönem:</label>
        <input type="month" id="filterMonth" class="border rounded-lg px-3 py-1.5 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>

    <!-- Gider Formu -->
    <form id="expenseForm" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Tarih</label>
        <input type="date" id="date" required class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
        <select id="category" class="w-full border rounded-lg px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
          <option>Tıbbi Sarf</option>
          <option>Temizlik & Hijyen</option>
          <option>Kırtasiye & Büro</option>
          <option>Fatura & Aidat</option>
          <option>Bakım & Onarım</option>
          <option>Diğer</option>
        </select>
      </div>
      <div class="lg:col-span-1">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Açıklama</label>
        <input type="text" id="desc" placeholder="Örn: Enjektör Alımı" required class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Tutar (₺)</label>
        <input type="number" step="0.01" id="amount" placeholder="0.00" required class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition">
        + Gider Ekle
      </button>
    </form>

    <!-- Özet Kartları -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-blue-50 border border-blue-100 p-5 rounded-2xl">
        <span class="text-xs font-semibold text-blue-600 uppercase tracking-wide">Seçili Ay Toplamı</span>
        <div id="monthlyTotal" class="text-2xl font-bold text-blue-900 mt-1">₺0,00</div>
      </div>
      <div class="bg-emerald-50 border border-emerald-100 p-5 rounded-2xl">
        <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wide">Toplam Kayıt Sayısı</span>
        <div id="recordCount" class="text-2xl font-bold text-emerald-900 mt-1">0 Adet</div>
      </div>
    </div>

    <!-- Tablo -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-4 border-b">
        <h2 class="font-semibold text-slate-800 text-sm">Gider Dökümü</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-600 text-xs border-b">
            <tr>
              <th class="p-3">Tarih</th>
              <th class="p-3">Kategori</th>
              <th class="p-3">Açıklama</th>
              <th class="p-3 text-right">Tutar</th>
              <th class="p-3 text-center">İşlem</th>
            </tr>
          </thead>
          <tbody id="expenseList" class="divide-y divide-slate-100 text-slate-700">
            <tr><td colspan="5" class="p-6 text-center text-slate-400">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Firebase SDK & Uygulama Mantığı -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Sizin Firebase Yapılandırmanız
    const firebaseConfig = {
      apiKey: "AIzaSyAvc24E8o1x9hp8e67ysf8LGt4CydEUPE8",
      authDomain: "denemeler-9bf27.firebaseapp.com",
      databaseURL: "https://denemeler-9bf27-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "denemeler-9bf27",
      storageBucket: "denemeler-9bf27.firebasestorage.app",
      messagingSenderId: "537863748257",
      appId: "1:537863748257:web:6ad290a2fdee97b24a4ee0",
      measurementId: "G-F9GWRVZ8D3"
    };

    // Firebase Başlatma
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const expensesRef = ref(db, 'asm_giderler');

    let allExpenses = [];

    const dateInput = document.getElementById('date');
    const filterMonth = document.getElementById('filterMonth');
    const form = document.getElementById('expenseForm');
    const list = document.getElementById('expenseList');
    const monthlyTotalEl = document.getElementById('monthlyTotal');
    const recordCountEl = document.getElementById('recordCount');

    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
    filterMonth.value = today.slice(0, 7);

    // Canlı Senkronizasyon (Veritabanı değiştikçe otomatik tetiklenir)
    onValue(expensesRef, (snapshot) => {
      const data = snapshot.val();
      allExpenses = [];
      if (data) {
        Object.keys(data).forEach((key) => {
          allExpenses.push({ id: key, ...data[key] });
        });
        allExpenses.sort((a, b) => new Date(b.date) - new Date(a.date));
      }
      render();
    });

    // Kayıt Ekleme
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const expense = {
        date: dateInput.value,
        category: document.getElementById('category').value,
        desc: document.getElementById('desc').value,
        amount: parseFloat(document.getElementById('amount').value)
      };

      await push(expensesRef, expense);
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
    });

    // Kayıt Silme
    window.deleteExpense = async (id) => {
      if (confirm('Bu harcamayı silmek istediğinize emin misiniz?')) {
        await remove(ref(db, `asm_giderler/${id}`));
      }
    };

    function render() {
      const selectedMonth = filterMonth.value;
      const filtered = allExpenses.filter(item => item.date.startsWith(selectedMonth));
      
      list.innerHTML = '';
      let total = 0;

      if (filtered.length === 0) {
        list.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Bu ay için henüz harcama kaydı bulunmuyor.</td></tr>`;
      } else {
        filtered.forEach(item => {
          total += item.amount;
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';
          tr.innerHTML = `
            <td class="p-3 font-mono text-xs">${item.date}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700">${item.category}</span></td>
            <td class="p-3 font-medium">${item.desc}</td>
            <td class="p-3 text-right font-semibold">₺${item.amount.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}</td>
            <td class="p-3 text-center">
              <button onclick="deleteExpense('${item.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-semibold px-2 py-1 rounded">Sil</button>
            </td>
          `;
          list.appendChild(tr);
        });
      }

      monthlyTotalEl.textContent = `₺${total.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}`;
      recordCountEl.textContent = `${filtered.length} Adet`;
    }

    filterMonth.addEventListener('change', render);
  </script>
</body>
</html>
