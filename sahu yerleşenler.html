const $=id=>document.getElementById(id),norm=v=>String(v??'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[̀-ͯ]/g,''),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function multi(id,col,label){const el=$(id),menu=el.querySelector('.menu'),vals=[...new Set(rows.map(r=>String(r[col]??'')))].sort((a,b)=>a.localeCompare(b,'tr',{numeric:true}));menu.innerHTML=vals.map(v=>`<label><input type="checkbox" value="${esc(v)}">${esc(v)}</label>`).join('');menu.onchange=()=>{const n=menu.querySelectorAll(':checked').length;el.querySelector('summary').textContent=n?`${label}: ${n} seçim`:`${label}: Tümü`;render()}}multi('period',0,'Dönem');multi('institution',1,'Kurum');
function selected(id){return new Set([...$(id).querySelectorAll(':checked')].map(x=>x.value))}function filtered(){const q=norm($('q').value),p=selected('period'),k=selected('institution');return rows.filter(r=>(!q||r.some(v=>norm(v).includes(q)))&&(!p.size||p.has(String(r[0])))&&(!k.size||k.has(String(r[1])))).sort((a,b)=>{const x=a[sort-1],y=b[sort-1];return ((typeof x==='number'&&typeof y==='number')?x-y:String(x??'').localeCompare(String(y??''),'tr',{numeric:true,sensitivity:'base'}))*dir})}
function render(){const a=filtered();$('count').textContent=a.length.toLocaleString('tr-TR');[...$('head').children].forEach((th,i)=>{const x=th.querySelector('.a');if(x)x.textContent=i===sort?(dir===1?'▲':'▼'):'↕'});$('body').innerHTML=a.length?a.map((r,n)=>`<tr><td class="num">${n+1}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="name">${esc(r[2])}</td><td class="num">${Number(r[3]).toLocaleString('tr-TR',{minimumFractionDigits:5,maximumFractionDigits:5})}</td><td class="source">${esc(r[4])}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Filtrelere uyan kayıt bulunamadı.</td></tr>'}
$('q').oninput=render;$('reset').onclick=()=>{$('q').value='';document.querySelectorAll('.multi input').forEach(x=>x.checked=false);$('period').querySelector('summary').textContent='Dönem: Tümü';$('institution').querySelector('summary').textContent='Kurum: Tümü';sort=1;dir=1;render()};document.addEventListener('click',e=>document.querySelectorAll('details.multi[open]').forEach(d=>{if(!d.contains(e.target))d.removeAttribute('open')}));render();
