
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamik Yaş Hesaplayıcı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px;
            width: 300px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Dinamik Yaş Hesaplayıcı</h1>
    <div class="container">
        <!-- Hesaplama 1 -->
        <div class="card">
            <h3>Sait</h3>
            <p>Doğum Tarihi: <strong>13.01.1986</strong></p>
            <p id="result1"></p>
        </div>
        <!-- Hesaplama 2 -->
        <div class="card">
            <h3>Hatice</h3>
            <p>Doğum Tarihi: <strong>18.03.1997</strong></p>
            <p id="result2"></p>
        </div>
        <!-- Hesaplama 3 -->
        <div class="card">
            <h3>Zeynep</h3>
            <p>Doğum Tarihi: <strong>15.08.2016</strong></p>
            <p id="result3"></p>
        </div>
        <!-- Hesaplama 4 -->
        <div class="card">
            <h3>Rengin</h3>
            <p>Doğum Tarihi: <strong>19.05.2021</strong></p>
            <p id="result4"></p>
        </div>
       

        <!-- Hesaplama 5 -->
        <div class="card">
            <h3>Evlilik</h3>
            <p>Tarih: <strong>24.05.2015</strong></p>
            <p id="result5"></p>
        </div>

        <!-- Hesaplama 6 -->
        <div class="card">
            <h3>Gerçek</h3>
            <p>Tarih: <strong>08.08.1985</strong></p>
            <p id="result6"></p>
        </div>

    <script>
        function calculateAge(year, month, day) {
            const birthDate = new Date(year, month, day);
            const now = new Date();

            let diff = now - birthDate;
            const seconds = Math.floor(diff / 1000) % 60;
            const minutes = Math.floor(diff / (1000 * 60)) % 60;
            const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24)) % 30.44;
            const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30.44)) % 12;
            const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));

            return `
                Tam Yaş: <br> ${years} yıl, ${months} ay, ${Math.floor(days)} gün <br> 
                 ${hours} saat, ${minutes} dakika, ${seconds} saniye
            `;
        }

        function updateResults() {
            document.getElementById('result1').innerHTML = calculateAge(1986, 1, 13);
            document.getElementById('result2').innerHTML = calculateAge(1997, 2, 18);
            document.getElementById('result3').innerHTML = calculateAge(2016, 7, 15);
            document.getElementById('result4').innerHTML = calculateAge(2021, 4, 19);
            document.getElementById('result5').innerHTML = calculateAge(2015, 5, 24);
            document.getElementById('result6').innerHTML = calculateAge(1985, 8, 8);

        }

        // Her saniyede bir güncelle
        setInterval(updateResults, 1000);
        // Sayfa yüklendiğinde başlat
        window.onload = updateResults;
    </script>
</body>
</html>
