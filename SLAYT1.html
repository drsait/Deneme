<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sinematik Fotoğraf Görüntüleyici</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        .viewer-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .viewer-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 5s ease-in-out; /* Sinematik hareket için */
        }

        /* Sinematik efekt örnekleri */
        .cinematic-1 { transform: scale(1.1) translate(-20px, -10px); }
        .cinematic-2 { transform: scale(1.15) translate(20px, 15px); }

        /* Kontrol Butonları */
        .controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .controls.hidden {
            opacity: 0;
        }

        .btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #prevBtn { left: 20px; top: 50%; transform: translateY(-50%); }
        #nextBtn { right: 20px; top: 50%; transform: translateY(-50%); }
        #closeBtn { right: 20px; top: 20px; }
    </style>
</head>
<body>

    <div class="viewer-container" id="viewerContainer">
        <img id="slideImage" src="foto1.jpg" alt="Fotoğraf">
        
        <div class="controls" id="controlsBar">
            <button class="btn" id="prevBtn">⟨</button>
            <button class="btn" id="nextBtn">⟩</button>
            <button class="btn" id="closeBtn">✕ Kapat</button>
        </div>
    </div>

    <script>
        const images = ['foto1.jpg', 'foto2.jpg', 'foto3.jpg']; // Fotoğraf listen
        let currentIndex = 0;
        let isPaused = false;
        let slideTimer;
        let hideTimer;

        const imgElement = document.getElementById('slideImage');
        const container = document.getElementById('viewerContainer');
        const controls = document.getElementById('controlsBar');

        function startShow() {
            if (isPaused) return;
            // Slayt geçiş mantığı buraya eklenebilir
        }

        // Hareketsizlik sonrası butonları gizleme (3 saniye)
        function resetHideTimer() {
            controls.classList.remove('hidden');
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                if (!isPaused) {
                    controls.classList.add('hidden');
                }
            }, 3000);
        }

        // Fotoğrafa dokunma / tıklama olayı (Sinematik modu ve slaydı durdur/başlat)
        container.addEventListener('click', (e) => {
            // Butonlara tıklandığında bu tetiklenmesin
            if (e.target.tagName === 'BUTTON') return;

            isPaused = !isPaused;
            if (isPaused) {
                // Durduruldu: Sinematik hareketi sıfırla, fotoğrafı tam göster, butonları göster
                imgElement.style.transform = 'scale(1) translate(0, 0)';
                controls.classList.remove('hidden');
                clearTimeout(hideTimer);
            } else {
                // Devam et: Sinematik modu ve slaydı yeniden başlat
                resetHideTimer();
            }
        });

        // Fare hareket ettikçe butonları göster ve sayacı sıfırla
        document.addEventListener('mousemove', resetHideTimer);

        // Örnek buton fonksiyonları
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % images.length;
            imgElement.src = images[currentIndex];
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            imgElement.src = images[currentIndex];
        });

        document.getElementById('closeBtn').addEventListener('click', () => {
            alert('Kapat butonuna tıklandı.');
        });

        resetHideTimer();
    </script>
</body>
</html>
