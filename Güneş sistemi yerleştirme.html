<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Güneş Sistemi KML Konumlandırıcı</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121620; color: #fff; margin: 0; }
    .card { background: #1c2333; padding: 20px; border-radius: 8px; max-width: 480px; margin: auto; }
    label { display: block; margin-top: 10px; font-size: 13px; color: #aaa; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: #0e121a; border: 1px solid #334; color: #fff; border-radius: 4px; }
    #map { height: 260px; width: 100%; border-radius: 6px; margin-top: 12px; border: 1px solid #334; }
    button { width: 100%; padding: 11px; margin-top: 10px; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-geo { background: #2563eb; color: #fff; }
    .btn-geo:hover { background: #1d4ed8; }
    .btn-download { background: #ffaa00; color: #000; margin-top: 14px; }
    .btn-download:hover { background: #ffbb22; }
    p { font-size: 12px; color: #889; line-height: 1.4; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="card">
    <h3 style="margin-top:0">☀️ Güneş Sistemi Konumlandırıcı</h3>
    <p>İmleci sürükleyerek veya haritaya tıklayarak Güneş'in merkezini belirle.</p>
    
    <div id="map"></div>

    <button type="button" class="btn-geo" onclick="useCurrentLocation()">📍 Cihazımın Konumunu Al</button>

    <label>Güneş Merkez Enlemi (Latitude):</label>
    <input type="text" id="lat" value="37.313345">

    <label>Güneş Merkez Boylamı (Longitude):</label>
    <input type="text" id="lng" value="40.738034">

    <label>Yörünge Düzlem Yüksekliği (Metre):</label>
    <input type="number" id="alt" value="1200">

    <button type="button" class="btn-download" onclick="generateKML(event)">KML Dosyasını İndir</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const planets = [
      { name: "Merkür", rStr: "3.5 mm", a: 41.58, e: 0.2056, color: "ff33ff33", size: 0.8 },
      { name: "Venüs",  rStr: "8.7 mm", a: 77.69, e: 0.0068, color: "ff00ffff", size: 0.9 },
      { name: "Dünya",  rStr: "9.15 mm", a: 107.42, e: 0.0167, color: "ffffaa00", size: 0.9 },
      { name: "Mars",   rStr: "4.9 mm", a: 163.67, e: 0.0934, color: "ff0000ff", size: 0.8 },
      { name: "Jüpiter",rStr: "10.0 cm", a: 558.86, e: 0.0484, color: "ff00a5ff", size: 1.4 },
      { name: "Satürn", rStr: "8.4 cm", a: 1026.35, e: 0.0541, color: "ff55ffff", size: 1.3 },
      { name: "Uranüs", rStr: "3.6 cm", a: 2061.45, e: 0.0472, color: "ffffff00", size: 1.1 },
      { name: "Neptün", rStr: "3.5 cm", a: 3230.02, e: 0.0086, color: "ffff00aa", size: 1.1 }
    ];

    let latInput = document.getElementById('lat');
    let lngInput = document.getElementById('lng');

    const map = L.map('map').setView([parseFloat(latInput.value), parseFloat(lngInput.value)], 15);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri, Maxar, Earthstar Geographics',
      maxZoom: 19
    }).addTo(map);

    const marker = L.marker([parseFloat(latInput.value), parseFloat(lngInput.value)], {
      draggable: true
    }).addTo(map);

    function updateInputs(lat, lng) {
      latInput.value = lat.toFixed(6);
      lngInput.value = lng.toFixed(6);
    }

    marker.on('dragend', function (e) {
      const pos = e.target.getLatLng();
      updateInputs(pos.lat, pos.lng);
    });

    map.on('click', function (e) {
      marker.setLatLng(e.latlng);
      updateInputs(e.latlng.lat, e.latlng.lng);
    });

    function useCurrentLocation() {
      if (!navigator.geolocation) {
        alert("Tarayıcınız konum servisini desteklemiyor.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const cLat = pos.coords.latitude;
          const cLng = pos.coords.longitude;
          updateInputs(cLat, cLng);
          marker.setLatLng([cLat, cLng]);
          map.setView([cLat, cLng], 17);
        },
        (err) => alert("Konum alınamadı: " + err.message),
        { enableHighAccuracy: true }
      );
    }

    function generateKML(e) {
      if (e) e.preventDefault();

      const cLat = parseFloat(latInput.value);
      const cLng = parseFloat(lngInput.value);
      const alt = parseFloat(document.getElementById('alt').value);

      const mDegLat = 1 / 111139;
      const mDegLng = 1 / (111139 * Math.cos(cLat * Math.PI / 180));

      let bodyPlacemarks = `
      <Placemark>
        <name>Güneş (1 Metre Çap)</name>
        <styleUrl>#sunStyle</styleUrl>
        <Point><altitudeMode>absolute</altitudeMode><coordinates>${cLng},${cLat},${alt}</coordinates></Point>
      </Placemark>`;

      let styles = `
      <Style id="sunStyle"><IconStyle><scale>2.0</scale><color>ff00bbff</color><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle></Style>`;

      planets.forEach((p, idx) => {
        const pId = "p_" + idx;
        styles += `
        <Style id="style_${pId}"><IconStyle><scale>${p.size}</scale><color>${p.color}</color><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle></Style>
        <Style id="orbit_${pId}"><LineStyle><color>${p.color}</color><width>2</width></LineStyle></Style>`;

        const initLng = cLng + (p.a * mDegLng);
        bodyPlacemarks += `
        <Placemark>
          <name>${p.name} (${p.rStr})</name>
          <styleUrl>#style_${pId}</styleUrl>
          <Point><altitudeMode>absolute</altitudeMode><coordinates>${initLng.toFixed(6)},${cLat.toFixed(6)},${alt}</coordinates></Point>
        </Placemark>`;

        let coords = "";
        const b = p.a * Math.sqrt(1 - p.e * p.e);
        const c = p.a * p.e;

        for (let i = 0; i <= 36; i++) {
          const theta = (i / 36) * Math.PI * 2;
          const xMeters = c + (p.a * Math.cos(theta));
          const yMeters = b * Math.sin(theta);
          const pLng = cLng + (xMeters * mDegLng);
          const pLat = cLat + (yMeters * mDegLat);
          coords += `${pLng.toFixed(6)},${pLat.toFixed(6)},${alt} `;
        }

        bodyPlacemarks += `
        <Placemark>
          <name>${p.name} Yörüngesi (${p.a.toFixed(1)} m)</name>
          <styleUrl>#orbit_${pId}</styleUrl>
          <LineString><altitudeMode>absolute</altitudeMode><coordinates>${coords.trim()}</coordinates></LineString>
        </Placemark>`;
      });

      const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Güneş Sistemi (${cLat.toFixed(4)}, ${cLng.toFixed(4)})</name>
    <open>1</open>
    ${styles}
    <Folder>
      <name>Güneş Sistemi Grubu</name>
      <open>1</open>
      ${bodyPlacemarks}
    </Folder>
  </Document>
</kml>`;

      const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Gunes_Sistemi_${cLat.toFixed(4)}_${cLng.toFixed(4)}.kml`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
