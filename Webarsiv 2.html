<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tam Çevrimdışı Web Arşivleyici & Editör</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    input, textarea {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
      width: 100%;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .editor-wrapper {
      position: relative;
      width: 100%;
    }
    .editor-wrapper.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 99998;
      background: var(--bg);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .editor-wrapper.fullscreen textarea {
      height: 100% !important;
      max-height: 100% !important;
      flex: 1;
    }
    textarea {
      height: 280px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.5;
      resize: vertical;
    }
    .btn-editor-fs {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      z-index: 5;
    }
    .btn-editor-fs:hover {
      color: #fff;
      background: var(--accent);
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: #fff;
      background: var(--border);
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-accent {
      background: var(--accent);
      white-space: nowrap;
    }
    .btn-accent:hover {
      background: var(--accent-hover);
    }
    .btn-success {
      background: var(--success);
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    #previewModal {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 99999;
    }
    #previewModal iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #floatingCloseBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: grab;
      z-index: 100000;
      touch-action: none;
      user-select: none;
    }
    #floatingCloseBtn:active {
      cursor: grabbing;
    }
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .input-group {
        flex-direction: column;
      }
      .btn-accent {
        width: 100%;
      }
      .btn-group {
        grid-template-columns: repeat(2, 1fr);
      }
      textarea {
        height: 220px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="input-group">
    <input type="text" id="targetUrl" placeholder="https://ornek.com">
    <button class="btn-accent" id="btnFetch" onclick="fetchAndBundleSource()">Kodu Çek & Paketle</button>
  </div>

  <div class="editor-wrapper" id="editorWrapper">
    <button class="btn-editor-fs" onclick="toggleEditorFs()" id="btnEditorFs">⛶ Tam Ekran</button>
    <textarea id="codeEditor" placeholder="HTML kodları burada listelenecek..."></textarea>
  </div>

  <div class="btn-group">
    <button onclick="copyCode()" id="btnCopy">Kopyala</button>
    <button onclick="downloadCode()">İndir</button>
    <button onclick="runCode()">Çalıştır</button>
    <button class="btn-success" onclick="uploadToGithub()">Yükle</button>
  </div>

  <input type="text" id="fileName" placeholder="Dosya adı">
  <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (repo izni)">
</div>

<div id="previewModal">
  <button id="floatingCloseBtn" title="Kapat (Sürüklenebilir)">✕</button>
  <iframe id="preview"></iframe>
</div>

<script>
  const REPO = 'drsait/Deneme';
  const PROXY_URL = 'https://polished-snow-38e2.yenibirhesap047.workers.dev';

  function setDefaultFileName() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const datePart = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
    const timePart = `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    document.getElementById('fileName').value = `web_arsiv_${datePart}_${timePart}.html`;
  }
  setDefaultFileName();

  async function fetchResource(url, asBase64 = false) {
    try {
      const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
      if (!res.ok) return null;
      if (!asBase64) return await res.text();

      const blob = await res.blob();
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    } catch {
      return null;
    }
  }

  async function fetchAndBundleSource() {
    let rawUrl = document.getElementById('targetUrl').value.trim();
    if (!rawUrl) return alert('Lütfen geçerli bir URL girin.');
    if (!rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) {
      rawUrl = 'https://' + rawUrl;
      document.getElementById('targetUrl').value = rawUrl;
    }

    const btn = document.getElementById('btnFetch');
    btn.textContent = 'İçerik Alınıyor...';
    btn.disabled = true;

    try {
      const baseUrl = new URL(rawUrl);
      const htmlText = await fetchResource(rawUrl, false);
      if (!htmlText) throw new Error('Hedef sayfa okunamadı.');

      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');

      btn.textContent = 'CSS Dosyaları Gömülüyor...';
      const linkElements = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));
      for (const link of linkElements) {
        const href = link.getAttribute('href');
        if (href) {
          const absoluteUrl = new URL(href, baseUrl).href;
          const cssContent = await fetchResource(absoluteUrl, false);
          if (cssContent) {
            const style = doc.createElement('style');
            style.textContent = cssContent;
            link.replaceWith(style);
          }
        }
      }

      btn.textContent = 'Resimler Base64 Yapılıyor...';
      const imgElements = Array.from(doc.querySelectorAll('img'));
      for (const img of imgElements) {
        const src = img.getAttribute('src');
        if (src && !src.startsWith('data:')) {
          const absoluteUrl = new URL(src, baseUrl).href;
          const base64Data = await fetchResource(absoluteUrl, true);
          if (base64Data) {
            img.setAttribute('src', base64Data);
            img.removeAttribute('srcset');
            img.removeAttribute('loading');
          }
        }
      }

      const existingBases = doc.querySelectorAll('base');
      existingBases.forEach((b) => b.remove());

      const fullHtml = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
      document.getElementById('codeEditor').value = fullHtml;
      alert('Tüm CSS ve resimler HTML içine gömüldü. Artık site kapansa dahi bu dosya bağımsız olarak çalışacaktır.');
    } catch (err) {
      alert('Arşivleme işlemi başarısız: ' + err.message);
    } finally {
      btn.textContent = 'Kodu Çek & Paketle';
      btn.disabled = false;
    }
  }

  function copyCode() {
    const content = document.getElementById('codeEditor').value;
    if (!content) return alert('Kopyalanacak kod yok.');
    navigator.clipboard.writeText(content).then(() => {
      const btn = document.getElementById('btnCopy');
      btn.textContent = 'Kopyalandı!';
      setTimeout(() => {
        btn.textContent = 'Kopyala';
      }, 1500);
    });
  }

  function toggleEditorFs() {
    const wrapper = document.getElementById('editorWrapper');
    const btn = document.getElementById('btnEditorFs');
    wrapper.classList.toggle('fullscreen');
    btn.textContent = wrapper.classList.contains('fullscreen') ? '✕ Küçült' : '⛶ Tam Ekran';
  }

  function runCode() {
    const content = document.getElementById('codeEditor').value;
    document.getElementById('preview').srcdoc = content;
    document.getElementById('previewModal').style.display = 'block';
  }

  function closePreview() {
    document.getElementById('previewModal').style.display = 'none';
  }

  const dragBtn = document.getElementById('floatingCloseBtn');
  let isDragging = false, startX, startY, initX, initY, moved = false;

  dragBtn.addEventListener('pointerdown', (e) => {
    isDragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    initX = dragBtn.offsetLeft;
    initY = dragBtn.offsetTop;
    dragBtn.setPointerCapture(e.pointerId);
  });

  dragBtn.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    dragBtn.style.left = `${initX + dx}px`;
    dragBtn.style.top = `${initY + dy}px`;
    dragBtn.style.right = 'auto';
  });

  dragBtn.addEventListener('pointerup', () => {
    isDragging = false;
    if (!moved) closePreview();
  });

  function downloadCode() {
    const content = document.getElementById('codeEditor').value;
    const fileName = document.getElementById('fileName').value.trim() || 'web_arsiv.html';
    const blob = new Blob([content], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
  }

  async function uploadToGithub() {
    const token = document.getElementById('ghToken').value.trim();
    const path = document.getElementById('fileName').value.trim() || 'web_arsiv.html';
    const content = document.getElementById('codeEditor').value;

    if (!token) return alert('GitHub Token alanı boş bırakılamaz.');

    const encodedContent = btoa(unescape(encodeURIComponent(content)));
    const apiUrl = `https://api.github.com/repos/${REPO}/contents/${path}`;

    try {
      let sha = null;
      const checkRes = await fetch(apiUrl, {
        headers: { Authorization: `token ${token}` }
      });
      if (checkRes.ok) {
        const checkData = await checkRes.json();
        sha = checkData.sha;
      }

      const res = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          Authorization: `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Arşiv: ${path}`,
          content: encodedContent,
          sha: sha || undefined
        })
      });

      if (res.ok) alert(`${REPO} reposuna başarıyla yüklendi!`);
      else {
        const err = await res.json();
        alert('Hata: ' + err.message);
      }
    } catch (e) {
      alert('İşlem başarısız: ' + e.message);
    }
  }
</script>
</body>
</html>
