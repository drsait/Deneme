</div>

<script>

    // =====================================================================
    // SADECE BURAYI DEĞİŞTİR
    // =====================================================================

    const AYARLAR = {

        // Birim kodu
        BIRIM_KODU: "461491",

        // Yıl
        YIL: 2026,

        // Ay numarası
        // 1 = Ocak
        // 2 = Şubat
        // 3 = Mart
        // 4 = Nisan
        // 5 = Mayıs
        // 6 = Haziran
        // 7 = Temmuz
        // 8 = Ağustos
        // 9 = Eylül
        // 10 = Ekim
        // 11 = Kasım
        // 12 = Aralık
        AY: 9,

        // AHB adı
        AHB_ADI: "Mardin Kızıltepe 18 Nolu AHB - Mardin"

    };


    // =====================================================================
    // AY BİLGİLERİNİ OTOMATİK OLUŞTUR
    // =====================================================================

    const AY_NUM =
        String(AYARLAR.AY).padStart(2, "0");


    const AY_TARIH =
        `${AYARLAR.YIL}-${AY_NUM}`;


    const AY_ISIMLERI = [
        "",
        "OCAK",
        "ŞUBAT",
        "MART",
        "NİSAN",
        "MAYIS",
        "HAZİRAN",
        "TEMMUZ",
        "AĞUSTOS",
        "EYLÜL",
        "EKİM",
        "KASIM",
        "ARALIK"
    ];


    const AY_ISMI =
        AY_ISIMLERI[AYARLAR.AY];


    // KHT için kullanılan Türkçe ay
    const AY_KHT =
        AY_ISMI;


    // SİNA'daki bazı filtrelerde kullanılan ay formatı
    const AY_SINA =
        AY_ISMI
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toUpperCase();


    // =====================================================================
    // SİNA LİNK ŞABLONLARI
    // =====================================================================

    const LINK_SABLONLARI = {

        // -----------------------------------------------------------------
        // SİNA
        // -----------------------------------------------------------------

        SINA:
            "https://sina.saglik.gov.tr/showcases/SC-DBBEMXEEDFCCEAB/SCI-2N8Y5C2ADDC1FCD?filters=252840={AY_SINA}%26252860={BIRIM_KODU}%26252916={YIL}",


        // -----------------------------------------------------------------
        // KHT
        // -----------------------------------------------------------------

        KHT:
            "https://sina.saglik.gov.tr/showcases/SC-2DF3A82DF98O48J/SCI-VCQ97DDE181J1HA?filters=300699={YIL}%26300707={AY_KHT}%26300711={BIRIM_KODU}",


        // -----------------------------------------------------------------
        // MEMNUNİYET
        // -----------------------------------------------------------------

        MEMNUNIYET:
            "https://sina.saglik.gov.tr/showcases/SC-AA6Q1F9AU1B4B2O/SCI-E52DD7UAC0Y24Z5?filters=27693={YIL}-01-01%252000%253A00%253A00%2627693={YIL}-12-31%252023%253A59%253A59",


        // -----------------------------------------------------------------
        // MUAYENE
        // -----------------------------------------------------------------

        MUAYENE:
            "https://sina.saglik.gov.tr/showcases/SC-AA6Q1F9AU1B4B2O/SCI-E52DD7UAC0Y24Z5?filters=27477={AHB_ADI}",


        // -----------------------------------------------------------------
        // OTİZM
        //
        // Ay artık otomatik olarak:
        //
        // 2026-09
        //
        // şeklinde oluşturuluyor.
        // -----------------------------------------------------------------

        OTIZM:
            "https://sina.saglik.gov.tr/showcases/SC-DBBEMXEEDFCCEAB/SCI-4N2O921XV9IX02M?filters=372133={BIRIM_KODU}%26372137={AY_TARIH}%26372145={AY_TARIH}%26dbmfl-0eebb5447f112m8={AY_TARIH}"

    };


    // =====================================================================
    // LİNK OLUŞTURMA
    // =====================================================================

    function linkOlustur(sablon) {

        let url = sablon;


        const DEGISKENLER = {

            BIRIM_KODU:
                AYARLAR.BIRIM_KODU,

            YIL:
                AYARLAR.YIL,

            AY:
                AY_ISMI,

            AY_SINA:
                AY_SINA,

            AY_KHT:
                AY_KHT,

            AY_TARIH:
                AY_TARIH,

            AHB_ADI:
                AYARLAR.AHB_ADI

        };


        for (
            const [key, val]
            of Object.entries(DEGISKENLER)
        ) {

            url =
                url.replaceAll(
                    `{${key}}`,
                    val
                );

        }


        return url;
    }


    // =====================================================================
    // GERÇEK LİNKLERİ OLUŞTUR
    // =====================================================================

    const FINAL_LINKS = {};


    for (
        const key in LINK_SABLONLARI
    ) {

        FINAL_LINKS[key] =
            linkOlustur(
                LINK_SABLONLARI[key]
            );

    }


    // =====================================================================
    // BU HTML DOSYASININ ADRESİ
    // =====================================================================

    const SAYFA_ADRESI =
        window.location.origin +
        window.location.pathname;


    // =====================================================================
    // BUTONLARI OLUŞTUR
    // =====================================================================

    const container =
        document.getElementById(
            "button-container"
        );


    for (
        const key in FINAL_LINKS
    ) {

        const btn =
            document.createElement("a");


        btn.className =
            "link-btn";


        /*
         * Özel yönlendirme adresi:
         *
         * index.html?url=KHT
         * index.html?url=OTIZM
         */

        btn.href =
            SAYFA_ADRESI +
            "?url=" +
            encodeURIComponent(key);


        // Yeni sekmede aç
        btn.target =
            "_blank";


        btn.rel =
            "noopener noreferrer";


        btn.innerText =
            key;


        container.appendChild(btn);

    }


    // =====================================================================
    // URL PARAMETRESİNİ OKU
    // =====================================================================

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const targetKey =
        urlParams.get("url");


    // =====================================================================
    // GERÇEK SİNA ADRESİNE YÖNLENDİR
    // =====================================================================

    if (targetKey) {

        const key =
            targetKey.toUpperCase();


        const targetUrl =
            FINAL_LINKS[key];


        if (targetUrl) {

            window.location.replace(
                targetUrl
            );

        }

        else {

            document.getElementById(
                "content"
            ).innerHTML = `

                <p class="status">
                    <strong>${key}</strong>
                    adlı bağlantı bulunamadı.
                </p>

                <p>
                    <a href="${SAYFA_ADRESI}">
                        Ana sayfaya dön
                    </a>
                </p>

            `;

        }

    }

</script>

</body>
</html>
