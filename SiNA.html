</div>

<script>

    // =========================================================================
    // 1. SABİT DEĞİŞKENLER
    // =========================================================================

    const PARAMS = {
        BIRIM_KODU: "461491",
        YIL: "2026",
        AY: "EYLUL",
        AY_KHT: "EYLÜL",
        AHB_ADI: "Mardin Kızıltepe 18 Nolu AHB - Mardin"
    };


    // =========================================================================
    // 2. GERÇEK SİNA LİNKLERİ
    // =========================================================================

    const LINK_SABLONLARI = {

        SINA:
            "https://sina.saglik.gov.tr/showcases/SC-DBBEMXEEDFCCEAB/SCI-2N8Y5C2ADDC1FCD?filters=252840={AY}%26252860={BIRIM_KODU}%26252916={YIL}",

        KHT:
            "https://sina.saglik.gov.tr/showcases/SC-2DF3A82DF98O48J/SCI-VCQ97DDE181J1HA?filters=300699={YIL}%26300707={AY_KHT}%26300711={BIRIM_KODU}",

        MEMNUNIYET:
            "https://sina.saglik.gov.tr/showcases/SC-AA6Q1F9AU1B4B2O/SCI-E52DD7UAC0Y24Z5?filters=27693={YIL}-01-01%252000%253A00%253A00%2627693={YIL}-12-31%252023%253A59%253A59",

        MUAYENE:
            "https://sina.saglik.gov.tr/showcases/SC-AA6Q1F9AU1B4B2O/SCI-E52DD7UAC0Y24Z5?filters=27477={AHB_ADI}",

        OTIZM:
            "https://sina.saglik.gov.tr/showcases/SC-DBBEMXEEDFCCEAB/SCI-4N2O921XV9IX02M?filters=372133={BIRIM_KODU}"
    };


    // =========================================================================
    // 3. DEĞİŞKENLERİ LİNKLERE UYGULA
    // =========================================================================

    function linkOlustur(sablon) {

        let url = sablon;

        for (const [key, val] of Object.entries(PARAMS)) {
            url = url.replaceAll(`{${key}}`, val);
        }

        return url;
    }


    // =========================================================================
    // 4. GERÇEK SİNA LİNKLERİNİ OLUŞTUR
    // =========================================================================

    const FINAL_LINKS = {};

    for (const key in LINK_SABLONLARI) {
        FINAL_LINKS[key] = linkOlustur(LINK_SABLONLARI[key]);
    }


    // =========================================================================
    // 5. BU HTML DOSYASININ ADRESİNİ AL
    // =========================================================================

    // Örneğin:
    // https://site.com/index.html

    const SAYFA_ADRESI =
        window.location.origin +
        window.location.pathname;


    // =========================================================================
    // 6. BUTONLARI OLUŞTUR
    // =========================================================================

    const container =
        document.getElementById("button-container");


    for (const key in FINAL_LINKS) {

        const btn = document.createElement("a");

        btn.className = "link-btn";

        /*
         * ARTIK BUTON DOĞRUDAN SİNA'YA GİTMİYOR.
         *
         * Örnek:
         * index.html?url=KHT
         *
         * index.html?url=SINA
         */

        btn.href =
            SAYFA_ADRESI +
            "?url=" +
            encodeURIComponent(key);

        btn.innerText = key;

        container.appendChild(btn);
    }


    // =========================================================================
    // 7. URL PARAMETRESİNİ OKU
    // =========================================================================

    /*
     * Örnek:
     *
     * index.html?url=KHT
     *
     * sonuc:
     * targetKey = "KHT"
     */

    const urlParams =
        new URLSearchParams(window.location.search);

    const targetKey =
        urlParams.get("url");


    // =========================================================================
    // 8. YÖNLENDİRME
    // =========================================================================

    if (targetKey) {

        const key =
            targetKey.toUpperCase();

        const targetUrl =
            FINAL_LINKS[key];

        if (targetUrl) {

            // Sayfayı SİNA adresine yönlendir
            window.location.replace(targetUrl);

        } else {

            document.getElementById("content").innerHTML = `
                <p class="status">
                    <strong>${key}</strong> adlı bağlantı bulunamadı.
                </p>
            `;
        }
    }

</script>

</body>
</html>
