<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Arşiv</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--card);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      transition: transform 0.3s ease;
    }
    .top-bar.hidden { transform: translateY(-100%); }
    .top-bar-row1 { width: 100%; display: flex; }
    .top-bar-row2 {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    input[type="text"] {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 36px 9px 12px;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .btn-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      display: none;
      line-height: 1;
    }
    .btn-clear:hover { color: #fff; }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input { cursor: pointer; accent-color: var(--accent); }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      color: #fff;
    }
    button:active { transform: scale(0.98); }
    .btn-accent { background: var(--accent); }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); }
    .btn-outline { background: var(--border); }
    .btn-outline:hover { background: #475569; }
    .viewport { flex: 1; width: 100%; height: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .hover-trigger { position: fixed; top: 0; left: 0; width: 100%; height: 15px; z-index: 999; }
    .status-badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      z-index: 10;
    }
    #archiveModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 2000;
      padding: 16px;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 850px;
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-card.fullscreen {
      position: fixed;
      inset: 0;
      max-width: 100%;
      max-height: 100%;
      border-radius: 0;
      z-index: 2005;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 16px; font-weight: 600; }
    .editor-wrapper { position: relative; flex: 1; display: flex; }
    textarea {
      width: 100%;
      height: 280px;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }
    .modal-card.fullscreen textarea { height: 100% !important; resize: none; }
    .btn-fs-toggle {
      position: absolute;
      top: 8px;
      right: 10px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 5;
    }
    .modal-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-row input {
      flex: 1;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    #previewModal {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 99999;
    }
    #previewModal iframe { width: 100%; height: 100%; border: none; }
    #floatingCloseBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: grab;
      z-index: 100000;
      touch-action: none;
      user-select: none;
    }
    #floatingCloseBtn:active { cursor: grabbing; }
    @media (max-width: 600px) {
      .btn-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="hover-trigger" id="hoverArea"></div>

  <div class="top-bar" id="topBar">
    <div class="top-bar-row1">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="targetUrl" 
          placeholder="https://example.com" 
          oninput="toggleClearBtn()" 
          onkeydown="if(event.key==='Enter') navigate()"
        >
        <button class="btn-clear" id="btnClear" onclick="clearInput()">✕</button>
      </div>
    </div>
    <div class="top-bar-row2">
      <label class="toggle-label" title="İşaretlenirse resim ve CSS'ler proxy sunucusundan geçer">
        <input type="checkbox" id="chkProxyMedia">Tam Proxy
      </label>
      <div style="display:flex; gap:8px;">
        <button class="btn-accent" onclick="navigate()" id="btnGo">Git</button>
        <button class="btn-success" onclick="openArchiveTools()">📦 Proxy Arşiv</button>
      </div>
    </div>
  </div>

  <div class="viewport">
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div id="statusBar" class="status-badge">Yükleniyor...</div>
  </div>

  <div id="archiveModal">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <button class="btn-outline" onclick="closeArchiveModal()" title="Proxy gezinmesine geri dön">⬅ Geri Dön</button>
        <h3>Proxy Arşiv & Düzenleyici</h3>
        <div style="display:flex; gap:6px; align-items:center;">
          <label class="toggle-label" style="margin-right:4px;" title="Tüm resim ve CSS dosyalarını Base64 ile tek dosyaya gömer">
            <input type="checkbox" id="chkEmbedOffline" checked>Dosya Göm
          </label>
          <button class="btn-outline" onclick="buildArchive()">Yeniden Paketle</button>
          <button class="btn-outline" onclick="closeArchiveModal()">✕</button>
        </div>
      </div>

      <div class="editor-wrapper">
        <button class="btn-fs-toggle" onclick="toggleModalFullscreen()" id="btnModalFs">⛶ Tam Ekran</button>
        <textarea id="codeEditor" placeholder="Sayfa kaynak kodları burada görüntülenecek..."></textarea>
      </div>

      <div class="btn-grid">
        <button class="btn-outline" onclick="copyCode()" id="btnCopy">Kopyala</button>
        <button class="btn-outline" onclick="downloadCode()">İndir</button>
        <button class="btn-outline" onclick="runCode()">Çalıştır</button>
        <button class="btn-success" onclick="uploadToGithub()">GitHub'a Yükle</button>
      </div>

      <div class="modal-row">
        <input type="text" id="fileName" placeholder="Dosya adı">
        <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (repo izni)">
      </div>
    </div>
  </div>

  <div id="previewModal">
    <button id="floatingCloseBtn" title="Kapat (Sürüklenebilir)">✕</button>
    <iframe id="preview"></iframe>
  </div>

  <script>
    const REPO = 'drsait/Deneme';
    const PROXY_URL = 'https://polished-snow-38e2.yenibirhesap047.workers.dev';
    
    const topBar = document.getElementById('topBar');
    const inputUrl = document.getElementById('targetUrl');
    const btnClear = document.getElementById('btnClear');
    let currentRawHtml = '';

    function toggleClearBtn() {
      btnClear.style.display = inputUrl.value.trim() ? 'block' : 'none';
    }

    function clearInput() {
      inputUrl.value = '';
      toggleClearBtn();
      inputUrl.focus();
    }

    document.getElementById('hoverArea').addEventListener('mouseenter', () => {
      topBar.classList.remove('hidden');
    });

    function setDefaultFileName() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      document.getElementById('fileName').value = `proxy_arsiv_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.html`;
    }
    setDefaultFileName();

    function toProxyUrl(u, b) {
      try {
        if (!u || u.startsWith('data:') || u.startsWith('javascript:')) return u;
        return `${PROXY_URL}?url=${encodeURIComponent(new URL(u, b).href)}`;
      } catch {
        return u;
      }
    }

    async function fetchResource(u, b = false) {
      try {
        const r = await fetch(`${PROXY_URL}?url=${encodeURIComponent(u)}`);
        if (!r.ok) return null;
        if (!b) return await r.text();
        const bl = await r.blob();
        return new Promise(res => {
          const fr = new FileReader();
          fr.onloadend = () => res(fr.result);
          fr.readAsDataURL(bl);
        });
      } catch {
        return null;
      }
    }

    async function navigate(override = null) {
      let u = override || inputUrl.value.trim();
      if (!u) return;
      if (!u.startsWith('http://') && !u.startsWith('https://')) u = 'https://' + u;
      inputUrl.value = u;
      toggleClearBtn();

      const btn = document.getElementById('btnGo'),
            st = document.getElementById('statusBar'),
            fr = document.getElementById('proxyFrame'),
            useProxy = document.getElementById('chkProxyMedia').checked;

      btn.disabled = true;
      st.style.display = 'block';
      st.textContent = 'Sayfa yükleniyor...';

      try {
        const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(u)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentRawHtml = await res.text();

        const doc = new DOMParser().parseFromString(currentRawHtml, 'text/html'),
              base = new URL(u);

        let be = doc.querySelector('base');
        if (!be) {
          be = doc.createElement('base');
          doc.head.prepend(be);
        }
        be.href = base.origin + '/';

        if (useProxy) {
          doc.querySelectorAll('img, source, video, audio').forEach(e => {
            const s = e.getAttribute('src');
            if (s) e.setAttribute('src', toProxyUrl(s, base));
            e.removeAttribute('srcset');
          });
          doc.querySelectorAll('link[rel="stylesheet"]').forEach(e => {
            const h = e.getAttribute('href');
            if (h) e.setAttribute('href', toProxyUrl(h, base));
          });
        }

        const sc = doc.createElement('script');
        sc.textContent = `
          let lastY = window.scrollY;
          window.addEventListener('scroll', function() {
            const y = window.scrollY;
            if (y > lastY && y > 50) window.parent.postMessage({type:'SCROLL_DOWN'},'*');
            else if (y < lastY) window.parent.postMessage({type:'SCROLL_UP'},'*');
            lastY = y;
          }, {passive:true});

          document.addEventListener('click', function(e) {
            const l = e.target.closest('a');
            if (l) {
              const h = l.getAttribute('href');
              if (h && !h.startsWith('javascript:') && !h.startsWith('#')) {
                e.preventDefault();
                try {
                  window.parent.postMessage({type:'PROXY_NAVIGATE', url: new URL(h, "${base.origin}").href}, '*');
                } catch(err) {}
              }
            }
          }, true);
        `;
        doc.head.appendChild(sc);

        fr.srcdoc = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        st.style.display = 'none';
      } catch (err) {
        st.textContent = 'Hata: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function buildArchive() {
      const u = inputUrl.value.trim();
      if (!u || !currentRawHtml) return alert('Önce sayfa açmalısınız.');

      const isOffline = document.getElementById('chkEmbedOffline').checked,
            ed = document.getElementById('codeEditor'),
            doc = new DOMParser().parseFromString(currentRawHtml, 'text/html'),
            base = new URL(u);

      if (isOffline) {
        ed.value = 'Dosyalar gömülüyor, bekleyin...';
        for (const l of Array.from(doc.querySelectorAll('link[rel="stylesheet"]'))) {
          const h = l.getAttribute('href');
          if (h) {
            const css = await fetchResource(new URL(h, base).href, false);
            if (css) {
              const st = doc.createElement('style');
              st.textContent = css;
              l.replaceWith(st);
            }
          }
        }
        for (const m of Array.from(doc.querySelectorAll('img'))) {
          const s = m.getAttribute('src');
          if (s && !s.startsWith('data:')) {
            const b64 = await fetchResource(new URL(s, base).href, true);
            if (b64) {
              m.setAttribute('src', b64);
              m.removeAttribute('srcset');
              m.removeAttribute('loading');
            }
          }
        }
        doc.querySelectorAll('base').forEach(b => b.remove());
      } else {
        let be = doc.querySelector('base');
        if (!be) {
          be = doc.createElement('base');
          doc.head.prepend(be);
        }
        be.href = base.origin + '/';
      }
      ed.value = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    }

    function openArchiveTools() {
      if (!currentRawHtml) return alert('Önce sayfa yükleyin.');
      document.getElementById('archiveModal').style.display = 'flex';
      setDefaultFileName();
      buildArchive();
    }

    function closeArchiveModal() {
      document.getElementById('archiveModal').style.display = 'none';
    }

    function toggleModalFullscreen() {
      const c = document.getElementById('modalCard'),
            b = document.getElementById('btnModalFs');
      c.classList.toggle('fullscreen');
      b.textContent = c.classList.contains('fullscreen') ? '✕ Küçült' : '⛶ Tam Ekran';
    }

    function copyCode() {
      const v = document.getElementById('codeEditor').value;
      if (!v) return alert('Kod yok.');
      navigator.clipboard.writeText(v).then(() => {
        const b = document.getElementById('btnCopy');
        b.textContent = 'Kopyalandı!';
        setTimeout(() => b.textContent = 'Kopyala', 1500);
      });
    }

    function runCode() {
      document.getElementById('preview').srcdoc = document.getElementById('codeEditor').value;
      document.getElementById('previewModal').style.display = 'block';
    }

    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
    }

    function downloadCode() {
      const v = document.getElementById('codeEditor').value,
            f = document.getElementById('fileName').value.trim() || 'proxy_arsiv.html',
            a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([v], { type: 'text/html' }));
      a.download = f;
      a.click();
    }

    async function uploadToGithub() {
      const t = document.getElementById('ghToken').value.trim(),
            p = document.getElementById('fileName').value.trim() || 'proxy_arsiv.html',
            c = document.getElementById('codeEditor').value;

      if (!t) return alert('Token gerekli.');

      const enc = btoa(unescape(encodeURIComponent(c))),
            url = `https://api.github.com/repos/${REPO}/contents/${p}`;

      try {
        let sha = null;
        const cr = await fetch(url, { headers: { Authorization: `token ${t}` } });
        if (cr.ok) sha = (await cr.json()).sha;

        const res = await fetch(url, {
          method: 'PUT',
          headers: { Authorization: `token ${t}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Arşiv: ${p}`, content: enc, sha: sha || undefined })
        });

        if (res.ok) alert(`${REPO} reposuna yüklendi!`);
        else alert('Hata: ' + (await res.json()).message);
      } catch (e) {
        alert('İşlem başarısız: ' + e.message);
      }
    }

    const dragBtn = document.getElementById('floatingCloseBtn');
    let isDragging = false, startX, startY, initX, initY, moved = false;

    dragBtn.addEventListener('pointerdown', e => {
      isDragging = true;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      initX = dragBtn.offsetLeft;
      initY = dragBtn.offsetTop;
      dragBtn.setPointerCapture(e.pointerId);
    });

    dragBtn.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      dragBtn.style.left = `${initX + dx}px`;
      dragBtn.style.top = `${initY + dy}px`;
      dragBtn.style.right = 'auto';
    });

    dragBtn.addEventListener('pointerup', () => {
      isDragging = false;
      if (!moved) closePreview();
    });

    window.addEventListener('message', e => {
      if (!e.data) return;
      if (e.data.type === 'SCROLL_DOWN') topBar.classList.add('hidden');
      else if (e.data.type === 'SCROLL_UP') topBar.classList.remove('hidden');
      else if (e.data.type === 'PROXY_NAVIGATE') {
        let rt = e.data.url;
        if (rt.includes('?url=')) rt = new URL(rt).searchParams.get('url') || rt;
        navigate(rt);
      }
    });
  </script>
</body>
</html>
