<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Piyasa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .card { background: #fff; width: 100%; max-width: 360px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h3 { font-size: 1.1rem; color: #0f172a; }
    button { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 14px; }
    button:active { background: #e2e8f0; }
    .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
    .val { font-weight: 700; color: #0f766e; }
    .time { font-size: 0.75rem; text-align: center; color: #94a3b8; margin-top: 14px; }
  </style>
</head>
<body>

<div class="card">
  <div class="head">
    <h3>Piyasa (TL)</h3>
    <button onclick="location.reload()" title="Yenile">🔄</button>
  </div>
  <div class="row"><span>Dolar</span><span id="usd" class="val">-</span></div>
  <div class="row"><span>Euro</span><span id="eur" class="val">-</span></div>
  <div class="row"><span>Gram Altın</span><span id="gold" class="val">-</span></div>
  <div id="time" class="time"></div>
</div>

<script>
  async function load() {
    try {
      const [cur, gold] = await Promise.all([
        fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json()),
        fetch('https://api.gold-api.com/price/XAU').then(r => r.json())
      ]);
      const usd = cur.rates.TRY;
      document.getElementById('usd').innerText = `₺${usd.toFixed(4)}`;
      document.getElementById('eur').innerText = `₺${(usd / cur.rates.EUR).toFixed(4)}`;
      document.getElementById('gold').innerText = `₺${((gold.price * usd) / 31.1035).toFixed(2)}`;
      document.getElementById('time').innerText = new Date().toLocaleTimeString('tr-TR');
    } catch {
      document.getElementById('time').innerText = 'Hata oluştu';
    }
  }
  load();
</script>

</body>
</html>
